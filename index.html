let DAY=today(), FOLLOW=true;          // FOLLOW: roll over to the new day at midnight

/* ---------- the numbers ---------- */
function entries(d){ return P().days[d||DAY]||[]; }
function totals(d){
  return entries(d).reduce((a,e)=>{ a.k+=e.k*e.q; a.p+=e.p*e.q; a.c+=e.c*e.q; a.f+=e.f*e.q; return a; },
    {k:0,p:0,c:0,f:0});
}
/* Calories count as on target within 5% either side; protein once it is reached. */
const KBAND=0.05;
function status(t,g){
  return {kHit: g.k>0 && t.k>=g.k*(1-KBAND) && t.k<=g.k*(1+KBAND),
          pHit: g.p>0 && t.p>=g.p,
          over: g.k>0 && t.k>g.k*(1+KBAND)};
}
function onTarget(d){ const s=status(totals(d),P().goal); return s.kHit && s.pHit; }

function firstDay(){ const k=Object.keys(P().days).sort(); return k.length?k[0]:''; }
function sinceStart(){
  const f=firstDay(); if(!f) return 'DAY 1';
  const days=daysBetween(f,today())+1;
  return days<7 ? 'DAY '+days : 'WEEK '+(Math.floor((days-1)/7)+1)+' \u00b7 DAY '+days;
}
/* "100 g", "250 ml", "1 bar (45 g)": anything with a weight in it is logged by weight. */
function gramsOf(sv){
  const m=String(sv||'').match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i);
  if(!m) return null;
  const n=parseFloat(m[1].replace(',','.'));
  return n>0 ? {n:n, u:m[2].toLowerCase()} : null;
}
function qtyTxt(e){
  const g=gramsOf(e.sv);
  if(g) return r1(e.q*g.n)+' '+g.u;
  return (e.q===1?'':r1(e.q)+' \u00d7 ')+e.sv;
}

/* ---------- merging ----------
   Union of both sides, object by object: the later edit of anything wins, and
   anything deleted after its last edit stays deleted. Targets follow whichever copy
   was touched last. Nothing logged on either phone is ever lost to the other. */
function mergeProfile(a,b){
  const o=blankProfile();
  const newer=(a.at||0)>=(b.at||0)?a:b;
  o.goal=Object.assign({},newer.goal);
  [b.del||{},a.del||{}].forEach(d=>Object.keys(d).forEach(id=>{ o.del[id]=Math.max(o.del[id]||0,d[id]); }));
  const cut=Date.now()-120*864e5;                          // tombstones older than this are dropped
  Object.keys(o.del).forEach(id=>{ if(o.del[id]<cut) delete o.del[id]; });
  const gone=x=>o.del[x.id] && o.del[x.id]>=(x.e||0);
  const fm={};
  (b.foods||[]).concat(a.foods||[]).forEach(f=>{
    const x=fm[f.id]; if(!x || (f.e||0)>(x.e||0) || ((f.e||0)===(x.e||0) && (f.u||0)>(x.u||0))) fm[f.id]=f;
  });
  o.foods=Object.values(fm).filter(f=>!gone(f)).sort((x,y)=>(y.u||0)-(x.u||0) || (x.id<y.id?-1:1));
  const days={};
  [b,a].forEach(p=>Object.keys(p.days||{}).forEach(d=>{
    (days[d]=days[d]||{});
    p.days[d].forEach(e=>{ const x=days[d][e.id]; if(!x || (e.e||0)>(x.e||0)) days[d][e.id]=e; });
  }));
  Object.keys(days).sort().forEach(d=>{
    const v=Object.values(days[d]).filter(e=>!gone(e)).sort((x,y)=>(x.t||0)-(y.t||0) || (x.id<y.id?-1:1));
    if(v.length) o.days[d]=v;
  });
  Object.keys(Object.assign({},b.hit||{},a.hit||{})).sort().forEach(d=>{
    const x=(a.hit||{})[d]||{}, y=(b.hit||{})[d]||{};
    o.hit[d]={k:!!(x.k||y.k), p:!!(x.p||y.p)};
  });
  o.at=Math.max(a.at||0,b.at||0);
  return cleanProfile(o);
}

/* ---------- GitHub ----------

   this device only. A sync always reads first, merges, and writes only if the
   result differs from what is already there. */
const GH_API='https://api.github.com';
function ghCfg(){
  const g=DB.gh||{};

}
function ghSave(patch){ DB.gh=Object.assign(ghCfg(),patch); save(); }

async function ghReq(path,opt){

    'X-GitHub-Api-Version':'2022-11-28'}, (opt&&opt.headers)||{});

}

async function ghGet(name){

    if(!r2.ok) throw r2.status;

}
async function ghPut(name,prof,sha){
  const c=ghCfg();

    message:'log: '+name+' '+today(),
    content:b64(JSON.stringify({v:1, app:'food-log', name:name, profile:prof})),
    branch:c.branch, sha:sha||undefined})});
}
let GHT=0, GHBUSY=false, GHAGAIN=false;
function ghQueue(){ if(!ghOn()) return; clearTimeout(GHT); GHT=setTimeout(()=>{ GHT=0; ghSync(DB.cur,true); },1500); }
function ghFlush(){ if(GHT){ clearTimeout(GHT); GHT=0; ghSync(DB.cur,true); } }
function ghMsg(e){
  return e===401?'bad token' : e===403?'token cannot write here' : e===404?'repo not found'
       : typeof e==='number'?'error '+e : 'offline';
}
async function ghSync(name,quiet){
  if(!ghOn()) return 'off';
  if(GHBUSY){ GHAGAIN=true; return 'busy'; }
  GHBUSY=true; refreshCog();
  try{
    for(let attempt=0; attempt<3; attempt++){
      const rem=await ghGet(name);
      const local=DB.profiles[name]||blankProfile();
      const merged=rem.prof ? mergeProfile(local,rem.prof) : cleanProfile(local);
      const mj=JSON.stringify(merged);
      if(DB.profiles[name] && mj!==JSON.stringify(local)){
        DB.profiles[name]=merged; save();
        if(name===DB.cur) go(true);
      }
      if(rem.prof && mj===JSON.stringify(rem.prof)) break;       // already there
      const r=await ghPut(name,merged,rem.sha);
      if(r.status===409 || r.status===422) continue;               // moved under us: read again
      if(!r.ok) throw r.status;
      break;
    }
    ghSave({at:Date.now(), err:''});
    if(!quiet){ toast('SYNCED TO GITHUB'); sfx('done'); }
    return 'ok';
  }catch(e){
    const msg=ghMsg(e);
    ghSave({err:msg});
    if(!quiet){ toast('SYNC: '+msg.toUpperCase()); sfx('nope'); }
    return msg;
  }finally{
    GHBUSY=false; refreshCog();

  }

/* Profiles someone else created on another phone show up here. */
async function ghDiscover(){
  if(!ghOn()) return [];

  try{
    const r=await ghReq('/repos/'+c.repo+'/contents/data?ref='+encodeURIComponent(c.branch));
    if(!r.ok) return [];
    const j=await r.json(); if(!Array.isArray(j)) return [];
    const names=j.filter(f=>/\.json$/.test(f.name)).map(f=>{ try{ return cleanName(decodeURIComponent(f.name.slice(0,-5))); }catch(e){ return ''; } }).filter(Boolean);
    let added=0;

  }catch(e){ return []; }
}
async function ghSyncAll(quiet){

  if(!quiet){ if(res==='ok'){ toast('SYNCED '+names.length+' PROFILE'+(names.length===1?'':'S')); sfx('done'); }
              else { toast('SYNC: '+res.toUpperCase()); sfx('nope'); } }
  return res;
}
async function ghDelete(name){
  if(!ghOn()) return;
  try{
    const rem=await ghGet(name); if(!rem.sha) return;
    await ghReq(ghUrl(name),{method:'DELETE',body:JSON.stringify({message:'remove profile '+name,
      sha:rem.sha, branch:ghCfg().branch})});

}
function ghWhen(){
  const c=ghCfg();
  if(!c.tok) return 'not connected';
  if(c.err) return c.err;
  if(!c.at) return 'connected, nothing sent yet';
  const mins=Math.round((Date.now()-c.at)/60000);
  return mins<1?'synced just now':mins<60?'synced '+mins+'m ago':mins<2880?'synced '+Math.round(mins/60)+'h ago':'synced '+Math.round(mins/1440)+'d ago';

let AC=null, BUS=null;
/* playback while music is running, ambient the rest of the time */
function wantSession(){
  try{
    if(!navigator.audioSession) return;
    const playing = typeof PL!=='undefined' && PL.audio && !PL.audio.paused;
    navigator.audioSession.type = playing ? 'playback' : 'ambient';
  }catch(e){}
}
function acx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  /* Ask for the right session before anything makes a sound. Ambient means mix with
     whatever else is playing rather than interrupting it, at the cost of the silent
     switch muting us — right for interface cues. But the tap sound fires on the same
     press as a track, so if it asked for ambient unconditionally it would pull the
     session out from under the music a moment after it started. wantSession decides. */
  wantSession();
  try{ AC=new C(); }catch(e){ return null; }
  const inp=AC.createGain(); inp.gain.value=1;
  /* keep the very bottom out so it stays clean on a phone speaker, and take the
     hardest edge off the top */
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.7;
  /* a short delay with a little feedback: the tail is what makes it read as
     electronic rather than as a beep */

  const fb=AC.createGain(); fb.gain.value=0.26;
  const wet=AC.createGain(); wet.gain.value=0.22;
  const out=AC.createGain(); out.gain.value=0.9;
  inp.connect(hp); hp.connect(lp);
  lp.connect(out);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
  out.connect(AC.destination);
  BUS=inp;
  return AC;
}
/* A breath of filtered static under each cue: quiet, wide, decaying fast. It is
   what stops the tones sounding like a piano app. */
let NOISE=null;
function noiseBuf(c){
  if(NOISE) return NOISE;
  const len=Math.floor(c.sampleRate*0.6);
  NOISE=c.createBuffer(1,len,c.sampleRate);
  const d=NOISE.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return NOISE;
}
function hiss(dur,vol,delay,freq){
  const c=acx(); if(!c) return;

  const src=c.createBufferSource(); src.buffer=noiseBuf(c); src.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass';
  f.frequency.value=freq||2600; f.Q.value=0.7;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(BUS||c.destination);
  src.start(t0); src.stop(t0+dur+0.05);

/* One voice: two detuned oscillators, soft in and soft out, optional glide and a
   shallow shimmer. No clicks anywhere — every stage is a ramp. */
function tone(freq,dur,vol,delay,o){
  const c=acx(); if(!c) return;
  o=o||{};
  const t0=c.currentTime+(delay||0);
  const env=c.createGain();
  const det=o.detune===undefined?5:o.detune;
  [0,det].forEach((d,i)=>{
    const osc=c.createOscillator();
    osc.type=o.type||(i?'triangle':'sine');
    osc.frequency.setValueAtTime(freq,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur*(o.bend||0.85));
    osc.detune.value=d;
    osc.connect(env);
    osc.start(t0); osc.stop(t0+dur+0.05);
  });
  const a=o.attack||0.012;
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.exponentialRampToValueAtTime(vol,t0+a);
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  if(o.shimmer){
    const lfo=c.createOscillator(), depth=c.createGain();
    lfo.type='sine'; lfo.frequency.value=o.shimmer;
    depth.gain.value=vol*0.22;
    lfo.connect(depth); depth.connect(env.gain);
    lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  env.connect(BUS||c.destination);
}
/* A dyad — two notes together read as a chord rather than a beep. */
function dyad(a,b,dur,vol,delay,o){ tone(a,dur,vol,delay,o); tone(b,dur,vol*0.8,delay,o); }
let SFXAT=0;
const HISS={tap:[0.07,0.012],open:[0.13,0.016],close:[0.15,0.013],confirm:[0.34,0.018],

  level:[0.6,0.022],done:[0.7,0.02],nope:[0.28,0.02]};
function sfx(name){
  if(DB.sfx===false) return;

  SFXAT=Date.now();
  const hs=HISS[name]; if(hs) hiss(hs[0],hs[1],0,name==='rest'?1400:2600);
  switch(name){
    /* moving around: brief, soft, high */
    case 'tap':     tone(2100,0.06,0.05,0,{attack:0.006}); break;
    case 'open':    tone(1046,0.12,0.055,0,{to:1568,bend:0.6}); break;
    case 'close':   tone(1046,0.14,0.045,0,{to:660,bend:0.7}); break;
    /* a set logged: a quick rising major arpeggio, bright and a little triumphant,
       landing on a shimmering top note — reads as a small win, not just a click */
    case 'confirm': tone(1046,0.07,0.045,0);
                    tone(1318,0.07,0.045,0.045);
                    tone(1568,0.09,0.05,0.09);
                    tone(2093,0.22,0.05,0.135,{shimmer:10}); break;
    case 'record':  tone(1318,0.09,0.05,0);
                    tone(1760,0.09,0.05,0.06);
                    dyad(2093,2637,0.3,0.042,0.12,{shimmer:7}); break;
    case 'rest':    tone(660,0.13,0.035,0,{to:520,bend:0.8}); break;
    /* rest over: three soft pulses climbing, with the delay left ringing */
    case 'clear':   tone(1175,0.13,0.055,0,{shimmer:11});
                    tone(1568,0.13,0.055,0.15,{shimmer:11});
                    dyad(2093,3136,0.34,0.05,0.3,{shimmer:8}); break;
    /* session start: a sweep up into a held dyad */
    case 'start':   tone(392,0.34,0.05,0,{to:1046,bend:0.9,attack:0.03});
                    dyad(1046,1568,0.4,0.04,0.3,{shimmer:6,attack:0.05}); break;
    case 'level':   [1046,1318,1568,2093].forEach((f,i)=>tone(f,i===3?0.42:0.11,0.05,i*0.085,
                      i===3?{shimmer:7}:{}));
                    break;
    case 'done':    dyad(1046,1568,0.16,0.045,0);
                    dyad(1318,1976,0.5,0.045,0.17,{shimmer:6,attack:0.04}); break;
    case 'nope':    tone(440,0.26,0.045,0,{to:196,bend:0.9,type:'triangle'}); break;
  }
}
/* Safari's toolbar slides in and out, so the visible height is not innerHeight. */
function viewH(){ return (window.visualViewport && window.visualViewport.height) || window.innerHeight; }

   cleared first, so a fast tap cannot leave two of them layered. */
let HITIV=null, HITEND=null;

   leave two fields fighting over the same contents or a static wash stranded. */
function panelHitStop(){
  if(HITIV){ clearInterval(HITIV); HITIV=null; }
  if(HITEND){ clearTimeout(HITEND); HITEND=null; }
  const disp=document.getElementById('uiwarpDisp');
  if(disp) disp.setAttribute('scale',0);
  document.querySelectorAll('.uistatic').forEach(x=>{ if(x.parentNode) x.parentNode.removeChild(x); });
  document.querySelectorAll('.sheet.hit,#v-train.hit').forEach(x=>{ x.classList.remove('hit'); x.style.removeProperty('--gdur'); });
}
function panelHit(sh){
  if(!sh) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || document.hidden) return;
  panelHitStop();
  const dur=Math.round(RND(190,260));
  sh.style.setProperty('--gdur',dur+'ms');
  sh.classList.add('hit');
  const st=document.createElement('div');
  st.className='uistatic';
  /* the wash reads --gdur off itself: it hangs on the body, not on the panel, so the
     panel's copy of the variable never reaches it */
  st.style.setProperty('--gdur',dur+'ms');
  document.body.appendChild(st);
  /* How hard the field pushes, and how coarse it is, frame by frame: a hard tear,
     then a couple of smaller ones, settling to nothing. The vertical frequency is the
     one that matters — it decides how many waves fit down the panel. */
  const F=[[62,'0.006 0.20'],[16,'0.002 0.07'],[48,'0.008 0.26'],[9,'0.001 0.04'],
           [38,'0.005 0.17'],[6,'0.002 0.09'],[24,'0.007 0.22'],[3,'0.001 0.05'],
           [14,'0.004 0.13'],[0,'0.002 0.09']];
  const disp=document.getElementById('uiwarpDisp'), noise=document.getElementById('uiwarpNoise');
  let i=0;
  const step=()=>{
    const f=F[i++];
    if(!f) return;
    if(disp) disp.setAttribute('scale',f[0]);
    if(noise){ noise.setAttribute('baseFrequency',f[1]); noise.setAttribute('seed',Math.floor(RND(1,90))); }
  };
  step();
  HITIV=setInterval(step, Math.max(16, Math.round(dur/F.length)));
  HITEND=setTimeout(()=>{
    clearInterval(HITIV); HITIV=null;
    if(disp) disp.setAttribute('scale',0);
    sh.classList.remove('hit');
    sh.style.removeProperty('--gdur');
    if(st.parentNode) st.parentNode.removeChild(st);
  }, dur+30);
}
function topSheet(){
  const l=document.querySelectorAll('#sheetWrap .sheet:not(.out)');

/* Open a sheet. Replacing is the default; stacking keeps what is underneath on
   screen, which is what a sub-panel should do — stepping into the weigh-in from
   Progress should leave Progress behind it, not the dashboard. */
function setSheet(html,stack){
  /* Sheets stop at the top of the bar using a measurement taken on a timer. Take a
     fresh one now, or a sheet opened before the first tick lands underneath it. */
  syncPad(true);
  const wrap=document.getElementById('sheetWrap');
  const had=!!wrap.querySelector('.veil:not(.out)');
  if(stack && had){
    const depth=wrap.querySelectorAll('.sheet').length;
    const below=topSheet();
    const box=document.createElement('div');
    box.className='layer';
    box.innerHTML=html;
    const v=box.querySelector('.veil'), sh=box.querySelector('.sheet');
    if(v){ v.style.zIndex=65+depth*10; v.classList.add('noanim'); v.removeAttribute('id'); v.classList.add('vstack'); }
    if(sh) sh.style.zIndex=70+depth*10;
    /* stacked over a full panel it is still the same screen: interference, no tune-in */
    const same = sh && below && sh.classList.contains('full') && below.classList.contains('full');
    if(same && sh) sh.classList.add('cut');
    wrap.appendChild(box);
    if(same) panelHit(sh);
    lockScroll();
    return;
  }
  /* Moving between full-screen panels — settings and everything it opens — is one
     screen changing what it shows, not a new screen arriving. The outgoing panel is
     backdrop it is standing on is reused, the incoming panel replaces the outgoing one
     outright, and the contents take the hit. Nothing behind it is ever exposed. */
  const oldSh=had?topSheet():null;   // the one on screen, not the first in the markup
  const tmp=document.createElement('div');
  tmp.innerHTML=html;
  const nv=tmp.querySelector('.veil'), ns=tmp.querySelector('.sheet');
  if(oldSh && ns && oldSh.classList.contains('full') && ns.classList.contains('full')){
    /* ids must not be answered by the panel on its way out */
    oldSh.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    oldSh.removeAttribute('id');
    oldSh.classList.add('held');
    /* two moves in quick succession must not leave a pile of frozen panels */
    wrap.querySelectorAll('.sheet.held').forEach(x=>{
      if(x!==oldSh && x.parentNode) x.parentNode.removeChild(x);
    });
    wrap.querySelectorAll('.veil').forEach(v=>{ v.classList.add('noanim'); v.classList.add('panel'); });
    if(nv && nv.parentNode) nv.parentNode.removeChild(nv);   // the backdrop is already there
    ns.classList.add('cut');        // same screen, new contents: no tune-in
    wrap.appendChild(ns);
    /* the backdrop behind it is opaque, so the panel being left can go at once */
    if(oldSh.parentNode) oldSh.parentNode.removeChild(oldSh);
    panelHit(ns);
    lockScroll();
    return;
  }
  wrap.innerHTML=html;
  lockScroll();                 // immediately, not a tick later on the observer
  const bv=wrap.querySelector('.veil'), bs=wrap.querySelector('.sheet');
  if(bv && bs && bs.classList.contains('full')) bv.classList.add('panel');
  if(!had) return;
  const v=wrap.querySelector('.veil'); if(v) v.classList.add('noanim');
  const sh=wrap.querySelector('.sheet'); if(sh) sh.classList.add('swapin');
}
/* Remove layers outright, with no animation — used when a panel is about to be
   rebuilt over itself, so the stack does not grow every time something is saved. */
function dropLayers(n){
  const wrap=document.getElementById('sheetWrap');

    const l=wrap.querySelectorAll('.layer');
    if(!l.length) return;
    const box=l[l.length-1];
    if(box.parentNode) box.parentNode.removeChild(box);
  }
}
/* Close just the top layer, revealing whatever it was opened from. */

  /* A full panel closing onto another full panel is the same screen again: the layer

     is still on. */

const scrY=()=>document.body.scrollTop;
const scrTo=y=>{ document.body.scrollTop=y; };
let SCROLLA=0;
/* The glide to the next set, and the check that follows it once it has landed. */
const SCROLLGLIDE=1150;
function glideTo(y,ms){
  const max=Math.max(0,document.body.scrollHeight-viewH());
  y=Math.min(max,Math.max(0,y));
  const from=scrY(), d=y-from;
  if(Math.abs(d)<2) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ scrTo(y); return; }
  /* Date.now throughout: the timestamp rAF hands back has a different origin. */
  const id=++SCROLLA, t0=Date.now(), dur=ms||700;
  const ease=t=>t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step=()=>{
    if(id!==SCROLLA) return;
    const p=Math.min(1,(Date.now()-t0)/dur);
    scrTo(from+d*ease(p));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
window.addEventListener('touchstart',()=>{ SCROLLA++; },{passive:true});

/* ---------- the rolling static ----------
   Each pass gets its own height, brightness, speed and travel, and the gap before
   the next one is random too, so it never settles into a rhythm. Roughly one pass
   in six stutters partway down; roughly one in twelve drifts upward instead. */
const RND=(a,b)=>a+Math.random()*(b-a);
/* A thin line of interference crossing the screen at a fixed rate, with a random
   pause before the next one so the cycle never reads as a metronome. It buzzes once
   per crossing, at a random point along the way, and never at any other time. */
const ROLLSEC=6.8;      // a slow drift down the glass
let BUZZT=0, BUZZING=false, ROLLBUZZ=0;
function buzz(el){
  if(BUZZING) return;                 // one flurry at a time, never overlapping
  BUZZING=true;
  /* At rest it is barely there. The buzz is the moment it bites: the static jumps,
     the torn lines come up, and the blur on whatever is behind it trebles. */
  const hit=()=>{
    el.style.setProperty('--sk',RND(-3.4,3.4).toFixed(2)+'deg');
    el.style.setProperty('--tx',Math.round(RND(-18,18))+'px');
    el.style.setProperty('--go',RND(.42,.66).toFixed(3));
    el.style.setProperty('--ln','1');
    el.style.setProperty('--bf',RND(1.8,3).toFixed(2)+'px');
    el.style.setProperty('--bc','1.2'); el.style.setProperty('--bb','1.1');
    el.style.opacity=RND(0.85,1.15).toFixed(2);
  };
  const rest=()=>{
    el.style.setProperty('--sk','0deg');
    el.style.setProperty('--tx','0px');
    el.style.setProperty('--go','.1');
    el.style.setProperty('--ln','.5');
    el.style.setProperty('--bf','.55px');
    el.style.setProperty('--bc','1.05'); el.style.setProperty('--bb','1.02');
    el.style.opacity=RND(0.4,0.62).toFixed(2);
    BUZZING=false; BUZZT=0;
  };
  let n=0; const shots=Math.round(RND(3,7));
  (function again(){
    hit(); n++;
    BUZZT = n<shots ? setTimeout(again,RND(28,70)) : setTimeout(rest,RND(40,90));
  })();

function rollPass(){
  const el=document.querySelector('.roll');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!el || reduce) return;
  if(document.hidden) return setTimeout(rollPass,600);
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const h=Math.round(RND(14,34));          // a line, never a band
  el.style.height=h+'px';
  el.style.opacity=RND(0.4,0.62).toFixed(2);
  const from=-h-10, to=vh+10;
  const rate=(vh+40)/ROLLSEC;              // fixed pixels per second
  const dur=Math.round((to-from)/rate*1000);
  let a;
  try{
    a=el.animate([{transform:'translate3d(0,'+from+'px,0)'},
                  {transform:'translate3d(0,'+to+'px,0)'}],
                 {duration:dur,easing:'linear'});
  }catch(e){ el.style.opacity=0; return setTimeout(rollPass,2000); }
  clearTimeout(ROLLBUZZ);
  ROLLBUZZ=setTimeout(()=>buzz(el), dur*RND(0.15,0.8));   // one buzz per crossing
  a.onfinish=()=>{
    clearTimeout(ROLLBUZZ);            // nothing buzzes between crossings
    el.style.opacity=0;
    /* Long, uneven gaps: the line is an occasional event, not a fixture. */
    setTimeout(rollPass, RND(6000,38000));
  };
}
/* Poor signal, drawn frame by frame. Each row takes its own base brightness before
   the per-pixel noise goes on top — that horizontal correlation is what separates
   television static from a field of random dots — and rows occasionally tear into a
   bright or black run. Redrawn about 24 times a second, and only while a line is
   actually on screen. */
let NCTX=null, NIMG=null, NLAST=0, NOCANVAS=false;
function drawStatic(){
  if(NOCANVAS) return;                       // asked once, refused; stop asking
  const el=document.querySelector('.roll');
  const cv=document.getElementById('rollCv');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!cv || !el || reduce) return;
  requestAnimationFrame(drawStatic);
  const now=Date.now();
  if(now-NLAST < 42) return;                 // ~24 frames a second is plenty
  NLAST=now;
  if(document.hidden || +el.style.opacity===0) return;
  if(!NCTX){
    NCTX=cv.getContext && cv.getContext('2d');
    if(!NCTX){ cv.style.display='none'; NOCANVAS=true; return; }   // no canvas: drop the layer, keep the line
    NIMG=NCTX.createImageData(cv.width,cv.height);
  }
  paintNoise(NCTX,NIMG,cv.width,cv.height,BUZZING);
}
/* One frame of static. Each row takes its own base level before the per-pixel noise
   goes on, and rows sometimes tear into a blown-out or crushed run — that is what
   separates signal noise from a field of dots. */
function paintNoise(ctx,img,w,h,hot){
  const d=img.data;
  for(let y=0;y<h;y++){
    let base=RND(hot?40:20, hot?150:95);
    const tear=Math.random() < (hot?0.22:0.07);
    const tearAt=tear?Math.floor(RND(0,w)):-1;
    const tearLen=tear?Math.floor(RND(6,w*0.6)):0;
    const bright=Math.random()<0.6;
    for(let x=0;x<w;x++){
      let v=base+RND(-55,55);
      if(tear && x>=tearAt && x<tearAt+tearLen) v = bright? v+RND(60,130) : v*0.25;
      if(v<0) v=0; if(v>255) v=255;
      const i=(y*w+x)*4;
      d[i]=v; d[i+1]=v*1.03>255?255:v*1.03; d[i+2]=v*0.94;   // a touch of green
      d[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
}

   Skipped while a sheet is open, so it never lands mid-entry. */
let FUZZING=false;
function screenFuzz(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || document.hidden || document.querySelector('.sheet')) return fuzzNext();
  const root=document.documentElement;
  FUZZING=true;

  root.style.setProperty('--gdur',dur+'ms');

    root.classList.remove('glitching');

      if(r.bottom>viewH()-fabH()-10 || r.top<0) setTimeout(()=>glideTo(scrY()+r.top-viewH()*0.35,650),60);
    }
  }
}
function stepDay(n){
  const t=today();
  const next=shift(DAY,n);
  if(next>t) return;
  DAY=next; FOLLOW=(DAY===t);
  sfx('open');
  render();
  panelHit(document.getElementById('v-train'));
}
function paintFab(){
  const f=document.getElementById('fab'); if(!f) return;
  syncPad();
  const g=P().goal, t=totals(), s=status(t,g), n=entries().length;
  let cls='fab', st;
  if(!n) st='STANDBY \u00b7 NOTHING LOGGED';
  else if(s.kHit&&s.pHit){ cls='fab go'; st='TARGET MET'; }
  else if(s.over){ cls='fab over'; st='OVER BUDGET'; }
  else if(s.pHit) st='PROTEIN SECURED';
  else st='ON TRACK';
  if(DAY!==today()) st=shortDay(DAY)+' \u00b7 '+st;
  const rem=Math.round(g.k-t.k), pr=Math.max(0,Math.round(g.p-t.p));
  const line=(rem>=0?fmt(rem)+' KCAL LEFT':fmt(-rem)+' KCAL OVER')+
             (g.p?(pr?' \u00b7 '+pr+' G PROTEIN TO GO':' \u00b7 PROTEIN DONE'):'');
  f.className=cls;
  const row=document.getElementById('fabRow');
  if(row) row.innerHTML='<span class="fx"><span class="fl">'+st+'</span><span class="fn">'+line+'</span></span>'+
                        '<span class="fv">+</span>';
  const seg=document.getElementById('stripSeg');
  if(seg){
    const N=24, on=g.k>0?Math.min(N,Math.round(t.k/g.k*N)):0;
    let b=''; for(let i=0;i<N;i++) b+='<b class="'+(i<on?(s.over?'ov':'on'):'')+'"></b>';
    seg.innerHTML=b;
  }
  const cap=document.getElementById('stripCap');
  if(cap) cap.textContent=fmt(t.k)+' / '+fmt(g.k)+' KCAL \u00b7 P '+Math.round(t.p)+' / '+g.p+' G';
}
function fabTap(){
  if(document.querySelector('#sheetWrap .sheet:not(.out)')) return;
  openAdd(DAY===today()?defaultMeal():(ADD.meal!=null?ADD.meal:0));
}
function go(keepScroll){ render(); if(!keepScroll) scrTo(0); }

/* ---------- targets reached ----------
   Each is marked once a day. Reaching one plays the record cue; reaching the second
   while the first still holds takes over the screen. */
function checkHits(){
  const d=DAY, g=P().goal, s=status(totals(d),g);
  const h=P().hit[d]||{k:false,p:false};
  const newK=s.kHit&&!h.k, newP=s.pHit&&!h.p;
  if(!newK && !newP) return false;
  P().hit[d]={k:h.k||s.kHit, p:h.p||s.pHit};
  if(s.kHit && s.pHit){ setTimeout(()=>celebrate(d),460); return true; }
  sfx('record');
  try{ navigator.vibrate && navigator.vibrate([40,40,80]); }catch(e){}
  toast(newP?'PROTEIN TARGET SECURED':'CALORIES ON TARGET');
  return true;
}
function fuzzOnce(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || FUZZING) return;
  const root=document.documentElement;
  FUZZING=true;
  const dur=Math.round(RND(420,560));
  root.style.setProperty('--gdur',dur+'ms');
  root.classList.add('glitching');
  const st=document.createElement('div'); st.className='uistatic';
  document.body.appendChild(st);
  setTimeout(()=>{
    root.classList.remove('glitching'); root.style.removeProperty('--gdur');
    if(st.parentNode) st.parentNode.removeChild(st);
    FUZZING=false;
  },dur+40);
}
function celebrate(d){
  fuzzOnce();
  sfx('level'); setTimeout(()=>sfx('done'),560);
  try{ navigator.vibrate && navigator.vibrate([60,40,60,40,180]); }catch(e){}
  const t=totals(d), g=P().goal, n=streak(d);
  const row=(l,v,gg,u,ok)=>'<div><span>'+l+'</span><b class="'+(ok?'ok':'')+'">'+v+' / '+gg+' '+u+'</b></div>';
  setSheet('<div class="veil" id="veil"></div><div class="sheet fit full win">'+
    '<h3>Target acquired<button class="shx" id="ceX" aria-label="Close">\u00d7</button></h3>'+
    '<div class="grade"><div class="gletter">\u2713</div><div><div class="wtitle">'+dayName(d)+' \u00b7 clear</div>'+
      '<div class="gtxt">Calories landed on target and protein is secured. That is the day done properly.</div></div></div>'+
    '<div class="card"><div class="xled">'+
      row('Calories',fmt(t.k),fmt(g.k),'kcal',true)+
      row('Protein',Math.round(t.p),g.p,'g',true)+
      row('Carbs',Math.round(t.c),g.c||'\u2014','g',false)+
      row('Fat',Math.round(t.f),g.f||'\u2014','g',false)+
    '</div></div>'+
    '<div class="streak">'+(n>1?'<b>'+n+' days</b> on target in a row':'First day on target in this run')+'</div>'+
    '<button class="btn" id="ceOk" style="border-color:var(--bronze);color:var(--champ)">[ ACKNOWLEDGED ]</button></div>');
  document.getElementById('veil').onclick=closeSheet;
  document.getElementById('ceX').onclick=closeSheet;
  document.getElementById('ceOk').onclick=closeSheet;
}

function upsertFood(f){
  const L=P().foods, now=Date.now();
  let x=f.bc ? L.find(y=>y.bc && y.bc===f.bc) : null;
  if(!x) x=L.find(y=>y.n.toLowerCase()===f.n.toLowerCase() && y.sv.toLowerCase()===f.sv.toLowerCase());
  if(x){ x.u=now; x.e=now; if(f.bc && !x.bc) x.bc=f.bc; return x; }
  x={id:uid(), n:f.n, sv:f.sv, k:r1(f.k), p:r1(f.p), c:r1(f.c), f:r1(f.f), bc:f.bc||'', u:now, e:now};
  L.unshift(x);
  return x;
}
function removeFood(id){

}

/* ---------- how much ----------
   A food with a weight in its serving is logged in grams (or ml); anything else in
   servings. The preview shows the day as it will stand once this goes in. */
function openQty(food,o){
  o=o||{};
  const e=o.entry, g=gramsOf(food.sv);
  const st={q:e?e.q:1, m:e?e.m:(ADD.meal!=null?ADD.meal:defaultMeal())};
  const saved=P().foods.find(x=>x.id===(e?e.fid:food.id));
  const stack=!!topSheet();
  const step=g ? (g.n>=40?10:(g.n>=10?5:1)) : 0.25;
  const show=()=>g ? r1(st.q*g.n) : r1(st.q);
  const per='PER '+food.sv.toUpperCase()+' \u00b7 '+fmt(food.k)+' KCAL \u00b7 P'+r1(food.p)+' C'+r1(food.c)+' F'+r1(food.f);
  setSheet('<div class="veil" id="veil"></div><div class="sheet"><h3 class="qh">'+esc(food.n)+
    '<button class="shx'+(stack?' back':'')+'" id="qBack" aria-label="'+(stack?'Back':'Close')+'">'+(stack?'\u2039':'\u00d7')+'</button></h3>'+
    '<div class="tiny qper">'+esc(per)+'</div>'+
    '<div class="mpick" id="qMeal">'+MEALS.map((m,i)=>'<button data-m="'+i+'" class="'+(i===st.m?'on':'')+'">'+m.toUpperCase()+'</button>').join('')+'</div>'+
    '<div class="qrow"><button id="qDn" aria-label="Less">\u2212</button>'+
      '<input class="bignum" id="qV" type="number" inputmode="decimal" step="any" value="'+show()+'">'+
      '<button id="qUp" aria-label="More">+</button></div>'+
    '<div class="qunit">'+(g?(g.u==='ml'?'MILLILITRES':'GRAMS'):'SERVINGS')+'</div>'+
    '<div class="xled" id="qX"></div>'+
    '<button class="btn" id="qGo" style="border-color:var(--bronze);color:var(--champ)">'+(e?'[ UPDATE ]':'[ LOG IT ]')+'</button>'+
    (e?'<button class="btn ghost" id="qDel">[ REMOVE ]</button>':'')+
    (saved?'<button class="btn ghost" id="qEdit">[ EDIT SAVED FOOD ]</button>':'')+
    '</div>', stack);
  const box=topSheet();
  const veils=document.querySelectorAll('#sheetWrap .veil');
  const back=()=>stack?popSheet():closeSheet();
  veils[veils.length-1].onclick=back;
  box.querySelector('#qBack').onclick=back;
  box.querySelectorAll('#qMeal button').forEach(b=>b.onclick=()=>{
    st.m=+b.dataset.m;
    box.querySelectorAll('#qMeal button').forEach(x=>x.classList.toggle('on',x===b));
  });
  const V=box.querySelector('#qV');
  const base=totals(); if(e){ base.k-=e.k*e.q; base.p-=e.p*e.q; base.c-=e.c*e.q; base.f-=e.f*e.q; }
  const G=P().goal;
  const preview=()=>{
    const k=food.k*st.q, p=food.p*st.q, c=food.c*st.q, f=food.f*st.q;
    box.querySelector('#qX').innerHTML=
      '<div><span>Calories</span><b>'+fmt(k)+' kcal</b></div>'+
      '<div><span>Protein</span><b>'+r1(p)+' g</b></div>'+
      '<div><span>Carbs</span><b>'+r1(c)+' g</b></div>'+
      '<div><span>Fat</span><b>'+r1(f)+' g</b></div>'+
      '<div class="xsum"><span>Day after</span><b>'+fmt(base.k+k)+' / '+fmt(G.k)+' \u00b7 P '+Math.round(base.p+p)+'</b></div>';
  };
  const setQ=val=>{ const v=Math.max(0,+val||0); st.q=g ? v/g.n : v; preview(); };
  V.oninput=()=>setQ(V.value);
  V.onfocus=()=>{ try{ V.select(); }catch(x){} };
  const nudge=d=>{
    let v=(+V.value||0)+d*step;
    v=Math.max(step, Math.round(v/step)*step);
    V.value=r1(v); setQ(V.value); sfx('tap');
  };
  box.querySelector('#qDn').onclick=()=>nudge(-1);
  box.querySelector('#qUp').onclick=()=>nudge(1);
  preview();
  box.querySelector('#qGo').onclick=()=>{
    if(!(st.q>0) || !isFinite(st.q)){ sfx('nope'); toast('ENTER AN AMOUNT'); return; }
    const now=Date.now();
    let fd=food;
    if(o.save) fd=upsertFood(food);
    else if(saved){ saved.u=now; saved.e=now; }
    if(e){
      Object.assign(e,{q:st.q, m:st.m, e:now});
    } else {
      const en={id:uid(), fid:fd.id||'', n:fd.n, sv:fd.sv, k:fd.k, p:fd.p, c:fd.c, f:fd.f,
                q:st.q, m:st.m, t:now, e:now};
      (P().days[DAY]=P().days[DAY]||[]).push(en);
      FRESH=en.id;
    }
    ADD.meal=st.m;
    const hit=checkHits();
    touch();
    closeSheet();
    render();
    if(!hit){ sfx('confirm'); toast(e?'UPDATED':'LOGGED \u00b7 '+fmt(fd.k*st.q)+' KCAL'); }
  };
  if(e) box.querySelector('#qDel').onclick=()=>{
    P().days[DAY]=entries().filter(x=>x.id!==e.id);
    if(!P().days[DAY].length) delete P().days[DAY];
    P().del[e.id]=Date.now();
    touch();
    closeSheet();
    render();
    toast('REMOVED');
  };
  if(saved) box.querySelector('#qEdit').onclick=()=>openFoodEdit(saved);
}

/* ---------- barcodes ----------
   The browser's own detector where there is one (Chrome, Android). iPhone Safari has
   none, so ZXing is fetched the first time it is needed and does the same job. */
const SCAN={on:false, stream:null, raf:0, zx:null, done:false};
let ZXP=null;
function loadZX(){
  if(window.ZXing) return Promise.resolve();
  if(ZXP) return ZXP;
  ZXP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=()=>window.ZXing?res():rej(new Error('no ZXing'));
    s.onerror=()=>{ ZXP=null; rej(new Error('load failed')); };
    document.head.appendChild(s);
  });
  return ZXP;
}
function scStat(t,err){ const el=document.getElementById('scSt'); if(el){ el.textContent=t; el.classList.toggle('err',!!err); } }
function scPaint(on){
  const q=id=>document.getElementById(id);
  if(q('scIdle')) q('scIdle').classList.toggle('hide',on);
  if(q('scFr')) q('scFr').classList.toggle('hide',!on);
  if(q('scLn')) q('scLn').classList.toggle('hide',!on);
  if(q('scGo')) q('scGo').textContent=on?'[ STOP CAMERA ]':'[ START CAMERA ]';
}
async function startScan(){
  const video=document.getElementById('scVid'); if(!video) return;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    sfx('nope'); return scStat('NO CAMERA HERE \u2014 TYPE THE CODE BELOW',true);
  }
  SCAN.done=false;
  let det=null;
  if('BarcodeDetector' in window){
    try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){ det=null; }
  }
  if(det){
    try{ SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
    catch(e){ sfx('nope'); return scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
    video.srcObject=SCAN.stream;
    try{ await video.play(); }catch(e){}
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    const loop=async()=>{
      if(!SCAN.on) return;
      try{ const c=await det.detect(video); if(c && c.length) return gotCode(c[0].rawValue); }catch(e){}
      SCAN.raf=requestAnimationFrame(loop);
    };
    loop();
    return;
  }
  scStat('LOADING SCANNER\u2026');
  try{ await loadZX(); }catch(e){ sfx('nope'); return scStat('SCANNER DID NOT LOAD \u2014 TYPE THE CODE BELOW',true); }
  if(!document.getElementById('scVid')) return;          // left the tab while it loaded
  try{
    const Z=window.ZXing, hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    SCAN.zx=new Z.BrowserMultiFormatReader(hints,250);
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    await SCAN.zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},
      document.getElementById('scVid'), (res)=>{ if(res && SCAN.on) gotCode(res.getText()); });
  }catch(e){ stopScan(); sfx('nope'); scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
}
function stopScan(){
  SCAN.on=false;
  if(SCAN.raf){ cancelAnimationFrame(SCAN.raf); SCAN.raf=0; }
  if(SCAN.zx){ try{ SCAN.zx.reset(); }catch(e){} SCAN.zx=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} }); SCAN.stream=null; }
  const v=document.getElementById('scVid'); if(v){ try{ v.srcObject=null; }catch(e){} }
  scPaint(false);
}
function gotCode(code){
  if(SCAN.done) return;
  SCAN.done=true;
  stopScan();
  try{ navigator.vibrate && navigator.vibrate(50); }catch(e){}
  const c=document.getElementById('scCode'); if(c) c.value=code;
  lookupCode(code);
}
function offMap(p,code){
  if(!p) return null;
  const n=p.nutriments||{};
  const val=k=>{ const v=n[k]; return (v===undefined||v===null||v==='')?null:(+v); };
  const kcal=suf=>{
    const k=val('energy-kcal'+suf); if(k!==null && isFinite(k)) return k;
    const kj=val('energy-kj'+suf)!==null ? val('energy-kj'+suf) : val('energy'+suf);  // OFF "energy" is kJ
    return (kj!==null && isFinite(kj)) ? kj/4.184 : null;
  };
  let sv, per, k=kcal('_serving');
  if(p.serving_size && k!==null){ sv=String(p.serving_size).trim().slice(0,30); per='_serving'; }
  else { k=kcal('_100g'); sv=(p.nutrition_data_per==='100ml'?'100 ml':'100 g'); per='_100g'; }
  if(k===null || !isFinite(k)) return null;
  const g=gramsOf(sv);
  const m=x=>{
    let v=val(x+per);
    if((v===null||!isFinite(v)) && per==='_serving' && g){ const h=val(x+'_100g'); if(h!==null) v=h*g.n/100; }
    return (v!==null && isFinite(v) && v>=0) ? r1(v) : 0;
  };
  const name=String(p.product_name||p.generic_name||'').replace(/\s+/g,' ').trim(); if(!name) return null;
  const br=String(p.brands||'').split(',')[0].trim();
  return {n:((br && name.toLowerCase().indexOf(br.toLowerCase())<0) ? br+' '+name : name).slice(0,80),
          sv:sv, k:r1(k), p:m('proteins'), c:m('carbohydrates'), f:m('fat'),
          bc:String(p.code||code||'').replace(/\D/g,'')};
}
const OFF_FIELDS='code,product_name,generic_name,brands,serving_size,nutrition_data_per,nutriments';
async function lookupCode(raw){
  const code=String(raw||'').replace(/\D/g,'');
  const res=document.getElementById('scRes'); if(res) res.innerHTML='';
  if(code.length<6){ sfx('nope'); SCAN.done=false; return scStat('THAT CODE IS TOO SHORT',true); }
  const saved=P().foods.find(f=>f.bc===code);
  if(saved){ sfx('confirm'); scStat('SAVED FOOD \u00b7 '+saved.n); SCAN.done=false; return openQty(saved,{}); }
  scStat('LOOKING UP '+code+'\u2026');
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields='+OFF_FIELDS);
    const j=r.ok?await r.json():null;
    const f=(j && j.status===1) ? offMap(j.product,code) : null;
    SCAN.done=false;
    if(!f){
      sfx('nope'); scStat('NO MATCH FOR '+code,true);
      const box=document.getElementById('scRes');
      if(box){
        box.innerHTML='<button class="btn ghost" id="scMan">[ ADD IT BY HAND ]</button>';
        document.getElementById('scMan').onclick=()=>{ ADD.newbc=code; switchTab('new'); };
      }
      return;
    }
    sfx('confirm'); scStat('FOUND \u00b7 '+f.n);
    openQty(f,{save:true});
  }catch(e){ SCAN.done=false; sfx('nope'); scStat('LOOKUP FAILED \u2014 CHECK THE CONNECTION',true); }
}

/* ---------- search ----------
   Australian products first; the world database fills in when the local one is thin. */
let SEARCHID=0;
async function runSearch(q){
  const id=++SEARCHID;
  const st=document.getElementById('osSt');
  if(st){ st.textContent='SEARCHING\u2026'; st.classList.remove('err'); }
  ADD.results=[];
  paintResults();
  const url=host=>'https://'+host+'.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+
    '&search_simple=1&action=process&json=1&page_size=30&fields='+OFF_FIELDS;
  const grab=async host=>{ const r=await fetch(url(host)); if(!r.ok) throw r.status; const j=await r.json();
    return (j.products||[]).map(p=>offMap(p,p.code)).filter(Boolean); };
  let out=[], failed=false;
  try{ out=await grab('au'); }catch(e){ failed=true; }
  if(id!==SEARCHID) return;
  if(out.length<8){
    try{ const w=await grab('world'); const seen={}; out.forEach(x=>{ if(x.bc) seen[x.bc]=1; });
      w.forEach(x=>{ if(!x.bc || !seen[x.bc]) out.push(x); }); failed=false; }catch(e){}
  }
  if(id!==SEARCHID) return;
  ADD.results=out.slice(0,40);
  const s=document.getElementById('osSt');
  if(s){
    if(failed && !out.length){ s.textContent='SEARCH FAILED \u2014 CHECK THE CONNECTION'; s.classList.add('err'); sfx('nope'); }
    else if(!out.length){ s.textContent='NOTHING FOUND \u2014 TRY FEWER WORDS, OR ADD IT UNDER NEW'; s.classList.add('err'); sfx('nope'); }
    else s.textContent=out.length+' RESULT'+(out.length===1?'':'S');
  }
  paintResults();
}
function paintResults(){
  const L=document.getElementById('osList'); if(!L) return;
  L.innerHTML=ADD.results.map((f,i)=>'<div class="ri"><button class="rm" data-i="'+i+'"><span class="rn">'+esc(f.n)+'</span>'+
    '<span class="rs">'+esc(f.sv)+' \u00b7 P'+r1(f.p)+' C'+r1(f.c)+' F'+r1(f.f)+'</span></button>'+
    '<span class="rk">'+fmt(f.k)+'</span></div>').join('');
  L.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{
    const f=ADD.results[+b.dataset.i]; if(!f) return;
    const saved=f.bc ? P().foods.find(x=>x.bc===f.bc) : null;
    saved ? openQty(saved,{}) : openQty(f,{save:true});
  });
}

  document.getElementById('imGo').onclick=()=>document.getElementById('imFile').click();
  if(on){
    document.getElementById('syNow').onclick=async()=>{ toast('SYNCING\u2026'); await ghSyncAll(false); openSync(); };
    document.getElementById('syOff').onclick=async()=>{
      const ok=await askConfirm('Forget the token?','This phone stops syncing. Everything stays here and in the repo.','Forget');
      if(!ok) return;
      ghSave({tok:'', err:'', at:0}); refreshCog(); toast('TOKEN FORGOTTEN'); openSync();
    };
  } else {
    document.getElementById('syPaste').onclick=async()=>{
      try{ const t=(await navigator.clipboard.readText()||'').trim(); document.getElementById('syTok').value=t; }
      catch(e){ toast('CLIPBOARD BLOCKED \u2014 PASTE BY HAND'); }
    };
    document.getElementById('syGo').onclick=ghConnect;
  }
}
async function ghConnect(){
  const repo=document.getElementById('syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const tok=document.getElementById('syTok').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ sfx('nope'); return toast('REPO SHOULD LOOK LIKE OWNER/NAME'); }
  if(!/^(gh[pousr]_|github_pat_)\w+/.test(tok)){ sfx('nope'); return toast('NOT A GITHUB TOKEN'); }
  ghSave({tok:tok, repo:repo, err:'', at:0});
  toast('CONNECTING\u2026');
  let info=null;
  try{
    const r=await ghReq('/repos/'+repo);
    if(!r.ok){ ghSave({tok:'', err:''}); sfx('nope'); return toast(r.status===401?'TOKEN REJECTED':'REPO NOT FOUND OR NOT SHARED WITH TOKEN'); }
    info=await r.json();
  }catch(e){ ghSave({tok:'', err:''}); sfx('nope'); return toast('NO CONNECTION'); }
  if(info && info.default_branch) ghSave({branch:info.default_branch});
  if(info && info.private===false){
    const ok=await askConfirm('That repo is public','Anyone could read every profile\u2019s food log. Use a private repo for your data \u2014 the app itself can stay public.','Use it anyway');
    if(!ok){ ghSave({tok:'', err:''}); return openSync(); }
  }
  if(info && info.permissions && info.permissions.push===false){
    ghSave({tok:'', err:''}); sfx('nope'); return toast('TOKEN CANNOT WRITE TO THAT REPO');
  }
  const res=await ghSyncAll(true);
  if(res==='ok'){ sfx('done'); toast('CONNECTED \u00b7 SYNCED'); } else { sfx('nope'); toast('SYNC: '+res.toUpperCase()); }
  go(true);
  openSync();
}
function exportFile(){
  const txt=JSON.stringify({v:1, app:'food-log', at:new Date().toISOString(), profiles:DB.profiles});
  const name='food-diary-'+today()+'.json';
  try{
    const file=new File([txt],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).catch(()=>{}); return;
    }
  }catch(e){}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  toast('BACKUP SAVED');
}
async function importText(txt){
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  if(!d || !d.profiles || typeof d.profiles!=='object'){ sfx('nope'); return toast('NOT A FOOD LOG BACKUP'); }
  const names=Object.keys(d.profiles).map(cleanName).filter(Boolean);
  const ok=await askConfirm('Load '+names.length+' profile'+(names.length===1?'':'s')+'?',
    'Merges '+esc(names.join(', '))+' into this phone. Entries are combined; nothing here is lost.','Load');
  if(!ok) return;
  Object.keys(d.profiles).forEach(n=>{
    const nm=cleanName(n); if(!nm) return;
    const p=cleanProfile(d.profiles[n]);
    DB.profiles[nm]=DB.profiles[nm]?mergeProfile(DB.profiles[nm],p):p;
  });
  save(); go(true);
  toast('BACKUP LOADED'); sfx('done');
  if(ghOn()) ghSyncAll(true);
  openSync();
}

/* ---------- splash ---------- */
const LINES=[
 'Every entry is information, not a verdict.',
 'You do not need a perfect day. You need a logged one.',
 'Protein first. The rest falls into place.',
 'Consistency beats precision. Log what you can.',
 'One meal at a time is the whole method.',
 'The plate you log is the plate you can change.',
 'A good week is built from ordinary, recorded days.',
 'Hit the protein, keep the calories honest, repeat.',
 'Close enough, every day, adds up to a lot.',
 'Missed a day? Today still counts in full.',
 'Fuel the training. Record the fuel.',
 'Paying attention is the hard part, and you are doing it.',
 'Eat well, write it down, move on.',
 'Honest numbers are the only useful ones.',
 'The log remembers so you do not have to.',
 'Small entries, kept up, become big changes.'
];
function booted(){
  const r=document.documentElement;
  r.classList.remove('booting');
  if(!r.classList.contains('booted')) r.classList.add('booted');
}
function splash(){
  const el=document.getElementById('splash');
  if(!el){ booted(); return; }
  const line=document.getElementById('spLine'), goB=document.getElementById('spGo');
  const days=document.getElementById('spDays');
  if(days) days.textContent=DB.cur+' \u00b7 '+sinceStart();
  if(line) line.textContent=LINES[Math.floor(Math.random()*LINES.length)];
  if(goB) goB.textContent='[ INITIALISE ]';
  setTimeout(()=>{ if(goB) goB.classList.add('on'); },1600);
  const drop=()=>{
    if(!goB || !goB.classList.contains('on') || goB.classList.contains('out')) return;
    sfx('start');                       // also unlocks audio for the session
    goB.classList.add('out');
    setTimeout(()=>{ el.classList.add('out'); booted(); },190);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },190+380);
  };
  if(goB) goB.addEventListener('click',drop);
}

/* Interference on the headline number, now and then, while nothing is covering it. */
let ZAPT=0;
function zapLoop(){
  clearTimeout(ZAPT);
  ZAPT=setTimeout(()=>{
    const el=document.getElementById('kc');
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(el && !reduce && !document.querySelector('#sheetWrap .sheet') && !document.hidden){
      el.classList.remove('zap'); void el.offsetWidth; el.classList.add('zap');
      setTimeout(()=>el.classList.remove('zap'),430);
    }
    zapLoop();
  }, 5000+Math.random()*9000);
}
/* Close everything, back to the dashboard. Only the layers on screen now are cleared
   when the fade ends, so a sheet opened in the meantime (the celebration, say) is left
   standing. The camera is always released on the way out. */
function closeSheet(){
  stopScan();
  const wrap=document.getElementById('sheetWrap');
  panelHitStop();
  unlockScroll();
  const sh=topSheet()||wrap.querySelector('.sheet');
  if(!sh){ wrap.innerHTML=''; return; }
  sfx('close');
  wrap.querySelectorAll('.sheet').forEach(s=>{ s.classList.remove('cut'); s.classList.add('out'); });
  wrap.querySelectorAll('.veil').forEach(v=>v.classList.add('out'));
  const gone=[...wrap.children];
  setTimeout(()=>{ gone.forEach(x=>{ if(x.parentNode) x.parentNode.removeChild(x); }); },380);
}

document.getElementById('fab').onclick=fabTap;
document.getElementById('cog').onclick=openSettings;
document.getElementById('who').onclick=()=>openProfiles(false);
document.getElementById('imFile').onchange=e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ importText(String(r.result||'')); e.target.value=''; };
  r.readAsText(f);
};
/* Anything you can press should answer. Handlers that play their own cue run first
   and mark the time, so this only fills in the gaps. */
document.addEventListener('click',e=>{
  const t=e.target && e.target.closest &&
    e.target.closest('button,a[href],summary,select,label,.veil');
  if(!t) return;
  if(Date.now()-SFXAT<150) return;
  sfx('tap');
},false);
/* Leaving: send anything pending and let go of the camera. Coming back: roll over to
   the new day if it is past midnight, and pick up whatever the other phones logged. */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ ghFlush(); stopScan(); return; }
  if(FOLLOW && DAY!==today()){ DAY=today(); go(); }
  if(ghOn()) ghSync(DB.cur,true);
});
setInterval(()=>{
  if(FOLLOW && DAY!==today() && !document.querySelector('#sheetWrap .sheet')){ DAY=today(); go(); }
},60000);
window.addEventListener('resize',()=>syncPad(true));

/* The interface is hidden until the splash is dismissed, so anything that throws on
   the way up would leave a blank screen. Each step is isolated, and a watchdog
   uncovers the app regardless after a few seconds. */
const boot=(name,fn)=>{ try{ fn(); }catch(e){ console.error('start-up: '+name, e); } };
setTimeout(()=>{
  const r=document.documentElement;
  if(r.classList.contains('booting')){
    booted();
    const sp=document.getElementById('splash');
    if(sp && !document.getElementById('spGo')) sp.remove();
  }
},7000);
boot('load',load);
boot('render',()=>go());
boot('sheets',watchSheets);
boot('splash',splash);
boot('interference',()=>{ zapLoop(); setTimeout(rollPass, RND(1500,9000)); drawStatic(); fuzzNext(); });
boot('pad',()=>setInterval(()=>syncPad(),800));
boot('cog',refreshCog);
boot('sync',()=>{ if(ghOn()) setTimeout(()=>ghSyncAll(true),300); });
boot('storage',()=>{ if(STORE==='memory') setTimeout(()=>toast('NOT SAVING \u2014 EXPORT BEFORE CLOSING'),900); });
</script>
