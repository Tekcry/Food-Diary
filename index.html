.sort .ri{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:6px}
.sorting .ri:not(.lift){transition:transform .2s ease}
.ri.lift{position:relative;z-index:2;background:var(--card);box-shadow:0 0 20px -6px var(--bronze)}
.armed{color:var(--red) !important;border-color:var(--red) !important}
.rx.armed{width:auto;padding:0 8px;font-size:9px;letter-spacing:.14em}
.scanbox{position:relative;aspect-ratio:4/3;background:#000;border:1px solid var(--cardline);border-radius:5px;overflow:hidden}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block; filter:grayscale(1) sepia(1) hue-rotate(78deg) saturate(3.2) brightness(.95) contrast(1.15)}
.scanbox::after{content:'';position:absolute;inset:0;pointer-events:none; background:repeating-linear-gradient(180deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px)}
.sfr,.sln{display:none}
.scanbox.live .sfr,.scanbox.live .sln{display:block}
.scanbox.live .sidle{display:none}
.sfr{position:absolute;left:10%;right:10%;top:33%;bottom:33%;border:1px solid var(--bronze);border-radius:3px; box-shadow:0 0 0 999px rgba(2,10,5,.55),0 0 18px -4px var(--bronze)}
.sln{position:absolute;left:10%;right:10%;top:50%;height:1px;background:var(--bronze); box-shadow:0 0 10px var(--bronze);animation:scanln 1.8s ease-in-out infinite}
@keyframes scanln{0%,100%{transform:translateY(-22px);opacity:.6}50%{transform:translateY(22px);opacity:1}}
.sidle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center; font-family:var(--serif);font-size:11px;letter-spacing:.22em;color:var(--dimmer)}
[hidden]{display:none !important}
.qh{padding-right:42px;font-size:18px !important;line-height:1.3}
.qty>h3{padding:0 40px;line-height:1.3}
.qper{font-family:var(--serif);font-size:10.5px;letter-spacing:.08em;line-height:1.5;color:var(--dimmer);text-align:center}
.qty .mpick{margin:0}
.qty .qfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.qty .qfoot .duo{margin:0}
.qlab{flex:1;min-height:0;overflow:auto;scrollbar-width:none;border-top:1px solid var(--cardline)}
.lrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--hair)}
.lrow span{font-size:14px;color:var(--tx)}
.lrow b{font-weight:400;font-family:var(--serif);font-size:12.5px;color:var(--champ);text-align:right;font-variant-numeric:tabular-nums}
.lrow.lsub span{padding-left:12px;font-size:13px;color:var(--dim)}
.lrow.lsub b{color:var(--dim)}
.lhead b{font-size:9.5px;letter-spacing:.14em;color:var(--dimmer)}
.lday{border-bottom:none;border-top:1px solid var(--cardline)}
.lday span{font-family:var(--serif);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.qfoot .btn{margin:0}
.qrow{display:grid;grid-template-columns:54px 1fr 54px;gap:8px}
.qrow button{font-size:32px}
.qrow .bignum{margin:0;padding:12px 6px}
.qunit{text-align:center;font-family:var(--serif);font-size:9.5px;letter-spacing:.2em;color:var(--dimmer);margin:7px 0 6px}
.pct{display:grid;grid-template-columns:1fr 44px 70px 44px;align-items:center;gap:8px;padding:6px 0}
.pct button{height:42px;font-size:26px}
.pin{height:42px;padding:0 4px;text-align:center;font-family:var(--serif);font-size:18px}
.tot{margin-top:10px;text-align:center;font-family:var(--serif);font-size:12px;letter-spacing:.18em;color:var(--bronze)}
.tot.off{color:var(--red);text-shadow:0 0 8px rgba(255,64,64,.6)}
.pl{font-size:14px;color:var(--tx)}
.pl b{display:block;font-family:var(--serif);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--dimmer);margin-top:3px}
.xled .sub span{padding-left:14px;color:var(--dimmer)}
.xled .sub b{color:var(--dim)}
.calh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}
.calh h3{text-align:center;margin:0}
.calh button{height:40px;font-size:22px;color:var(--bronze)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-family:var(--serif);font-size:9.5px;letter-spacing:.14em;color:var(--dimmer);padding-bottom:4px}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:5px;font-family:var(--serif);font-size:13px; color:var(--dim);font-variant-numeric:tabular-nums}
.cal button.has{color:var(--champ);text-shadow:0 0 6px rgba(0,255,102,.6);background:var(--tint)}
.cal button.chosen{border-color:var(--bronze)}
.cal button.now{color:var(--on);background:var(--bronze);text-shadow:none;box-shadow:0 0 16px -3px var(--bronze)}
.sheet.fit.full.win{gap:16px}
.win .grade{flex-direction:column;text-align:center;gap:14px;margin:auto 0 4px}
.win .gletter{font-size:clamp(34px,11vh,54px);padding:6px 16px 10px; box-shadow:0 0 34px -6px var(--bronze),inset 0 0 18px -8px var(--bronze);animation:nowglow 2.6s ease-in-out infinite}
.win .wtitle{font-family:var(--serif);font-size:12px;letter-spacing:.24em;color:var(--bronze);text-transform:uppercase}
.win .gtxt{max-width:20em;margin:8px auto 0;font-size:13px;line-height:1.6;color:var(--dim)}
.win .xled b.ok{color:var(--champ);text-shadow:0 0 8px var(--bronze)}
.win .btn{margin-top:auto !important}
.streak{font-family:var(--serif);font-size:11px;letter-spacing:.16em;color:var(--dim);text-align:center;text-transform:uppercase}
.streak b{color:var(--champ);font-weight:400}
.sheet .srow h3{font-size:17px;line-height:1.3}
@media (prefers-reduced-motion: reduce){
  .kc.zap,.sln,.win .gletter,.fi.fresh,.tune.in,.tune.out,.bolt svg,.bolt.bump svg{animation:none}
  .tune::before{display:none}
}
html[data-theme=light]{--bg:#f2f2f7;--surf:#fff;--card:#fff;--card2:#f2f2f7;--line:#c6c6c8;--hair:rgba(60,60,67,.16); --cardline:rgba(60,60,67,.16);--cardhair:rgba(60,60,67,.1);--tx:#000;--dim:rgba(60,60,67,.62);--dimmer:rgba(60,60,67,.38); --bronze:#007aff;--pb:#007aff;--champ:#000;--alert:#ff9500;--pb-amber:#ff9500;--red:#ff3b30;--tint:rgba(0,122,255,.1);--fill:rgba(118,118,128,.12)}
html[data-theme=dark]{--bg:#000;--surf:#1c1c1e;--card:#1c1c1e;--card2:#2c2c2e;--line:#3a3a3c;--hair:#2c2c2e; --cardline:#3a3a3e;--cardhair:#2e2e32;--tx:#dcdce2;--dim:#a4a4ae;--dimmer:#94949e; --bronze:#4c9ef5;--pb:#4c9ef5;--champ:#e8e8ed;--alert:#f0a43a;--pb-amber:#f0a43a;--red:#ff6b62;--tint:rgba(76,158,245,.16);--fill:rgba(118,118,128,.22)}
html.ios{--serif:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--ui:var(--serif);--mono:var(--serif);--on:#fff}
html.ios body::before,html.ios body::after,html.ios .crt-glow,html.ios .crt-lines,html.ios .roll,html.ios .uistatic,
html.ios .sheet::before,html.ios .tune::before,html.ios .scanbox::after,html.ios .spgo.on::after{display:none}
html.ios *{text-shadow:none !important;box-shadow:none !important}
html.ios.booted header,html.ios.booted #main{animation:none}
html.ios .scanbox video{filter:none}
html.ios .veil{background:rgba(0,0,0,.35)}
html.ios .veil.vstack{background:rgba(0,0,0,.2)}
html.ios .sheet{border:none;border-radius:14px 14px 0 0}
html.ios .sheet.full{border-radius:0}
html.ios .sheet:not(.out){animation:iosin .34s cubic-bezier(.2,.9,.3,1) both}
html.ios .sheet.out{animation:iosout .22s ease-in both}
html.ios .sheet.cut,html.ios .sheet.cut:not(.out){animation:none}
html.ios .sheet.swapin:not(.out),html.ios .tune.in{animation:iosfade .24s ease both}
html.ios .rtt.in{animation-delay:.35s}
html.ios .tune.out{animation:iosfade .2s ease reverse both}
@keyframes iosin{from{opacity:0;transform:translateY(36px)}}
@keyframes iosout{to{opacity:0;transform:translateY(36px)}}
@keyframes iosfade{from{opacity:0}}
html.ios .card,html.ios .srow{border:none;border-radius:12px}
html.ios .xled b{color:var(--tx)}
html.ios .fi{border-color:transparent;border-radius:10px}
html.ios .btn{background:var(--fill);border:none;border-radius:12px;color:var(--bronze);font-weight:600}
html.ios .btn.ghost{background:transparent}
html.ios .btn.armed{background:rgba(255,59,48,.12)}
html.ios .btn:hover,html.ios .btn:active,html.ios .srow:hover,html.ios .srow:active{background:var(--tint);color:var(--bronze);border-color:transparent}
html.ios .fld,html.ios .bignum{background:var(--fill);border:1px solid transparent;border-radius:10px;color:var(--tx)}
html.ios .fld:focus{border-color:var(--bronze)}
html.ios .mpick button,html.ios .eu button{background:var(--fill);border-color:transparent;border-radius:8px;color:var(--dim)}
html.ios .mpick button.on,html.ios .eu button.on{background:var(--bronze);color:#fff}
html.ios .rtt{border-color:transparent;background:var(--fill);border-radius:12px}
html.ios .selbar{background:var(--card);border-top-color:var(--hair)}
html.ios .toast{background:rgba(44,44,46,.94);color:#fff;border-radius:18px}
html.ios .startbtn{color:#fff;border-radius:12px}
html.ios .tick{border-radius:6px}
html.ios .scanbox{border:none;border-radius:12px}
html.ios .bolt svg{filter:none;animation:none}
html.ios .bolt.bump svg{animation:iospop .45s ease-out}
@keyframes iospop{40%{transform:scale(1.35)}}
</style>

const KEY='food_log_v1', APP_VERSION='2026.09.24.47';     // stamped by the build: date.build
let DB=null, STORE='local';
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const DEF_GOAL={k:2200,mode:'p',pp:30,cp:40,fp:30,pg:165,cg:220,fg:73};
const DEF_MEALS=[{id:'b',n:'Breakfast'},{id:'l',n:'Lunch'},{id:'d',n:'Dinner'},{id:'s',n:'Snacks'}];
/* Detail nutrients: key, label, short label, unit, Open Food Facts field, multiplier from OFF units. */
const XN=[['su','Sugars','Sugars','g','sugars',1],['fi','Fibre','Fibre','g','fiber',1],
  ['sf','Saturated fat','Sat. fat','g','saturated-fat',1],['tf','Trans fat','Trans fat','g','trans-fat',1],
  ['pf','Polyunsaturated fat','Poly fat','g','polyunsaturated-fat',1],['mf','Monounsaturated fat','Mono fat','g','monounsaturated-fat',1],
  ['na','Sodium','Sodium','mg','sodium',1000],['ch','Cholesterol','Cholesterol','mg','cholesterol',1000]];

function num(v,lo,hi){ const n=+v; return Number.isFinite(n)&&n>=lo&&n<=hi?n:null; }
const orD=(v,d)=>v===null?d:v;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r1=v=>Math.round((+v||0)*10)/10;
const fmt=v=>Math.round(+v||0).toLocaleString('en-AU');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanName=n=>String(n||'').replace(/[^\w .'-]/g,'').replace(/\s+/g,' ').trim().replace(/^_+/,'').slice(0,24);

function blankProfile(){
  return {goal:Object.assign({},DEF_GOAL), meals:DEF_MEALS.map(m=>Object.assign({},m)),
          foods:[], combos:[], days:{}, hit:{}, del:{}, wt:{}, at:0, ge:0, me:0, pid:''};
}
function cleanX(x){
  const o={};
  if(x && typeof x==='object') XN.forEach(([k])=>{ const v=num(x[k],0,100000); if(v) o[k]=r1(v); });
  return o;
}
function cleanFood(x){
  if(!x || typeof x!=='object') return null;
  const n=String(x.n||'').replace(/\s+/g,' ').trim().slice(0,80); if(!n) return null;
  return {id:String(x.id||uid()).slice(0,24), n, sv:String(x.sv||'').trim().slice(0,30)||'1 serving',
    k:orD(num(x.k,0,9000),0), p:orD(num(x.p,0,900),0), c:orD(num(x.c,0,1500),0), f:orD(num(x.f,0,900),0),
    x:cleanX(x.x), bc:x.bc?String(x.bc).replace(/\D/g,'').slice(0,20):'',
    u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
function cleanEntry(x){
  const f=cleanFood(x); if(!f) return null;
  return {id:f.id, fid:x.fid?String(x.fid).slice(0,24):'', n:f.n, sv:f.sv, k:f.k, p:f.p, c:f.c, f:f.f, x:f.x,
    q:orD(num(x.q,0.001,5000),1), w:['s','h','g'].includes(x.w)?x.w:'g', m:String(typeof x.m==='number'?'blds'[x.m]||'s':x.m||'s').slice(0,24),
    t:orD(num(x.t,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
/* A saved meal: a name and the foods in it, each a full snapshot with its amount. */
function cleanCombo(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanName(x.n), items=(Array.isArray(x.items)?x.items:[]).map(cleanEntry).filter(Boolean).slice(0,30)
    .map(e=>({fid:e.fid, n:e.n, sv:e.sv, k:e.k, p:e.p, c:e.c, f:e.f, x:e.x, q:e.q, w:e.w}));
  if(!n || !items.length) return null;
  return {id:String(x.id||uid()).slice(0,24), n, items, u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
function cleanGoal(g){
  g=g||{};
  const o={k:orD(num(g.k,500,10000),DEF_GOAL.k), mode:g.mode==='g'?'g':'p'};
  ['pp','cp','fp'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,100),DEF_GOAL[k]); });
  ['pg','cg','fg'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,1500),DEF_GOAL[k]); });
  if(o.pp+o.cp+o.fp>100) Object.assign(o,{pp:DEF_GOAL.pp,cp:DEF_GOAL.cp,fp:DEF_GOAL.fp});
  return o;
}
function cleanProfile(p){
  const o=blankProfile();
  if(!p || typeof p!=='object') return o;
  o.goal=cleanGoal(p.goal);
  if(Array.isArray(p.meals)){
    const ms=p.meals.map(m=>({id:String(m&&m.id||'').slice(0,24), n:String(m&&m.n||'').trim().slice(0,24)}))
      .filter(m=>m.id&&m.n);
    if(ms.length) o.meals=ms.slice(0,6);
  }
  o.foods=(Array.isArray(p.foods)?p.foods:[]).map(cleanFood).filter(Boolean);
  o.combos=(Array.isArray(p.combos)?p.combos:[]).map(cleanCombo).filter(Boolean);
  Object.keys(p.days||{}).sort().forEach(d=>{
    if(!DATE_RE.test(d) || !Array.isArray(p.days[d])) return;
    const v=p.days[d].map(cleanEntry).filter(Boolean);
    if(v.length) o.days[d]=v;
  });
  Object.keys(p.hit||{}).sort().forEach(d=>{ const h=p.hit[d]; if(DATE_RE.test(d)&&h) o.hit[d]={k:!!h.k,p:!!h.p}; });
  Object.keys(p.wt||{}).sort().forEach(d=>{ const w=p.wt[d], v=w&&num(w.v,0,500), t=w&&num(w.e,1,1e13);
    if(DATE_RE.test(d) && v!==null && t) o.wt[d]={v:r1(v),e:t}; });                    // v 0: removed, kept so phones agree
  Object.keys(p.del||{}).sort().forEach(id=>{ const t=num(p.del[id],1,1e13); if(t) o.del[id]=t; });
  ['at','ge','me'].forEach(k=>{ o[k]=orD(num(p[k],0,1e13),0); });
  o.pid=String(p.pid||'').slice(0,24);
  return o;
}
function cleanDB(d){
  d=d&&typeof d==='object'?d:{};
  const obj=v=>v&&typeof v==='object'?v:{};
  const out={profiles:{}, cur:String(d.cur||''), gh:obj(d.gh), fold:obj(d.fold), sfx:d.sfx!==false, idx:cleanIdx(d.idx),
    theme:['crt','light','dark','auto'].includes(d.theme)?d.theme:'crt'};
  Object.keys(d.profiles||{}).forEach(n=>{ const nm=cleanName(n); if(nm) out.profiles[nm]=cleanProfile(d.profiles[n]); });
  if(!Object.keys(out.profiles).length) out.profiles.Me=blankProfile();
  Object.values(out.profiles).forEach(p=>{ if(!p.pid) p.pid=uid(); });     // a profile's identity, whatever it is called
  if(!out.profiles[out.cur]) out.cur=Object.keys(out.profiles)[0];
  return out;
}
function load(){
  let s=null, d=null;
  try{ s=localStorage.getItem(KEY); }catch(e){ STORE='memory'; }
  try{ d=JSON.parse(s); }catch(e){}
  DB=cleanDB(d);
}
function save(){
  if(STORE!=='local') return;
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('SAVE FAILED \u2014 SAVE A BACKUP FILE NOW'); }
}
const P=()=>DB.profiles[DB.cur];
function touch(){ P().at=Date.now(); save(); ghQueue(); }

/* ---------- dates: local calendar days, never UTC ---------- */
function ymd(d){ d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today=()=>ymd();
function dObj(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function shift(s,n){ const t=dObj(s); t.setDate(t.getDate()+n); return ymd(t); }
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate=s=>{ const d=dObj(s); return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const shortDay=s=>{ const d=dObj(s); return (WD[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)).toUpperCase(); };
function dayName(s){ const t=today(); return s===t?'Today':s===shift(t,-1)?'Yesterday':s===shift(t,1)?'Tomorrow':WD[dObj(s).getDay()]; }
let DAY=today(), FOLLOW=true;          // FOLLOW: roll over to the new day at midnight

/* ---------- targets: calories, plus macros as a share of them or in grams ---------- */
function targets(g){ g=g||P().goal;
  return g.mode==='g' ? {k:g.k, p:g.pg, c:g.cg, f:g.fg}
    : {k:g.k, p:Math.round(g.k*g.pp/400), c:Math.round(g.k*g.cp/400), f:Math.round(g.k*g.fp/900)}; }
function shares(g){ g=g||P().goal;
  if(g.mode!=='g') return {pp:g.pp, cp:g.cp, fp:g.fp};
  const s=v=>Math.round(v/g.k*100);
  return {pp:s(g.pg*4), cp:s(g.cg*4), fp:s(g.fg*9)}; }
const KBAND=0.05;                      // calories count as on target within 5% either side
function status(t,g){
  return {kHit:t.k>=g.k*(1-KBAND) && t.k<=g.k*(1+KBAND), pHit:g.p>0 && t.p>=g.p, over:t.k>g.k*(1+KBAND)};
}

/* ---------- the numbers ---------- */
const entries=d=>P().days[d||DAY]||[];
function zero(){ const t={k:0,p:0,c:0,f:0}; XN.forEach(([k])=>t[k]=0); return t; }
function totals(d){
  const t=zero();
  entries(d).forEach(e=>{ t.k+=e.k*e.q; t.p+=e.p*e.q; t.c+=e.c*e.q; t.f+=e.f*e.q;
    XN.forEach(([k])=>{ if(e.x[k]) t[k]+=e.x[k]*e.q; }); });
  return t;
}
/* Average over the logged days in the n days ending on d. */
function average(d,n){
  const t=zero(); let c=0;
  for(let i=0;i<n;i++){ const s=shift(d,-i); if(!entries(s).length) continue; c++;
    const x=totals(s); Object.keys(t).forEach(k=>t[k]+=x[k]); }
  if(c) Object.keys(t).forEach(k=>t[k]/=c);
  return {t,c};
}
function onTarget(d){ const s=status(totals(d),targets()); return s.kHit&&s.pHit; }
/* Consecutive days with anything logged, ending today. An unlogged today does not break
   the run until the day is over, so the count carries from yesterday. */
function logStreak(){
  let d=today(), n=0;
  if(!entries(d).length) d=shift(d,-1);
  while(n<3650 && entries(d).length){ n++; d=shift(d,-1); }
  return n;
}
function streak(d){ let n=0; while(n<400 && onTarget(d)){ n++; d=shift(d,-1); } return n; }
function sinceStart(){
  const k=Object.keys(P().days).sort(); if(!k.length) return 'DAY 1';
  const days=Math.round((dObj(today())-dObj(k[0]))/864e5)+1;
  return days<7?'DAY '+days:'WEEK '+(Math.floor((days-1)/7)+1)+' \u00b7 DAY '+days;
}
/* ---------- weight: one reading a day ---------- */
const wOf=d=>{ const w=P().wt[d]; return w && w.v>0 ? w.v : null; };
function wAvg(end,n){ let s=0,c=0; for(let i=0;i<n;i++){ const v=wOf(shift(end,-i)); if(v){ s+=v; c++; } } return c?{a:s/c,c}:null; }
function wLast(d){ for(let i=0;i<120;i++){ const x=shift(d,-i); if(wOf(x)) return x; } return ''; }
/* The weight nearest a day: the latest on or before it, else the first after it. */
function wNear(d){
  const before=wLast(d); if(before) return wOf(before);
  const after=Object.keys(P().wt).sort().find(x=>x>d && wOf(x)); return after?wOf(after):null;
}
/* "100 g", "250 ml", "1 bar (45 g)": a weight in the serving means log by weight. */
function gramsOf(sv){
  const m=String(sv).match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i);
  const n=m?parseFloat(m[1].replace(',','.')):0;
  return n>0?{n,u:m[2].toLowerCase()}:null;
}
function qtyTxt(e){
  const g=gramsOf(e.sv);
  return g && e.w!=='s' ? r1(e.q*g.n)+' '+g.u : (e.q===1?'':r1(e.q)+' \u00d7 ')+e.sv;
}

/* ---------- merging ----------
   Object by object: the later edit wins, and anything deleted after its last edit
   stays deleted. Targets and sections each follow whichever copy changed them last. */
function mergeProfile(a,b){
  const o=blankProfile(), newer=a.at>=b.at?a:b, by=k=>a[k]!==b[k]?(a[k]>b[k]?a:b):newer;
  o.goal=Object.assign({},by('ge').goal);
  o.meals=by('me').meals.map(m=>Object.assign({},m));
  o.ge=Math.max(a.ge,b.ge); o.me=Math.max(a.me,b.me);
  o.pid=a.pid&&b.pid?(a.pid<b.pid?a.pid:b.pid):a.pid||b.pid;         // copies of one profile settle on one identity
  const cut=Date.now()-120*864e5;
  [a.del,b.del].forEach(d=>Object.keys(d).forEach(id=>{ if(d[id]>cut) o.del[id]=Math.max(o.del[id]||0,d[id]); }));
  const gone=x=>o.del[x.id]>=x.e;
  const pick=(m,x)=>{ const y=m[x.id]; if(!y || x.e>y.e || (x.e===y.e && x.u>y.u)) m[x.id]=x; };
  const fm={}; b.foods.concat(a.foods).forEach(f=>pick(fm,f));
  o.foods=Object.values(fm).filter(f=>!gone(f)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  const cm={}; b.combos.concat(a.combos).forEach(x=>pick(cm,x));
  o.combos=Object.values(cm).filter(x=>!gone(x)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  const days={};
  [b,a].forEach(p=>Object.keys(p.days).forEach(d=>{ days[d]=days[d]||{}; p.days[d].forEach(e=>pick(days[d],e)); }));
  Object.keys(days).forEach(d=>{
    const v=Object.values(days[d]).filter(e=>!gone(e)).sort((x,y)=>x.t-y.t || (x.id<y.id?-1:1));
    if(v.length) o.days[d]=v;
  });
  Object.keys(Object.assign({},a.hit,b.hit)).forEach(d=>{
    const x=a.hit[d]||{}, y=b.hit[d]||{}; o.hit[d]={k:!!(x.k||y.k), p:!!(x.p||y.p)};
  });
  Object.keys(Object.assign({},a.wt,b.wt)).forEach(d=>{ const x=a.wt[d], y=b.wt[d]; o.wt[d]=!x?y:!y?x:y.e>x.e?y:x; });
  o.at=Math.max(a.at,b.at);
  return cleanProfile(o);
}

/* ---------- GitHub: one file per profile, data/<name>.json, in a private repo ----------
   A sync reads, merges and writes only if the result differs from what is there. */
function ghCfg(){ const g=DB.gh; return {tok:g.tok||'', repo:g.repo||'', branch:g.branch||'main', at:g.at||0, err:g.err||''}; }
function ghSave(patch){ DB.gh=Object.assign(ghCfg(),patch); save(); }
function ghOn(){ const c=ghCfg(); return !!(c.tok && /^[\w.-]+\/[\w.-]+$/.test(c.repo)); }
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghReq(path,opt){
  opt=opt||{};
  return fetch('https://api.github.com'+path,Object.assign({},opt,{cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+ghCfg().tok, Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'},opt.headers)}));
}
const ghUrl=n=>'/repos/'+ghCfg().repo+'/contents/data/'+encodeURIComponent(n)+'.json';
async function ghGet(name){
  const q='?ref='+encodeURIComponent(ghCfg().branch);
  const r=await ghReq(ghUrl(name)+q);
  if(r.status===404) return {sha:'',prof:null};
  if(!r.ok) throw r.status;
  const j=await r.json();
  let txt=j.content?unb64(j.content):'';
  if(!txt){                                      // over 1 MB: fetch the raw file instead
    const r2=await ghReq(ghUrl(name)+q,{headers:{Accept:'application/vnd.github.raw'}});
    if(!r2.ok) throw r2.status;
    txt=await r2.text();
  }
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  return {sha:j.sha, prof:d&&d.profile?cleanProfile(d.profile):null};
}
const ghPut=(name,prof,sha)=>ghReq(ghUrl(name),{method:'PUT',body:JSON.stringify({
  message:'log: '+name+' '+today(), branch:ghCfg().branch, sha:sha||undefined,
  content:b64(JSON.stringify({v:1,name,profile:prof}))})});
let GHT=0, GHBUSY=false, GHAGAIN=false;
function ghQueue(){ if(!ghOn()) return; clearTimeout(GHT); GHT=setTimeout(()=>{ GHT=0; ghSync(DB.cur); },1500); }
function ghFlush(){ if(GHT){ clearTimeout(GHT); GHT=0; ghSync(DB.cur); } }
const ghMsg=e=>e===401?'bad token':e===403?'token cannot write here':e===404?'repo not found':typeof e==='number'?'error '+e:'offline';
async function ghSync(name){
  if(!ghOn()) return 'off';
  if(GHBUSY){ GHAGAIN=true; return 'busy'; }
  GHBUSY=true;
  try{
    for(let i=0;i<3;i++){
      const rem=await ghGet(name), local=DB.profiles[name];
      if(!local || (!rem.prof && !local.at)) break;        // never used: nothing worth uploading
      const merged=rem.prof?mergeProfile(local,rem.prof):cleanProfile(local), mj=JSON.stringify(merged);
      if(mj!==JSON.stringify(local)){ DB.profiles[name]=merged; save(); if(name===DB.cur) render(); }
      if(rem.prof && mj===JSON.stringify(rem.prof)) break;
      const r=await ghPut(name,merged,rem.sha);
      if(r.status===409 || r.status===422) continue;         // moved under us: read again
      if(!r.ok) throw r.status;
      break;
    }
    ghSave({at:Date.now(),err:''});
    return 'ok';
  }catch(e){ const m=ghMsg(e); ghSave({err:m}); return m; }
  finally{ GHBUSY=false; refreshCog(); if(GHAGAIN){ GHAGAIN=false; ghQueue(); } }
}
/* Pull in profiles created on other phones, then sync every profile. */
/* ---------- the shared index: profile renames and deletes, so every phone follows them ----------
   Each entry names the profile's identity, not just its name, so it never touches a
   different profile that shares the name. Entries older than 120 days are dropped. */
function cleanIdx(x){
  const o={gone:{},renamed:{}}, cut=Date.now()-120*864e5;
  x=x&&typeof x==='object'?x:{};
  Object.entries(x.gone||{}).forEach(([n,g])=>{ const t=g&&num(g.t,cut,1e13); if(cleanName(n) && t && g.pid) o.gone[n]={t,pid:String(g.pid)}; });
  Object.entries(x.renamed||{}).forEach(([n,r])=>{ const t=r&&num(r.t,cut,1e13), to=r&&cleanName(r.to);
    if(cleanName(n) && t && to && to!==n && r.pid) o.renamed[n]={to,t,pid:String(r.pid)}; });
  return o;
}
function mergeIdx(a,b){
  const o=cleanIdx(a);
  Object.entries(b.gone).forEach(([n,g])=>{ if(!(o.gone[n] && o.gone[n].t>=g.t)) o.gone[n]=g; });
  Object.entries(b.renamed).forEach(([n,r])=>{ if(!(o.renamed[n] && o.renamed[n].t>=r.t)) o.renamed[n]=r; });
  return o;
}
function applyIdx(idx){
  Object.entries(idx.renamed).sort((x,y)=>x[1].t-y[1].t).forEach(([old,r])=>{
    const p=DB.profiles[old]; if(!p || p.pid!==r.pid) return;
    DB.profiles[r.to]=DB.profiles[r.to]?mergeProfile(DB.profiles[r.to],p):p;     // anything logged under the old name is kept
    delete DB.profiles[old];
    if(DB.cur===old) DB.cur=r.to;
  });
  Object.entries(idx.gone).forEach(([n,g])=>{ const p=DB.profiles[n]; if(p && p.pid===g.pid) delete DB.profiles[n]; });
  if(!Object.keys(DB.profiles).length) DB.profiles.Me=Object.assign(blankProfile(),{pid:uid()});
  if(!DB.profiles[DB.cur]) DB.cur=Object.keys(DB.profiles)[0];
}
const IDX='/contents/data/_index.json';
async function ghIndex(){
  const base='/repos/'+ghCfg().repo+IDX;
  for(let i=0;i<3;i++){
    const r=await ghReq(base+'?ref='+encodeURIComponent(ghCfg().branch));
    if(!r.ok && r.status!==404) throw r.status;
    const j=r.ok?await r.json():{};
    let remote=cleanIdx(null); try{ if(j.content) remote=cleanIdx(JSON.parse(unb64(j.content))); }catch(e){}
    const merged=mergeIdx(DB.idx,remote);
    applyIdx(merged);
    DB.idx=merged; save();
    if(JSON.stringify(merged)===JSON.stringify(remote)) return;
    const w=await ghReq(base,{method:'PUT',body:JSON.stringify({message:'profiles index',branch:ghCfg().branch,sha:j.sha||undefined,
      content:b64(JSON.stringify(merged))})});
    if(w.ok) return;
    if(w.status!==409 && w.status!==422) throw w.status;
  }
}
/* Everything: follow renames and deletes, tidy away files they left behind, pick up
   profiles made on other phones, then sync each profile. */
let ALLBUSY=false;
async function ghSyncAll(){
  if(!ghOn() || ALLBUSY) return 'busy';
  ALLBUSY=true;
  try{
    try{ await ghIndex(); }catch(e){ return ghMsg(e); }
    try{
      const r=await ghReq('/repos/'+ghCfg().repo+'/contents/data?ref='+encodeURIComponent(ghCfg().branch));
      const files=(r.ok?await r.json():[]).map(f=>f.name).filter(n=>/\.json$/.test(n) && n[0]!=='_').map(n=>decodeURIComponent(n.slice(0,-5)));
      for(const n of files){
        if(DB.profiles[n] || cleanName(n)!==n) continue;
        const was=DB.idx.gone[n]||DB.idx.renamed[n];
        if(!was){ DB.profiles[n]=blankProfile(); continue; }
        const rem=await ghGet(n);                          // a different profile that reuses the name is kept
        if(rem.prof && rem.prof.pid!==was.pid) DB.profiles[n]=blankProfile(); else await ghDelete(n);
      }
      save();
    }catch(e){}
    let res='ok';
    for(const n of Object.keys(DB.profiles)){ const r=await ghSync(n); if(r!=='ok') res=r; }
    return res;
  }finally{ ALLBUSY=false; }
}

/* ---------- sound: synthesised, nothing to load ---------- */
let AC=null, BUS=null, NOISE=null, SFXAT=0;
function acx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}
  try{ AC=new C(); }catch(e){ return null; }
  const inp=AC.createGain();
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.7;
  const dly=AC.createDelay(0.5); dly.delayTime.value=0.085;
  const fb=AC.createGain(); fb.gain.value=0.26;
  const wet=AC.createGain(); wet.gain.value=0.22;
  const out=AC.createGain(); out.gain.value=0.9;
  inp.connect(hp); hp.connect(lp); lp.connect(out);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
  out.connect(AC.destination);
  BUS=inp;
  return AC;
}
function hiss(dur,vol){
  const c=acx(); if(!c) return;
  if(!NOISE){
    NOISE=c.createBuffer(1,Math.floor(c.sampleRate*0.6),c.sampleRate);
    const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const t0=c.currentTime;
  const src=c.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.7;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(BUS);
  src.start(t0); src.stop(t0+dur+0.05);
}
function tone(freq,dur,vol,delay,o){
  const c=acx(); if(!c) return;
  o=o||{};
  const t0=c.currentTime+(delay||0), env=c.createGain();
  [0,5].forEach((d,i)=>{
    const osc=c.createOscillator();
    osc.type=o.type||(i?'triangle':'sine');
    osc.frequency.setValueAtTime(freq,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur*(o.bend||0.85));
    osc.detune.value=d;
    osc.connect(env); osc.start(t0); osc.stop(t0+dur+0.05);
  });
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.exponentialRampToValueAtTime(vol,t0+(o.attack||0.012));
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  if(o.shimmer){
    const lfo=c.createOscillator(), depth=c.createGain();
    lfo.frequency.value=o.shimmer; depth.gain.value=vol*0.22;
    lfo.connect(depth); depth.connect(env.gain); lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  env.connect(BUS);
}
function dyad(a,b,dur,vol,delay,o){ tone(a,dur,vol,delay,o); tone(b,dur,vol*0.8,delay,o); }
const HISS={tap:[0.07,0.012],open:[0.13,0.016],close:[0.15,0.013],confirm:[0.34,0.018],
  record:[0.4,0.02],start:[0.6,0.02],level:[0.6,0.022],done:[0.7,0.02],nope:[0.28,0.02]};
function sfx(name){
  if(DB.sfx===false) return;
  const c=acx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  SFXAT=Date.now();
  hiss(HISS[name][0],HISS[name][1]);
  switch(name){
    case 'tap':     tone(2100,0.06,0.05,0,{attack:0.006}); break;
    case 'open':    tone(1046,0.12,0.055,0,{to:1568,bend:0.6}); break;
    case 'close':   tone(1046,0.14,0.045,0,{to:660,bend:0.7}); break;
    case 'confirm': tone(1046,0.07,0.045,0); tone(1318,0.07,0.045,0.045);
                    tone(1568,0.09,0.05,0.09); tone(2093,0.22,0.05,0.135,{shimmer:10}); break;
    case 'record':  tone(1318,0.09,0.05,0); tone(1760,0.09,0.05,0.06);
                    dyad(2093,2637,0.3,0.042,0.12,{shimmer:7}); break;
    case 'start':   tone(392,0.34,0.05,0,{to:1046,bend:0.9,attack:0.03});
                    dyad(1046,1568,0.4,0.04,0.3,{shimmer:6,attack:0.05}); break;
    case 'level':   [1046,1318,1568,2093].forEach((f,i)=>tone(f,i===3?0.42:0.11,0.05,i*0.085,i===3?{shimmer:7}:{})); break;
    case 'done':    dyad(1046,1568,0.16,0.045,0); dyad(1318,1976,0.5,0.045,0.17,{shimmer:6,attack:0.04}); break;

let HITIV=0, HITEND=0;
/* Two copies of the warp on one timeline: full strength for panels, a quarter for buttons. */
const WARPS=[['uiwarp',1],['uiwarpS',0.25]];
function panelHitStop(){
  clearInterval(HITIV); clearTimeout(HITEND);
  WARPS.forEach(([id])=>{ const d=document.getElementById(id+'Disp'); if(d) d.setAttribute('scale',0); });
  document.querySelectorAll('.uistatic').forEach(x=>x.remove());
  document.querySelectorAll('.hit').forEach(x=>{ x.classList.remove('hit'); x.style.removeProperty('--gdur'); });

/* Contents torn through the displacement filter for a moment. A second warp joins one
   already running instead of cutting it short; wash adds the screen's static with it. */
function warpEls(els,wash){
  els=els.filter(Boolean);
  if(!els.length || !fx() || document.hidden) return;
  clearInterval(HITIV); clearTimeout(HITEND);
  const dur=Math.round(RND(190,260));
  els.forEach(el=>{ el.style.setProperty('--gdur',dur+'ms'); el.classList.add('hit'); });
  if(wash && !document.querySelector('.uistatic')){
    const st=document.createElement('div');
    st.className='uistatic'; st.style.setProperty('--gdur',dur+'ms');
    document.body.appendChild(st);
  }
  const F=[[62,'0.006 0.20'],[16,'0.002 0.07'],[48,'0.008 0.26'],[9,'0.001 0.04'],
           [38,'0.005 0.17'],[6,'0.002 0.09'],[24,'0.007 0.22'],[3,'0.001 0.05'],
           [14,'0.004 0.13'],[0,'0.002 0.09']];
  let i=0;
  const step=()=>{ const f=F[i++]; if(!f) return; const seed=Math.floor(RND(1,90));
    WARPS.forEach(([id,k])=>{ document.getElementById(id+'Disp').setAttribute('scale',f[0]*k);
      const n=document.getElementById(id+'Noise'); n.setAttribute('baseFrequency',f[1]); n.setAttribute('seed',seed); }); };
  step();
  HITIV=setInterval(step,Math.max(16,Math.round(dur/F.length)));
  HITEND=setTimeout(panelHitStop,dur+30);
}
function panelHit(...els){ warpEls(els,true); }

function topSheet(){
  const l=document.querySelectorAll('#sheetWrap .sheet:not(.out)');

/* Replace by default. Stacking keeps the panel beneath on screen. Full panel to full
   panel is one screen changing: the backdrop stays and only the contents glitch. */
function setSheet(html,stack){
  const wrap=document.getElementById('sheetWrap');
  const had=!!wrap.querySelector('.veil:not(.out)');
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const nv=tmp.querySelector('.veil'), ns=tmp.querySelector('.sheet');
  if(stack && had){
    const depth=wrap.querySelectorAll('.sheet').length, below=topSheet();
    const box=document.createElement('div'); box.className='layer';
    nv.style.zIndex=65+depth*10; nv.classList.add('noanim','vstack'); nv.removeAttribute('id');
    ns.style.zIndex=70+depth*10;
    box.append(nv,ns);
    const same=below && ns.classList.contains('full') && below.classList.contains('full');
    if(same) ns.classList.add('cut');
    wrap.appendChild(box);
    if(same) panelHit(ns);
    lock(true);
    return;
  }
  const old=had && ns.classList.contains('full')?[...wrap.querySelectorAll('.sheet.full:not(.out)')].pop():null;
  if(old){
    old.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    wrap.querySelectorAll('.layer').forEach(x=>x.remove());
    wrap.querySelectorAll('.veil').forEach(v=>v.classList.add('noanim','panel'));
    old.remove();
    ns.classList.add('cut');
    wrap.appendChild(ns);
    panelHit(ns);
    lock(true);
    return;
  }
  wrap.innerHTML='';
  wrap.append(nv,ns);
  lock(true);
  if(ns.classList.contains('full')) nv.classList.add('panel');
  if(had){ nv.classList.add('noanim'); ns.classList.add('swapin'); }
}

  sh.classList.remove('cut'); sh.classList.add('out');

/* ---------- interference ----------
   A thin line of static rolls down the glass at uneven intervals and buzzes once per
   crossing. The canvas behind it is redrawn only while it is on screen. */
let BUZZING=false;
function buzz(el){
  if(BUZZING) return;
  BUZZING=true;
  const set=(sk,tx,go,ln,bf,bc,bb,op)=>{
    el.style.setProperty('--sk',sk); el.style.setProperty('--tx',tx); el.style.setProperty('--go',go);
    el.style.setProperty('--ln',ln); el.style.setProperty('--bf',bf); el.style.setProperty('--bc',bc);
    el.style.setProperty('--bb',bb); el.style.opacity=op;
  };
  let n=0; const shots=Math.round(RND(3,7));
  (function again(){
    set(RND(-3.4,3.4).toFixed(2)+'deg',Math.round(RND(-18,18))+'px',RND(.42,.66).toFixed(3),'1',
        RND(1.8,3).toFixed(2)+'px','1.2','1.1',RND(0.85,1.15).toFixed(2));
    if(++n<shots) return setTimeout(again,RND(28,70));
    setTimeout(()=>{ set('0deg','0px','.1','.5','.55px','1.05','1.02',RND(0.4,0.62).toFixed(2)); BUZZING=false; },RND(40,90));
  })();
}
function rollPass(){
  const el=document.querySelector('.roll');
  if(!fx()) return setTimeout(rollPass,3000);
  if(document.hidden) return setTimeout(rollPass,600);
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const h=Math.round(RND(14,34));
  el.style.height=h+'px';
  el.style.opacity=RND(0.4,0.62).toFixed(2);
  const from=-h-10, to=vh+10, dur=Math.round((to-from)/((vh+40)/6.8)*1000);
  const a=el.animate([{transform:'translate3d(0,'+from+'px,0)'},{transform:'translate3d(0,'+to+'px,0)'}],
                     {duration:dur,easing:'linear'});
  const bz=setTimeout(()=>buzz(el),dur*RND(0.15,0.8));
  a.onfinish=()=>{ clearTimeout(bz); el.style.opacity=0; setTimeout(rollPass,RND(6000,38000)); };
}
let NCTX=null, NIMG=null, NLAST=0;
function drawStatic(){
  const el=document.querySelector('.roll'), cv=document.getElementById('rollCv');
  if(!fx()) return setTimeout(drawStatic,1000);
  requestAnimationFrame(drawStatic);
  const now=Date.now();
  if(now-NLAST<42 || document.hidden || +el.style.opacity===0) return;
  NLAST=now;
  if(!NCTX){ NCTX=cv.getContext('2d'); NIMG=NCTX.createImageData(cv.width,cv.height); }
  const d=NIMG.data, w=cv.width, h=cv.height, hot=BUZZING;
  for(let y=0;y<h;y++){
    const base=RND(hot?40:20,hot?150:95), tear=Math.random()<(hot?0.22:0.07);
    const at=tear?Math.floor(RND(0,w)):-1, len=tear?Math.floor(RND(6,w*0.6)):0, bright=Math.random()<0.6;
    for(let x=0;x<w;x++){
      let v=base+RND(-55,55);
      if(tear && x>=at && x<at+len) v=bright?v+RND(60,130):v*0.25;
      v=Math.max(0,Math.min(255,v));
      const i=(y*w+x)*4;
      d[i]=v; d[i+1]=Math.min(255,v*1.03); d[i+2]=v*0.94; d[i+3]=255;
    }
  }
  NCTX.putImageData(NIMG,0,0);
}

/* Re-render with the named sections held at their old height while only they warp, then
   glide them to the new height; the sections below follow in step. */
function renderMorph(...mids){
  const card=id=>$('main').querySelector('.meal[data-m="'+id+'"]');
  const before=mids.map(id=>{ const c=card(id); return c?c.offsetHeight:0; });
  render();
  const cards=mids.map(card).filter(Boolean);
  cards.forEach((c,i)=>{
    const h0=before[i], h1=c.offsetHeight;
    if(calm() || !h0 || h0===h1) return;
    c.style.height=h0+'px'; c.classList.add('morph');
    setTimeout(()=>{ c.style.height=h1+'px'; },200);
    const done=e=>{ if(e.target!==c || e.propertyName!=='height') return;
      c.removeEventListener('transitionend',done); c.classList.remove('morph'); c.style.height=''; };
    c.addEventListener('transitionend',done);
  });
  warp(...cards);
}
/* Collapse or open a section by animating its contents between their height and none. */
function fold(card,shut){
  const body=card.querySelector('.mbody'), h=body.scrollHeight;
  if(calm() || !h){ card.classList.toggle('shut',shut); return; }
  body.style.height=(shut?h:0)+'px';
  void body.offsetHeight;
  card.classList.toggle('shut',shut);
  body.style.height=(shut?0:h)+'px';
  const done=e=>{ if(e.propertyName!=='height') return; body.removeEventListener('transitionend',done); if(!shut) body.style.height=''; };
  body.addEventListener('transitionend',done);
}

/* Holding still on el for half a second runs fn; the tap that ends the hold is swallowed. */
function bindHold(el,fn){
  let t=0, x0=0, y0=0, fired=0;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY;
    t=setTimeout(()=>{ fired=Date.now(); try{ navigator.vibrate(30); }catch(x){} fn(); },500); });
  el.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-x0)>8 || Math.abs(e.clientY-y0)>8) clearTimeout(t); });
  ['pointerup','pointercancel'].forEach(k=>el.addEventListener(k,()=>clearTimeout(t)));
  el.addEventListener('click',e=>{ if(Date.now()-fired<600){ e.stopPropagation(); e.preventDefault(); } },true);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

/* A sideways drag on el (dir 1 right, -1 left). Released past frac of its width, fn runs.
   The pointer is only captured once the drag is clearly sideways, so taps and vertical
   scrolling pass through untouched, and the tap that ends a drag is swallowed. */
function bindSwipe(el,dir,frac,fn){
  let x0=null, y0=0, on=false, go=false, moved=0;
  const reset=()=>{ x0=null; on=false; el.classList.remove('drag','ready'); el.style.setProperty('--dx','0px'); };
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; go=false; });
  el.addEventListener('pointermove',e=>{
    if(x0===null) return;
    const dx=Math.max(0,(e.clientX-x0)*dir), dy=Math.abs(e.clientY-y0);
    if(!on){
      if(dy>12 && dy>dx) return reset();
      if(dx<10) return;
      on=true; el.setPointerCapture(e.pointerId); el.classList.add('drag');
    }
    el.style.setProperty('--dx',dx+'px');
    go=dx>el.offsetWidth*frac;
    el.classList.toggle('ready',go);
  });
  el.addEventListener('pointerup',()=>{ const run=on&&go; if(on) moved=Date.now(); reset(); if(run) fn(); });
  el.addEventListener('pointercancel',reset);
  el.addEventListener('click',e=>{ if(Date.now()-moved<400){ e.stopPropagation(); e.preventDefault(); } },true);
}
/* Tune an overlay control in or out with the panels' scan-in; one already on stays put. */
function tune(el,on){
  clearTimeout(el.tt);
  if(on){
    if(!el.hidden && !el.classList.contains('out')) return;
    el.hidden=false; el.classList.remove('out','in'); void el.offsetWidth; el.classList.add('in');
  } else if(!el.hidden){
    el.classList.replace('in','out');
    el.tt=setTimeout(()=>{ el.hidden=true; el.classList.remove('out'); },340);
  }
}

/* A line through the points that have a value, the average dashed across, and (full size)
   a scale, labels and a guide that marks the selected point. */
const PL={L:34,R:14,T:12,B:22};
function plot(pts,sel,W,H,mini){
  const vals=pts.map(p=>p.v), have=vals.filter(Boolean), n=pts.length;
  if(mini && have.length<2) return '<svg class="wg mini" viewBox="0 0 '+W+' '+H+'"></svg>';
  const lo=have.length?Math.min(...have):70, hi=have.length?Math.max(...have):80, pad=Math.max(0.4,(hi-lo)*0.25), mn=lo-pad, mx=hi+pad;
  const L=mini?3:PL.L, R=mini?3:PL.R, Tp=mini?4:PL.T, B=mini?4:PL.B;
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>Tp+(mx-v)*(H-Tp-B)/(mx-mn), avg=have.length?have.reduce((s,v)=>s+v,0)/have.length:null;
  const pts2=vals.map((v,i)=>v?[x(i),y(v)]:null).filter(Boolean), si=pts.findIndex(p=>p.k===sel);
  let s='<svg class="wg'+(mini?' mini':'')+'" viewBox="0 0 '+W+' '+H+'">';
  if(!mini){
    [mx-pad,(mn+mx)/2,mn+pad].forEach(v=>{ s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
    pts.forEach((p,i)=>{ s+='<text data-k="'+p.k+'" class="'+(p.k===sel?'on':p.k===today()?'now':'')+'" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+p.lab+'</text>'; });
    s+='<line class="guide" x1="'+x(Math.max(0,si))+'" x2="'+x(Math.max(0,si))+'" y1="'+Tp+'" y2="'+(H-B)+'"'+(si<0?' visibility="hidden"':'')+'/>';
  }
  if(avg!==null && have.length>1) s+='<line class="avg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(avg)+'" y2="'+y(avg)+'"/>'+
    (mini?'':'<text class="avgt" x="'+(W-R)+'" y="'+(y(avg)-5)+'" text-anchor="end">AVG '+avg.toFixed(1)+'</text>');
  if(pts2.length>1) s+='<polyline class="ln" points="'+pts2.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')+'"/>';
  vals.forEach((v,i)=>{ if(v) s+='<circle data-k="'+pts[i].k+'" class="'+(pts[i].k===sel?'dot on':'dot')+'" cx="'+x(i)+'" cy="'+y(v)+'" r="'+(mini?2:pts[i].k===sel?5.5:3.5)+'"/>'; });
  return s+'</svg>';
}
/* Move the selection on a drawn graph without redrawing it, so a finger can keep sliding. */

    const a=average(DAY,+BD); t=a.t; has=a.c>0;
    note=has?'Daily average \u00b7 '+a.c+' logged day'+(a.c===1?'':'s')+' to '+shortDay(DAY):'Nothing logged in these '+BD+' days';
  }
  const head='<div class="stat">'+esc(note.toUpperCase())+'</div>';
  if(!has){ $('bdBody').innerHTML=head+(BD==='1'?'<div class="stat">NOTHING LOGGED</div>':''); return; }
  const X=Object.fromEntries(XN.map(x=>[x[0],x]));
  const row=(l,v,u,goal,sub)=>{ const s=u==='g'?r1(v):Math.round(v);
    return s>0?'<div'+(sub?' class="sub"':'')+'><span>'+l+'</span><b>'+(u==='g'?s:fmt(s))+(goal?' / '+fmt(goal):'')+' '+u+'</b></div>':''; };
  const xr=k=>row(X[k][1],t[k],X[k][3],0,true);
  $('bdBody').innerHTML=head+
    '<div class="card pgcard"><div class="xled">'+
      row('Energy',t.k,'kcal',T.k)+row('Energy',t.k*4.184,'kJ',0,true)+
      row('Protein',t.p,'g',T.p)+
      row('Fat',t.f,'g',T.f)+xr('sf')+xr('tf')+xr('pf')+xr('mf')+
      row('Carbohydrate',t.c,'g',T.c)+xr('su')+
      xr('fi').replace(' class="sub"','')+xr('na').replace(' class="sub"','')+xr('ch').replace(' class="sub"','')+
    '</div></div>';
}

/* ---------- targets reached: each once a day; both together takes the screen ---------- */
function checkHits(){
  const d=DAY, s=status(totals(d),targets()), h=P().hit[d]||{k:false,p:false};
  const newK=s.kHit&&!h.k, newP=s.pHit&&!h.p;
  if(!newK && !newP) return false;
  P().hit[d]={k:h.k||s.kHit, p:h.p||s.pHit};
  if(s.kHit && s.pHit){ setTimeout(()=>celebrate(d),460); return true; }
  sfx('record');
  try{ navigator.vibrate([40,40,80]); }catch(e){}
  toast(newP?'PROTEIN TARGET SECURED':'CALORIES ON TARGET');
  return true;
}
function celebrate(d){
  fuzz(); sfx('level'); setTimeout(()=>sfx('done'),560);
  try{ navigator.vibrate([60,40,60,40,180]); }catch(e){}
  const t=totals(d), T=targets(), n=streak(d);
  const row=(l,v,g,u,ok)=>'<div><span>'+l+'</span><b class="'+(ok?'ok':'')+'">'+v+' / '+g+' '+u+'</b></div>';
  setSheet('<div class="veil" id="veil"></div><div class="sheet fit full win">'+
    '<h3>Target acquired<button class="shx" id="ceX" aria-label="Close">\u00d7</button></h3>'+
    '<div class="grade"><div class="gletter">\u2713</div><div><div class="wtitle">'+dayName(d)+' \u00b7 clear</div>'+
      '<div class="gtxt">Calories landed on target and protein is secured.</div></div></div>'+
    '<div class="card"><div class="xled">'+row('Calories',fmt(t.k),fmt(T.k),'kcal',true)+row('Protein',Math.round(t.p),T.p,'g',true)+
      row('Carbs',Math.round(t.c),T.c,'g')+row('Fat',Math.round(t.f),T.f,'g')+'</div></div>'+
    '<div class="streak">'+(n>1?'<b>'+n+' days</b> on target in a row':'First day on target in this run')+'</div>'+
    '<button class="btn" id="ceOk">[ ACKNOWLEDGED ]</button></div>');
  $('veil').onclick=$('ceX').onclick=$('ceOk').onclick=closeSheet;
}

/* Foods most recently logged, newest first, drawn from the log itself: anything added and
   then removed was never really eaten, so it never appears here. */
function recentFoods(){
  const seen=new Set(), out=[];
  Object.keys(P().days).filter(d=>d<=today()).forEach(d=>P().days[d].forEach(e=>out.push(e)));
  return out.sort((x,y)=>y.t-x.t).filter(e=>{ const k=e.fid||e.n+'|'+e.sv; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,40);
}
/* Saved meals and foods as one list. Tap opens one; hold opens its editor in place: rename,
   share with another profile, or delete with a second tap. */
function savedList(L,q,onFood,onMeal,ed){
  const s=q.trim().toLowerCase(), has=x=>!s || x.n.toLowerCase().includes(s), az=(x,y)=>x.n.localeCompare(y.n);
  const meals=P().combos.filter(has).sort(az), foods=P().foods.filter(has).sort(az);
  const rows=meals.map(o=>({t:'meal',o})).concat(foods.map(o=>({t:'food',o})));
  const tot=o=>o.items.reduce((a,e)=>{ a.k+=e.k*e.q; a.p+=e.p*e.q; a.c+=e.c*e.q; a.f+=e.f*e.q; return a; },{k:0,p:0,c:0,f:0});
  const others=Object.keys(DB.profiles).filter(n=>n!==DB.cur);
  const row=(r,i)=>{
    const o=r.o, m=r.t==='meal', t=m?tot(o):o;
    if(o.id===ed) return '<div class="ri edit"><input class="fld" id="svE" maxlength="24" autocomplete="off" value="'+esc(o.n)+'">'+
      (others.length?'<button class="rx" id="svShare" aria-label="Share with another profile">\u2197</button>':'')+
      '<button class="rx" id="svDel" aria-label="Delete">\u00d7</button></div>'+
      '<div class="duo"><button class="btn ghost" id="svX">[ CLOSE ]</button><button class="btn" id="svOk">[ ACCEPT ]</button></div>';
    return '<div class="ri" data-i="'+i+'" role="button" tabindex="0"><span class="rm"><span class="rn">'+esc(o.n)+'</span>'+
      '<span class="rs">'+(m?o.items.length+' ITEM'+(o.items.length===1?'':'S'):esc(o.sv))+' \u00b7 P'+Math.round(t.p)+' C'+Math.round(t.c)+' F'+Math.round(t.f)+'</span></span>'+
      '<span class="rk">'+fmt(t.k)+'</span></div>';
  };
  const head=(label,n)=>n && rows.length>n?'<div class="lh">'+label+'</div>':'';
  L.innerHTML=rows.length?head('MEALS',meals.length)+rows.slice(0,meals.length).map(row).join('')+
      head('FOODS',foods.length)+rows.slice(meals.length).map((r,i)=>row(r,i+meals.length)).join('')
    :'<div class="stat">'+(P().foods.length||P().combos.length?'NOTHING MATCHES':'NOTHING SAVED YET')+'</div>';
  const again=id=>savedList(L,q,onFood,onMeal,id);
  L.querySelectorAll('.ri[data-i]').forEach(el=>{
    const r=rows[el.dataset.i];
    el.onclick=()=>r.t==='meal'?onMeal(r.o):onFood(r.o);
    bindHold(el,()=>again(r.o.id));
  });
  if(!ed) return;
  const r=rows.find(x=>x.o.id===ed), I=$('svE'); if(!r) return again();
  setTimeout(()=>{ I.focus(); I.select(); },150);
  $('svX').onclick=()=>again();
  const ok=()=>{ const n=cleanName(I.value); if(!n){ sfx('nope'); return toast('ENTER A NAME'); }
    if(n!==r.o.n){ r.o.n=n; r.o.e=Date.now(); touch(); } sfx('confirm'); again(); };
  $('svOk').onclick=ok;
  I.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } };
  if($('svShare')) $('svShare').onclick=()=>shareSheet(r,()=>again());
  arm($('svDel'),()=>{ dropSaved(r.t,r.o.id); toast(r.t==='meal'?'MEAL DELETED':'FOOD DELETED'); again(); });
}

function upsertFood(f){
  const L=P().foods, now=Date.now();
  let x=(f.bc && L.find(y=>y.bc===f.bc)) || L.find(y=>y.n.toLowerCase()===f.n.toLowerCase() && y.sv.toLowerCase()===f.sv.toLowerCase());
  if(x){ x.u=x.e=now; if(f.bc && !x.bc) x.bc=f.bc; return x; }
  x=cleanFood(Object.assign({},f,{id:uid(),u:now,e:now}));
  L.unshift(x);
  return x;
}
function dropSaved(kind,id){
  const k=kind==='meal'?'combos':'foods';
  P()[k]=P()[k].filter(x=>x.id!==id); P().del[id]=Date.now(); touch();
}

/* Nutrition panel rows in Australian label order: key, label, unit, sub-row. */
const NP=[['k','Energy','kcal',0],['p','Protein','g',0],['f','Fat, total','g',0],['sf','\u2013 saturated','g',1],['tf','\u2013 trans','g',1],
  ['pf','\u2013 polyunsaturated','g',1],['mf','\u2013 monounsaturated','g',1],['c','Carbohydrate','g',0],['su','\u2013 sugars','g',1],
  ['fi','Dietary fibre','g',0],['na','Sodium','mg',0],['ch','Cholesterol','mg',0]];
const npVal=(f,k)=>'kpcf'.includes(k)?f[k]:f.x[k];
function foodForm(f){
  const v=x=>x===undefined||x===null?'':x;
  const tog=(id,items)=>'<span class="eu" id="'+id+'" data-v="'+items[0][0]+'">'+items.map(([k,l],i)=>'<button type="button" data-v="'+k+'"'+(i?'':' class="on"')+'>'+l+'</button>').join('')+'</span>';
  const row=([k,l,unit,sub])=>{ const id='kpcf'.includes(k)?'ff'+k:'fx'+k;
    return '<label class="nrow'+(sub?' nsub':'')+'" for="'+id+'"><span class="nl">'+l+'</span>'+
      '<input class="fld" id="'+id+'" type="number" inputmode="decimal" step="any" placeholder="0" value="'+v(npVal(f,k))+'"><span class="nu">'+unit+'</span></label>'; };
  return '<label class="flab" for="ffN">Name</label><input class="fld" id="ffN" maxlength="80" autocomplete="off" value="'+esc(f.n||'')+'" placeholder="e.g. Chicken breast, grilled">'+
    '<div class="fgrid sw"><div><label class="flab" for="ffS">Serving</label><input class="fld" id="ffS" maxlength="30" autocomplete="off" value="'+esc(f.sv||'')+'" placeholder="e.g. 1 slice, 1 cup"></div>'+
      '<div><label class="flab" for="ffW">Weight g</label><input class="fld" id="ffW" type="number" inputmode="decimal" step="any" placeholder="0"></div></div>'+
    '<label class="flab" for="ffBc">Barcode</label><div class="srch"><input class="fld" id="ffBc" readonly placeholder="None" value="'+esc(f.bc||'')+'">'+
      '<button class="btn" type="button" id="ffScan">[ SCAN ]</button></div>'+
    '<button class="btn ghost fflabel" type="button" id="ffLabel">[ SCAN NUTRITION LABEL ]</button>'+
    '<div class="flab fsec">Nutrition per'+tog('ffB',[['s','SERVING'],['h','100 G'],['1','1 G']])+'</div>'+
    '<div class="ntab"><div class="nrow"><label class="nl" for="ffK">Energy</label>'+
      '<input class="fld" id="ffK" type="number" inputmode="decimal" step="any" placeholder="0" value="'+v(f.k)+'">'+tog('ffU',[['k','KCAL'],['j','KJ']])+'</div>'+
      NP.slice(1).map(row).join('')+'</div>';
}

function bindFoodForm(box,btn){

/* Scan a barcode onto the food being entered. If Open Food Facts knows it, anything not
   yet filled in is filled from the label data there. */
function scanInto(box,ready){
  setSheet('<div class="veil"></div><div class="sheet"><h3 class="qh">Scan barcode<button class="shx back" id="bsBack" aria-label="Back">\u2039</button></h3>'+
    '<div id="bsHost"></div></div>',true);
  lastVeil().onclick=popSheet; $('bsBack').onclick=popSheet;
  scanView($('bsHost'),async code=>{
    scStat('LOOKING UP '+code+'\u2026');
    let f=null; try{ f=await offLookup(code); }catch(e){}
    popSheet();
    box.querySelector('#ffBc').value=code;
    if(!f){ sfx('confirm'); toast('BARCODE ADDED \u00b7 NOT IN OPEN FOOD FACTS'); return; }
    if(!fillForm(box,Object.assign({basis:'s',unit:'k'},f),ready)){ sfx('confirm'); toast('BARCODE ADDED'); }
  });
  startScan();
}
/* Put label values into the form: name and serving only where still empty, and the numbers
   only as a set, when no energy has been typed yet. Anything filled is marked, and the footer
   asks whether it's right: CONFIRM keeps it, CLEAR puts the form back as it was. */
function fillForm(box,f,ready){
  const q=id=>box.querySelector('#'+id), snap=[...box.querySelectorAll('input.fld')].map(i=>[i,i.value]),
    togs=[...box.querySelectorAll('.eu')].map(t=>[t,t.dataset.v]), filled=[];
  const fill=(id,val)=>{ if(q(id).value==='' && val!==null && val!==undefined && val!==''){ q(id).value=val; filled.push(q(id)); } };
  const setTog=(t,v)=>{ t.dataset.v=v; t.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===v)); };
  fill('ffN',f.n); fill('ffS',f.sv); fill('ffW',f.w);
  const fresh=q('ffK').value==='';
  if(fresh){
    setTog(q('ffB'),f.basis); setTog(q('ffU'),f.unit);
    fill('ffK',f.k); fill('ffp',f.p); fill('ffc',f.c); fill('fff',f.f); XN.forEach(([k])=>fill('fx'+k,f.x[k]));
  }
  if(!filled.length) return false;
  filled.forEach(i=>i.classList.add('auto'));
  const foot=box.querySelector('.pfoot');
  [...foot.children].forEach(c=>c.hidden=true);
  foot.insertAdjacentHTML('afterbegin','<div class="ask"><span>FILLED IN \u00b7 IS THIS CORRECT?</span>'+
    '<div class="duo"><button class="btn ghost" id="askX">[ CLEAR ]</button><button class="btn" id="askOk">[ CONFIRM ]</button></div></div>');
  const done=()=>{ filled.forEach(i=>i.classList.remove('auto')); foot.querySelector('.ask').remove(); [...foot.children].forEach(c=>c.hidden=false); ready(); };
  $('askOk').onclick=()=>{ sfx('confirm'); done(); };
  $('askX').onclick=()=>{ snap.forEach(([i,v])=>i.value=v); togs.forEach(([t,v])=>setTog(t,v)); done(); toast('CLEARED'); };
  ready(); sfx('confirm');
  return true;
}
/* The label is read by the phone itself: iPhone's Scan Text types what the camera sees into the
   box (paste works too), and the rows are matched here. On an Australian panel the first number
   on a row is per serving, the second per 100 g. */
function scanLabel(box,ready){
  setSheet('<div class="veil"></div><div class="sheet"><h3 class="qh">Scan label<button class="shx back" id="slBack" aria-label="Back">\u2039</button></h3>'+
    '<div class="pgnote">Tap the box, choose <b>Scan Text</b> (the camera button above the keyboard, or tap and hold \u203a Scan Text) and point it at the nutrition panel. Or paste text copied from a photo.</div>'+
    '<textarea class="fld lbl" id="slT" rows="7" placeholder="Nutrition information"></textarea>'+
    '<button class="btn" id="slGo" disabled>[ FILL FORM ]</button></div>',true);
  lastVeil().onclick=popSheet; $('slBack').onclick=popSheet;
  const T=$('slT'); T.oninput=()=>$('slGo').disabled=!T.value.trim();

  };
}
const NIP=[['k',/energy/],['p',/protein/],['sf',/satur/],['tf',/trans/],['pf',/poly/],['mf',/mono/],['f',/fat/],
  ['su',/sugar/],['c',/carb/],['fi',/fib(re|er)/],['na',/sodium/],['ch',/cholest/]];
function parseLabel(txt){
  const rows={};
  txt.split(/\n+/).forEach(l=>{
    const low=l.toLowerCase().replace(/(\d),(\d)/g,'$1.$2'), hit=NIP.find(([,re])=>re.test(low));
    if(!hit || rows[hit[0]]) return;
    const k=hit[0], all=[...low.matchAll(/(\d+(?:\.\d+)?)\s*(kj|kcal|cal|mg|g)?/g)];
    if(k==='k'){
      const kj=all.filter(m=>m[2]==='kj'), kc=all.filter(m=>m[2]==='kcal'||m[2]==='cal');
      const use=kj.length?kj:kc.length?kc:all;
      if(use.length) rows.k={u:kc.length&&!kj.length?'k':'j', n:use.map(m=>+m[1])};
      return;
    }
    const mg=k==='na'||k==='ch', n=all.map(m=>mg&&m[2]==='g'?+m[1]*1000:+m[1]);
    if(n.length) rows[k]={n};
  });
  if(!rows.k || Object.keys(rows).length<2) return null;
  const sm=txt.match(/serving size[:\s]*([^\n]+)/i), sv=sm?sm[1].trim().slice(0,30):'';
  const col=sv?0:(rows.k.n.length>1?1:0), pick=r=>r?r.n[Math.min(col,r.n.length-1)]:null;
  const x={}; XN.forEach(([key])=>{ const v=pick(rows[key]); if(v) x[key]=r1(v); });
  return {sv, basis:sv?'s':'h', unit:rows.k.u, k:pick(rows.k), p:pick(rows.p), c:pick(rows.c), f:pick(rows.f), x};
}
/* Values can be typed per serving, per 100 g or per 1 g; the food is kept per serving,
   with the serving's weight so it can be logged by weight too. */
function readFoodForm(box){
  const g=id=>box.querySelector('#'+id).value.trim();
  const bad=(id,m)=>{ sfx('nope'); toast(m); box.querySelector('#'+id).focus(); return null; };
  const n=g('ffN').replace(/\s+/g,' ');
  if(!n) return bad('ffN','GIVE IT A NAME');
  let k=g('ffK')===''?null:num(g('ffK'),0,40000);
  if(k===null) return bad('ffK','ENTER THE ENERGY');
  if(box.querySelector('#ffU').dataset.v==='j') k/=4.184;
  const txt=g('ffS'), w=g('ffW')===''?0:num(g('ffW'),0.1,5000);
  if(w===null) return bad('ffW','CHECK THE WEIGHT');
  const gw=w||(gramsOf(txt)||{}).n||0, basis=box.querySelector('#ffB').dataset.v;
  if(basis!=='s' && txt && !gw) return bad('ffW','ENTER THE SERVING WEIGHT');
  const sv=!txt?(gw?gw+' g':basis==='s'?'1 serving':'100 g'):w && !gramsOf(txt)?(txt+' ('+w+' g)').slice(0,30):txt;
  const per=basis==='s'?1:(gw||100)/(basis==='h'?100:1);
  if(k*per>9000) return bad('ffK','THAT ENERGY LOOKS TOO HIGH');
  const f={n, sv, k:r1(k*per), x:{}, bc:g('ffBc')};
  for(const m of ['p','c','f']){ const v=num(g('ff'+m)||0,0,1500); if(v===null) return bad('ff'+m,'CHECK THE MACROS'); f[m]=r1(v*per); }
  for(const [x] of XN){ const v=num(g('fx'+x)||0,0,100000); if(v===null) return bad('fx'+x,'CHECK THE DETAIL VALUES'); if(v) f.x[x]=r1(v*per); }
  return f;
}
/* Edit a food's name and label. A saved food is updated in place; one not saved yet (an

function openFoodEdit(food,after,canDelete){

/* ---------- barcodes: the browser's detector where there is one, ZXing on iPhone ---------- */
const SCAN={on:false, stream:null, raf:0, zx:null, host:null, cb:null};
const sq=s=>SCAN.host && SCAN.host.querySelector(s);
/* The camera view, drawn into host; every barcode read goes to cb. One camera at a time. */
function scanView(host,cb){
  stopScan();
  host.innerHTML='<div class="scanbox"><video playsinline muted autoplay></video><div class="sfr"></div><div class="sln"></div>'+
    '<div class="sidle">[ CAMERA OFF ]</div></div><div class="stat"></div><div class="scres"></div>'+
    '<button class="btn scgo">[ START CAMERA ]</button><div class="src">DATA: OPEN FOOD FACTS</div>';
  SCAN.host=host; SCAN.cb=cb;
  sq('.scgo').onclick=()=>SCAN.on?stopScan():startScan();
  sq('video').onplaying=()=>{ if(SCAN.on) sq('.scanbox').classList.add('live'); };   // label clears only on real frames
}
let ZXP=null;
function loadZX(){
  return ZXP=ZXP||new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=res; s.onerror=()=>{ ZXP=null; rej(); };
    document.head.appendChild(s);
  });
}
function scStat(t,err){ const el=sq('.stat'); if(el){ el.textContent=t; el.classList.toggle('err',!!err); } }
function scPaint(on){
  if(!sq('.scgo')) return;
  sq('.scgo').textContent=on?'[ STOP CAMERA ]':'[ START CAMERA ]';
  if(!on) sq('.scanbox').classList.remove('live');
}
const CAM={video:{facingMode:{ideal:'environment'}},audio:false};
async function startScan(){
  if(!navigator.mediaDevices){ sfx('nope'); return scStat('NO CAMERA HERE \u2014 TRY SEARCH',true); }
  sq('.scres').innerHTML='';
  let det=null;
  try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){}
  if(det){
    try{ SCAN.stream=await navigator.mediaDevices.getUserMedia(CAM); }
    catch(e){ sfx('nope'); return scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
    const v=sq('video'); v.srcObject=SCAN.stream; v.play().catch(()=>{});
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    const loop=async()=>{
      if(!SCAN.on) return;
      try{ const c=await det.detect(v); if(c.length) return gotCode(c[0].rawValue); }catch(e){}
      SCAN.raf=requestAnimationFrame(loop);
    };
    return loop();
  }
  scStat('LOADING SCANNER\u2026');
  try{ await loadZX(); }catch(e){ sfx('nope'); return scStat('SCANNER DID NOT LOAD \u2014 TRY SEARCH',true); }
  if(!SCAN.host.isConnected) return;
  try{
    const Z=ZXing, hints=new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]]]);
    SCAN.zx=new Z.BrowserMultiFormatReader(hints,250);
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    await SCAN.zx.decodeFromConstraints(CAM,sq('video'),r=>{ if(r && SCAN.on) gotCode(r.getText()); });
  }catch(e){ stopScan(); sfx('nope'); scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
}
function stopScan(){
  SCAN.on=false;
  cancelAnimationFrame(SCAN.raf);
  if(SCAN.zx){ SCAN.zx.reset(); SCAN.zx=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
  scPaint(false);
}
function gotCode(code){
  if(!SCAN.on) return;
  stopScan();
  try{ navigator.vibrate(50); }catch(e){}
  SCAN.cb(code.replace(/\D/g,''));
}
function offMap(p){
  const n=p.nutriments||{};
  const val=k=>{ const v=n[k]; return v===undefined||v===null||v===''||!isFinite(+v)?null:+v; };
  const kcal=s=>{ const k=val('energy-kcal'+s); if(k!==null) return k;
    const kj=val('energy-kj'+s)!==null?val('energy-kj'+s):val('energy'+s);   // OFF "energy" is kJ
    return kj===null?null:kj/4.184; };
  let per='_serving', k=kcal(per), sv=String(p.serving_size||'').trim().slice(0,30);
  if(!sv || k===null){ per='_100g'; k=kcal(per); sv=p.nutrition_data_per==='100ml'?'100 ml':'100 g'; }
  const name=String(p.product_name||p.generic_name||'').replace(/\s+/g,' ').trim();
  if(k===null || !name) return null;
  const g=gramsOf(sv);
  const m=f=>{ let v=val(f+per); if(v===null && per==='_serving' && g && val(f+'_100g')!==null) v=val(f+'_100g')*g.n/100; return v>0?v:0; };
  const x={}; XN.forEach(([key,,,,off,mul])=>{ const v=m(off); if(v) x[key]=r1(v*mul); });
  const br=String(p.brands||'').split(',')[0].trim();
  return {n:(br && !name.toLowerCase().includes(br.toLowerCase())?br+' '+name:name).slice(0,80),
    sv, k:r1(k), p:r1(m('proteins')), c:r1(m('carbohydrates')), f:r1(m('fat')), x, bc:String(p.code||'').replace(/\D/g,'')};
}
const OFF_FIELDS='code,product_name,generic_name,brands,serving_size,nutrition_data_per,nutriments';
/* A barcode's product from Open Food Facts, mapped to a food, or null if it isn't there. */
async function offLookup(code){
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields='+OFF_FIELDS);
  const j=r.ok?await r.json():null;
  return j && j.status===1?offMap(j.product):null;
}
async function lookupCode(code){
  const saved=P().foods.find(f=>f.bc===code);
  if(saved){ sfx('confirm'); return openQty(saved,{}); }
  scStat('LOOKING UP '+code+'\u2026');
  try{
    const f=await offLookup(code);
    if(f){ sfx('confirm'); scStat(''); return openQty(f,{save:true}); }
    sfx('nope'); scStat('NO MATCH FOR '+code,true);
    sq('.scres').innerHTML='<button class="btn ghost">[ ADD IT BY HAND ]</button>';
    sq('.scres button').onclick=()=>openNewFood({bc:code});
  }catch(e){ sfx('nope'); scStat('LOOKUP FAILED \u2014 CHECK THE CONNECTION',true); }
}

/* ---------- search: runs as you type; Australian products first, world fills in ---------- */
let SRT=0, SRC=null;
const SRCACHE=new Map();
function queueSearch(q){
  ADD.sq=q; q=q.trim().toLowerCase();
  clearTimeout(SRT);
  if(SRC) SRC.abort();
  if(q.length<3){ ADD.results=[]; paintResults(); $('osSt').textContent=''; return; }
  if(SRCACHE.has(q)) return showResults(SRCACHE.get(q));
  $('osSt').textContent='SEARCHING\u2026'; $('osSt').classList.remove('err');
  SRT=setTimeout(()=>runSearch(q),500);
}
async function runSearch(q){
  const ctl=SRC=new AbortController();
  let out=[], ok=false;
  for(const host of ['au','world']){
    if(out.length>=8) break;
    try{
      const r=await fetch('https://'+host+'.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=30&fields='+
        OFF_FIELDS+'&search_terms='+encodeURIComponent(q),{signal:ctl.signal});
      if(!r.ok) continue;
      (await r.json()).products.map(offMap).filter(Boolean).forEach(f=>{ if(!f.bc || !out.some(x=>x.bc===f.bc)) out.push(f); });
      ok=true;
    }catch(e){ if(ctl.signal.aborted) return; }
  }
  if(!ok) return showResults(null);
  SRCACHE.set(q,out);
  showResults(out);
}
function showResults(out){
  const s=$('osSt'); if(!s) return;
  ADD.results=out||[];
  s.textContent=!out?'SEARCH FAILED \u2014 CHECK THE CONNECTION':out.length?'':'NOTHING FOUND \u2014 TRY FEWER WORDS, OR TAP + TO ADD IT';
  s.classList.toggle('err',!out || !out.length);
  paintResults();
}
function paintResults(){

      const others=M.reduce((a,[x])=>a+(x===k?0:g[x+'p']),0);

/* Hold a row, then drag it up or down; the others slide aside and the order is kept on release. */
function bindReorder(list,onDone){
  const rows=[...list.children];
  rows.forEach((row,from)=>{
    let t=0, y0=0, h=0, to=from, drag=false;
    row.addEventListener('pointerdown',e=>{
      if(e.target.closest('button')) return;
      y0=e.clientY; row.setPointerCapture(e.pointerId);
      t=setTimeout(()=>{ drag=true; h=row.offsetHeight; to=from;
        row.classList.add('lift'); list.classList.add('sorting'); try{ navigator.vibrate(30); }catch(x){} },400);
    });
    row.addEventListener('pointermove',e=>{
      if(!drag){ if(Math.abs(e.clientY-y0)>8) clearTimeout(t); return; }
      const dy=e.clientY-y0;
      to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
      row.style.transform='translateY('+dy+'px)';
      rows.forEach((r,j)=>{ if(r!==row) r.style.transform=(to>from && j>from && j<=to)?'translateY(-'+h+'px)':(to<from && j<from && j>=to)?'translateY('+h+'px)':''; });
    });
    const end=()=>{
      clearTimeout(t);
      if(!drag) return;
      drag=false;
      rows.forEach(r=>r.style.transform='');
      row.classList.remove('lift'); list.classList.remove('sorting');
      if(to!==from) onDone(from,to);
    };
    row.addEventListener('pointerup',end);
    row.addEventListener('pointercancel',end);
  });
}

async function ghConnect(){
  const repo=$('syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/+$/g,'');
  const tok=$('syTok').value.trim();
  const fail=m=>{ ghSave({tok:'',err:''}); sfx('nope'); toast(m); };
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return fail('REPO SHOULD LOOK LIKE OWNER/NAME');
  if(!/^(gh[pousr]_|github_pat_)\w+/.test(tok)) return fail('NOT A GITHUB TOKEN');
  ghSave({tok,repo,err:'',at:0});
  toast('CONNECTING\u2026');
  let info;
  try{ const r=await ghReq('/repos/'+repo); if(!r.ok) return fail(r.status===401?'TOKEN REJECTED':'REPO NOT FOUND OR NOT SHARED WITH TOKEN'); info=await r.json(); }
  catch(e){ return fail('NO CONNECTION'); }
  if(!info.private) return fail('THAT REPO IS PUBLIC \u2014 USE A PRIVATE ONE');
  if(info.permissions && !info.permissions.push) return fail('TOKEN CANNOT WRITE TO THAT REPO');
  ghSave({branch:info.default_branch||'main'});
  const r=await ghSyncAll();
  sfx(r==='ok'?'done':'nope'); toast(r==='ok'?'CONNECTED \u00b7 SYNCED':'SYNC: '+r.toUpperCase());
  render(); openSync();
}

/* ---------- updates ----------
   A home-screen copy can be served from cache. On open and on return it reads the live
   file; if that is a newer build it reloads onto it, but never mid-entry or mid-sync. */
const newer=(a,b)=>{ a=a.split('.').map(Number); b=b.split('.').map(Number);
  for(let i=0;i<4;i++) if((a[i]||0)!==(b[i]||0)) return (a[i]||0)>(b[i]||0); return false; };
async function checkUpdate(){
  if(location.protocol!=='https:') return;
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
    const v=(await r.text()).match(/APP_VERSION='([\d.]+)'/);
    if(v && newer(v[1],APP_VERSION) && !GHT && !GHBUSY && !document.querySelector('#sheetWrap .sheet'))
      location.replace(location.pathname+'?v='+v[1]);
  }catch(e){}
}

setInterval(()=>{ if(FOLLOW && DAY!==today() && !document.querySelector('#sheetWrap .sheet')){ DAY=today(); render(); } },60000);
/* The interface stays hidden until the splash is dismissed, so each start-up step is
   isolated and a watchdog uncovers the app if something goes wrong. */
const boot=(name,fn)=>{ try{ fn(); }catch(e){ console.error('start-up: '+name,e); } };
setTimeout(()=>{ if(document.documentElement.classList.contains('booting')){ booted(); const s=$('splash'); if(s) s.remove(); } },7000);
boot('load',load);
boot('render',render);
boot('sheets',watchSheets);
boot('splash',splash);
boot('interference',()=>{ zapLoop(); setTimeout(rollPass,RND(1500,9000)); drawStatic(); fuzzLoop(); });
boot('sync',()=>{ refreshCog(); if(ghOn()) ghSyncAll().then(()=>{ render(); refreshCog(); }); });
boot('update',checkUpdate);
boot('storage',()=>{ if(STORE==='memory') toast('NOT SAVING \u2014 SAVE A BACKUP FILE'); });
</script>
</body>
</html>
