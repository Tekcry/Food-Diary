.sbox{position:relative;display:flex;align-self:stretch;flex:1;min-width:0}
.sbox .fld{width:100%;height:auto;align-self:stretch;margin:0;padding-right:40px}
.sbox .fld::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sclr{position:absolute;top:0;bottom:0;right:0;width:36px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:var(--dim)}
.sclr[hidden]{display:none}
.sclr:active{color:var(--champ)}
.qlab{flex:1;min-height:0;overflow:auto;scrollbar-width:none;border-top:1px solid var(--cardline)}
.lrow{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:baseline;border-bottom:1px solid var(--hair)}
.lrow span{color:var(--tx)}
.lrow b{font-weight:400;font-family:var(--serif);color:var(--champ);text-align:right;font-variant-numeric:tabular-nums}
.lrow.lsub span{padding-left:12px;font-size:13px;color:var(--dim)}
.lrow.lsub b{color:var(--dim)}
.lhead b{font-size:9.5px;letter-spacing:.08em;color:var(--dimmer);white-space:nowrap}
.qact .btn{margin:0}
.qrow{display:grid;grid-template-columns:54px 1fr 54px;gap:8px}
.qrow button{font-size:32px}
.qrow .bignum{margin:0;padding:12px 6px}
.qunit{text-align:center;font-family:var(--serif);font-size:10px;letter-spacing:.2em;color:var(--dimmer)}
.pct{display:grid;grid-template-columns:1fr 44px 70px 44px;align-items:center;gap:8px;padding:6px 0}
.pct button{height:42px;font-size:26px}
.pin{height:42px;padding:0 4px;text-align:center;font-family:var(--serif);font-size:18px}
.tot{margin-top:10px;text-align:center;font-family:var(--serif);font-size:12px;letter-spacing:.18em;color:var(--bronze)}
.tot.off{color:var(--red);text-shadow:0 0 8px rgba(255,64,64,.6)}
.pl{font-size:14px;color:var(--tx)}
.pl b{display:block;font-family:var(--serif);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--dimmer);margin-top:3px}
.xled .sub span{padding-left:14px;color:var(--dimmer)}
.xled .sub b{color:var(--dim)}
.calh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:12px}
.calh h3{text-align:center;margin:0}
.calh button{height:40px;font-size:22px;color:var(--bronze)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-family:var(--serif);font-size:9.5px;letter-spacing:.14em;color:var(--dimmer);padding-bottom:4px}
.cal button{aspect-ratio:1;border:1px solid transparent;border-radius:5px;font-family:var(--serif);font-size:13px; color:var(--dim);font-variant-numeric:tabular-nums}
.cal button.has{color:var(--champ);text-shadow:0 0 6px rgba(0,255,102,.6);background:var(--tint)}
.cal button.chosen{border-color:var(--bronze)}
.cal button.now{color:var(--on);background:var(--bronze);text-shadow:none;box-shadow:0 0 16px -3px var(--bronze)}
.sheet.fit.full.win{gap:16px}
.win .grade{flex-direction:column;text-align:center;gap:14px;margin:auto 0 4px}
.win .gletter{font-size:clamp(34px,11vh,54px);padding:6px 16px 10px; box-shadow:0 0 34px -6px var(--bronze),inset 0 0 18px -8px var(--bronze);animation:nowglow 2.6s ease-in-out infinite}
.win .wtitle{font-family:var(--ui);font-size:15px;letter-spacing:.02em;color:var(--bronze)}
.win .gtxt{max-width:20em;margin:8px auto 0;font-size:13px;line-height:1.6;color:var(--dim)}
.win .xled b.ok{color:var(--champ);text-shadow:0 0 8px var(--bronze)}
.win .btn{margin-top:auto !important}
.streak{font-family:var(--serif);font-size:11px;letter-spacing:.16em;color:var(--dim);text-align:center;text-transform:uppercase}
.streak b{color:var(--champ);font-weight:400}
.sheet .srow h3{font-size:17px;line-height:1.3}
@media (prefers-reduced-motion: reduce){
  .kc.zap,.sln,.win .gletter,.fi.fresh,.tune.in,.tune.out,.bolt svg,.bolt.bump svg{animation:none}
  .tune::before{display:none}
}
.sheet h3,.sheet.full h3{font-size:16px}
.rlist .ri{padding:2px 0}
.sheet.fit.full{gap:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.sheet.fit.full.scroll .pgbody{padding-top:8px}
.sheet.full .btn{padding:10px}
.fld,.srch .fld+.btn{height:32px}
.flab{margin:8px 0 3px}
.flab.fsec{margin-top:12px}
.mpick{gap:5px;margin-bottom:6px}
.mpick button{height:30px}
.rlist .rm{padding:5px 0}
.qper{line-height:1.3}
.qunit{margin:3px 0}
#wtBody .qrow button{font-size:22px}
#wtBody .qrow .bignum{padding:2px;font-size:22px}
.lrow{padding:4px 0}
.lrow span{font-size:13px}
.lrow b{font-size:12px}
.wstats{margin:4px 0 8px}
#wtBody .qrow{grid-template-columns:44px 1fr 44px}
/* Liquid Glass palettes. Label hierarchy (primary / secondary / tertiary) and the system colours
   in their light and dark variants; where a system colour is used as text and falls under 4.5:1 on
   the glass, its iOS increased-contrast variant is used instead (blue and red in Light, green and
   orange in Light). */
html[data-theme=light]{--bg:#f1f3f9;--card:rgba(255,255,255,.62);--card2:rgba(255,255,255,.5);--line:rgba(30,40,80,.12);--hair:rgba(30,40,80,.08);
  --cardline:rgba(30,40,80,.1);--cardhair:rgba(30,40,80,.07);--tx:#0a0a0f;--dim:rgba(40,40,52,.84);--dimmer:rgba(40,40,52,.74);
  --bronze:#0058c4;--pb:#0058c4;--champ:#000;--alert:#9c4600;--pb-amber:#e08600;--red:#c00013;--ok:#1f8a3a;--tint:rgba(0,98,217,.12);--tint2:rgba(0,98,217,.07);--fill:rgba(255,255,255,.55);
  --wall:radial-gradient(120% 70% at 10% 0%,rgba(122,162,255,.24),transparent 60%),radial-gradient(90% 60% at 100% 30%,rgba(186,150,255,.2),transparent 62%),
    radial-gradient(90% 55% at 0% 95%,rgba(120,210,225,.18),transparent 64%),radial-gradient(70% 45% at 100% 100%,rgba(255,186,150,.22),transparent 66%),
    linear-gradient(180deg,#f8f9fd 0%,#eff1f8 60%,#eceef6 100%);
  --mat-bar:rgba(250,251,255,.52);--mat-top:rgba(243,245,250,.985);--ib-card:#fcfdfe;--mat-sheet:rgba(250,251,255,.7);--mat-full:rgba(245,247,252,.84);--mat-pill:rgba(255,255,255,.58);--mat-toast:rgba(255,255,255,.8);--mat-sel:rgba(250,251,255,.72);
  --cell:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.58) 55%,rgba(255,255,255,.68));
  --row:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.56));
  --clear:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));
  --rim:inset 1px 1px 0 #fff,inset -1px -1px 0 rgba(255,255,255,.45),inset 0 -3px 6px -3px rgba(40,50,90,.14),inset 0 0 0 .5px rgba(30,40,80,.09);
  --rim-ctl:inset 1px 1px 0 #fff,inset 0 -2px 4px -2px rgba(40,50,90,.16),inset 0 0 0 .5px rgba(30,40,80,.12);
  --lift:0 10px 28px -12px rgba(40,52,100,.3),0 1px 2px rgba(40,52,100,.08);
  --ringg:linear-gradient(135deg,#fff,rgba(255,255,255,.35) 36%,rgba(255,255,255,0) 60%,rgba(255,255,255,.7));
  --scrim:rgba(30,40,70,.16);--grab:rgba(60,60,67,.3);--fresh:rgba(0,88,196,.16);--accent:linear-gradient(180deg,#1670e0,#0056c6);--accent-glow:rgba(0,98,217,.45)}
/* Dark (Liquid Glass dark): graphite, not navy. One soft cool light from above instead of coloured
   glows; neutral smoky glass with hairline edges instead of bright rims and lensing rings; no glow
   shadows; blue kept for what's chosen or actionable, and the one solid accent is LOG. */
html[data-theme=dark]{--bg:#07080b;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);--hair:rgba(255,255,255,.06);
  --cardline:rgba(255,255,255,.08);--cardhair:rgba(255,255,255,.06);--tx:#f4f5f7;--dim:rgba(235,236,242,.72);--dimmer:rgba(235,236,242,.58);
  --bronze:#5aabff;--pb:#409cff;--champ:#fff;--alert:#ff9f0a;--pb-amber:#ff9f0a;--red:#ff6961;--ok:#30d158;--tint:rgba(255,255,255,.08);--tint2:rgba(255,255,255,.04);--fill:rgba(255,255,255,.07);
  --wall:radial-gradient(150% 55% at 50% -12%,rgba(160,175,210,.13),transparent 62%),linear-gradient(180deg,#0c0d11 0%,#08090c 55%,#050608 100%);
  --mat-bar:rgba(12,13,17,.58);--mat-top:rgba(9,10,13,.985);--ib-card:#141518;--mat-sheet:rgba(24,25,30,.74);--mat-full:rgba(10,11,14,.88);--mat-pill:rgba(32,33,39,.6);--mat-toast:rgba(36,37,43,.84);--mat-sel:rgba(22,23,28,.8);
  --cell:rgba(255,255,255,.045);--row:rgba(255,255,255,.04);--clear:rgba(255,255,255,.075);   /* plain surfaces: glass only where it floats */
  --rim:0 0 0 transparent;--rim-ctl:0 0 0 transparent;--lift:0 0 0 transparent;
  --edge:inset 0 .5px 0 rgba(255,255,255,.14),inset 0 0 0 .5px rgba(255,255,255,.05);   /* the hairline the floating glass keeps */
  --ringg:none;--fresh:rgba(90,171,255,.24);--scrim:rgba(0,0,0,.42);--grab:rgba(255,255,255,.26);--accent:#1670e0;--accent-glow:transparent}
html.ios{--serif:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;--ui:var(--serif);--mono:var(--serif);--on:#fff}
html.ios body::before,html.ios body::after,html.ios .crt-glow,html.ios .crt-lines,html.ios .roll,html.ios .uistatic,
html.ios .sheet::before,html.ios .tune::before,html.ios .scanbox::after{display:none}
html.ios *{text-shadow:none !important;box-shadow:none !important}
html.ios.booted header,html.ios.booted #main{animation:none}
html.ios .scanbox video{filter:none}
html.ios .veil{background:rgba(0,0,0,.35)}
html.ios .veil.vstack{background:rgba(0,0,0,.2)}
html.ios .sheet{border:none;border-radius:14px 14px 0 0}
html.ios .sheet.full{border-radius:0}
html.ios .sheet:not(.out){animation:iosin .34s cubic-bezier(.2,.9,.3,1) both}
html.ios .sheet.out{animation:iosout .22s ease-in both}
html.ios .sheet.cut,html.ios .sheet.cut:not(.out){animation:none}
html.ios .sheet.swapin:not(.out),html.ios .tune.in{animation:iosfade .24s ease both}
html.ios .rtt.in{animation-delay:.35s}
html.ios .tune.out{animation:iosfade .2s ease reverse both}
@keyframes iosin{from{opacity:0;transform:translateY(36px)}}
@keyframes iosout{to{opacity:0;transform:translateY(36px)}}
@keyframes iosfade{from{opacity:0}}
html.ios .card,html.ios .srow{border:none;border-radius:12px}
html.ios .xled b{color:var(--tx)}
html.ios .fi{border-color:transparent;border-radius:10px}
html.ios .btn{background:var(--fill);border:none;border-radius:12px;color:var(--bronze);font-weight:600}
html.ios .btn.ghost{background:var(--fill);color:var(--dim)}
html.ios .btn.armed{background:rgba(255,59,48,.12)}
html.ios .btn:hover,html.ios .btn:active,html.ios .srow:hover,html.ios .srow:active{background:var(--tint);color:var(--bronze);border-color:transparent}
html.ios .fld,html.ios .bignum{background:var(--fill);border:1px solid transparent;border-radius:10px;color:var(--tx)}
html.ios .fld:focus{border-color:var(--bronze)}
html.ios .mpick button{background:var(--fill);border-color:transparent;border-radius:8px;color:var(--dim)}
html.ios .mpick button.on{background:var(--bronze);color:#fff}
html.ios .rtt{border-color:transparent;background:var(--fill);border-radius:12px}
html.ios .selbar{background:var(--card);border-top-color:var(--hair)}
html.ios .toast{background:rgba(44,44,46,.94);color:#fff;border-radius:18px}
html.ios .scanbox{border:none;border-radius:12px}
html.ios .bolt svg{filter:none;animation:none}
html.ios .bolt.bump svg{animation:iospop .45s ease-out}
@keyframes iospop{40%{transform:scale(1.35)}}
/* the dashboard header, tighter: profile and icons, then the day. Every control gets a full
   44 px row to itself, clear of the next, so a tap lands where it's aimed. */
html header.hx .eyebrow{margin:0}
html header.hx .bolt{position:static;transform:none;height:auto}
html header.hx .rtt{top:calc(env(safe-area-inset-top) + 9px);padding:6px 10px}
html header.hx .hnav{grid-template-columns:48px 1fr 48px;margin:0 8px;height:44px}
html header.hx .harr{width:48px;height:44px;font-size:22px;position:relative}
/* 163: the arrows' touch boxes reach further (up, out to the screen's edge, in towards the date) without the arrows or the bar changing size */
html header.hx .harr::before{content:'';position:absolute;top:-10px;bottom:0;left:-8px;right:-22px}
html header.hx #dNext::before{left:-22px;right:-8px}
/* 166: the weight's \u2212 value + in the day row's place, the same size and the same arrows' touch boxes */
.wadj{flex:none;position:relative;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;height:44px;box-sizing:border-box;padding:0 8px;background:var(--bg);transition:transform .2s ease}
.sheet.fit.full>.wadj{margin:0 calc(-1 * var(--gut))}
.wadj::before{content:'';position:absolute;left:0;right:0;top:-1px;border-top:1px solid var(--line);pointer-events:none}
.wadj[hidden]{display:none}
html.lg[data-theme] .wadj{background:transparent}
html.lg[data-theme] .wadj::before{border-top-color:transparent}
html.lg[data-theme] .wadj.lift{background:var(--bg)}
.wadj .harr{position:relative;width:48px;height:44px;font-size:22px}
.wadj .harr::before{content:'';position:absolute;top:-10px;bottom:0;left:-8px;right:-22px;border:0}
.wadj #wUp::before{left:-22px;right:-8px}
.wtape{position:relative;height:44px;min-width:0;overflow:hidden;touch-action:none;cursor:grab;color:var(--dimmer);user-select:none;-webkit-user-select:none;outline:none}
.wtape canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wnumc{position:absolute;left:50%;top:4px;transform:translateX(-50%);display:flex;align-items:baseline;gap:6px;pointer-events:none}
.wnumc b{font-weight:400;font-size:17px;color:var(--tx);font-variant-numeric:tabular-nums}
.wkg{font-family:var(--serif);font-size:11px;letter-spacing:.14em;color:var(--dimmer)}
html header.hx .hdate{pointer-events:none}                       /* 163: only the words take a touch (so the arrows' boxes reach in past the date's area) */
html header.hx .hdate>#hdrT,html header.hx .hdate>#hdrS{pointer-events:auto}
html header.hx .hdate{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;white-space:nowrap;overflow:hidden}
html header.hx h1{margin:0;font-size:17px;letter-spacing:0;flex:none}
html header.hx .sub{margin:0;font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis}   /* a long plan name ends in \2026; the title never moves */
html header.hx .sub::before{content:'\00b7  '}
html #main.wrap{padding-top:6px}
html #main>.dfix{position:sticky;top:var(--hh,0px);z-index:25;margin:-6px calc(-1 * var(--gut)) 0;padding:6px var(--gut) 6px;background:var(--bg)}
html #main>.dfix>.card{margin-bottom:6px}
html #main>.dfix>.card:last-child{margin-bottom:0}
html header.hx::after{display:none}
html #main>.dfix+*{margin-top:0}
/* the fixed cards, a fifth smaller so the sections get the room */
html :is(#dfix,#ib) .intake{padding:8px 12px 5px}
html :is(#dfix,#ib) .card h3{font-size:12.5px;line-height:17px}
html :is(#dfix,#ib) .kline{margin-top:4px}
html :is(#dfix,#ib) .kc{font-size:30px}
html :is(#dfix,#ib) .kof{font-size:11px;padding-bottom:2px}
html :is(#dfix,#ib) .krem .rv{font-size:16px;line-height:17px}
html :is(#dfix,#ib) .krem .rl{margin-top:2px;font-size:9.5px;line-height:12px}
html :is(#dfix,#ib) .intake>.mseg{margin:6px 0 2px;height:5px}
html :is(#dfix,#ib) .macros{margin-top:4px;padding-top:1px}
html :is(#dfix,#ib) .mac{padding:2px 0;line-height:16px}
html :is(#dfix,#ib) .mac .ml{font-size:10px}
html :is(#dfix,#ib) .mac .mv{font-size:11px}
html :is(#dfix,#ib) .mac .mseg{height:4px}
html :is(#dfix,#ib) .wcard{padding:5px 12px}
html :is(#dfix,#ib) .wline{margin:0;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;height:100%}
html :is(#dfix,#ib) .wline h3{margin:0}
html :is(#dfix,#ib) .wa span{font-size:9.5px;line-height:1.2}
html :is(#dfix,#ib) .wa b{font-size:13px;line-height:1.2}
html :is(#dfix,#ib) .wg.mini{height:26px}
html #main>.dfix .wcard,html #main>.dfix .plancard{box-sizing:border-box;height:52px}   /* weight and plan cards: one size */
html #main>.dfix .plancard{padding:0 12px;display:flex;align-items:center}
html #main>.dfix .plancard .fld.pn,html #main>.dfix .plancard .btn{height:40px}
/* Add food and every screen reached from it share one heading box, clear of the intake banner */
html body.ibon .sheet.fit.full>h3,html body.ibon .qty>h3.qt{padding-bottom:9px}
html .sheet.fit.full>h3 .shx,html .sheet.fit.full>h3 .shx.back{top:-8px;height:44px;line-height:42px}
/* feedback notes */
.fbin{min-height:96px;margin:0}
.pgbody .fbgo{margin:8px 0 12px}
.fbgo [hidden]{display:none}
.rlist .lw .ri.fbr{align-items:flex-start;gap:10px;padding:9px 12px}
.fbn{flex:none;min-width:2.2ch;font-family:var(--serif);font-size:13px;color:var(--bronze);font-variant-numeric:tabular-nums}
.fbx{flex:1;min-width:0;font-size:14px;line-height:1.4;color:var(--tx);white-space:pre-wrap;overflow-wrap:anywhere}
/* no scroll bars anywhere; lists still scroll */
html,body,*{scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none;width:0;height:0}
/* foods saved with only a name */
.nonut .rn,.nonut .fnm,.nonut .gn,.xled .nonut span,.xled .nonut b,.qty.nonut>h3.qt span{color:var(--red,#ff5a5a)}
.nonut .rs,.nonut .fsb{color:var(--red,#ff5a5a);opacity:.75}
/* the serving and its unit, in the edit screen */
.qty .qper.qsed{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px;text-align:left}
.qsvw{display:flex;align-items:center;gap:10px;width:138.9%;transform:scale(.72);transform-origin:0 50%}
.qsed .qsvi{flex:1;min-width:0;width:auto;transform:none;margin:0;text-align:left}
.qsel{position:relative;flex:none}
.qsel select{-webkit-appearance:none;appearance:none;height:26px;padding:0 22px 0 6px;border:none;border-bottom:1px dashed var(--cardline);border-radius:0;background:transparent;
  font-family:var(--serif);font-size:16px;letter-spacing:.06em;color:var(--bronze)}
.qsel select:focus{outline:none;border-bottom:1px solid var(--bronze)}
.qsel i{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-style:normal;font-size:14px;color:var(--bronze);pointer-events:none}
/* the planner's folding cards */
.pgcard.msec{margin-top:0}
.pgcard>.msh.pgfh{padding:0 0 4px;font-size:12px;letter-spacing:.02em;font-weight:500;color:var(--bronze)}
.pgcard.shut>.msh.pgfh{padding-bottom:0}
.prr{margin-top:0;border-bottom:1px solid var(--cardhair)}
.prr:last-child{border-bottom:none}
.prr>.msh.pgfh{padding:10px 2px 8px;font-family:inherit;font-size:14.5px;letter-spacing:0;text-transform:none;color:var(--tx)}
.prr>.msh .mfold{margin-left:auto}
.prr .rcv{padding:0 2px 10px}
.gi.pm{cursor:default}
.gi.pm b{font-family:var(--serif)}
/* the section heading in Add food: tap it to log somewhere else */
.secb .mfold{font-size:12px;transition:transform .3s ease}
.sheet.drop{padding:10px var(--gut) 14px}
.dropl{font-family:var(--ui);font-size:12px;letter-spacing:.02em;color:var(--dim);margin:0 0 8px}
.secpick .mpick{margin-top:0}
@media (prefers-reduced-motion: no-preference){
  html .sheet.sheet.drop:not(.out){animation:dropin .26s cubic-bezier(.2,.9,.3,1) both}
  html .sheet.sheet.drop.out{animation:dropout .18s ease-in both}
}
/* the bottom bar of a food or meal screen: the amount and the main action */
.sbar .qctl.off{display:grid}                   /* editing: the amount stays, greyed, so nothing moves */
.qact .btn.wide{width:100%;margin:0}
html .qty .qact .btn{min-height:44px}
.qty .qact{flex:none}
/* the bottom bar: planner, day, LOG, profile, settings, all under the thumb */
.bnav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:center;

<script>
/* Theme before first paint: crt (Terminal), light (iOS 27 Liquid Glass light), dark (iOS 27 Liquid
   Glass dark) or auto (follows the phone between Light and Dark). The old Liquid Glass (glass) is Dark now. */
function applyTheme(t){
  if(t==='glass') t='dark';
  if(!['crt','light','dark','auto'].includes(t)) t='auto';   // nothing chosen, or not a theme: Auto
  const r=document.documentElement, v=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
  r.dataset.theme=v; r.classList.toggle('ios',v!=='crt'); r.classList.toggle('lg',v==='light'||v==='dark');   // lg: the Liquid Glass material, Light or Dark
  document.querySelector('meta[name=theme-color]').content={crt:'#020a05',light:'#f1f3f9',dark:'#07080b'}[v]||'#07080b';
  /* An opaque status bar: the app starts below it, out of iOS 27's blur. iOS reads this once, when the
     app is added to the Home Screen, so it takes the theme in use then: light on Light, black otherwise. */
  document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content=v==='light'?'default':'black';
}
try{ applyTheme(JSON.parse(localStorage.getItem('food_log_v1')).theme||'auto'); }catch(e){ applyTheme('auto'); }   // Auto unless one was chosen
/* iOS shuts a background app down after a few minutes and reloads it on return. Coming back
   within the hour is a resume: straight to the dashboard, no power-on from black. */
try{ if(Date.now()-(+localStorage.getItem('food_log_seen')||0)<36e5) document.documentElement.classList.add('resumed'); }catch(e){}
document.documentElement.classList.add('booting');
/* The home-screen app sizes its viewport short of the glass; 100vh is the whole screen there.
   That holds only while it draws under the status bar (black-translucent, installed before 141).
   Below an opaque status bar the viewport is the screen less the bar, and 100vh would run past
   the bottom: there it's the viewport itself (tall: the first case). */
if(navigator.standalone || matchMedia('(display-mode: standalone)').matches){ const r=document.documentElement; r.classList.add('standalone');
  try{ const p=document.createElement('div'); p.style.cssText='position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
    r.appendChild(p); if(p.offsetHeight>0) r.classList.add('tall'); p.remove(); }catch(e){ r.classList.add('tall'); } }
</script>

<script>
/* =====================================================================
   Food Diary: one file, no build step. Sections, top to bottom:
     storage and the data model (clean*, blankProfile)   dates, targets, the numbers, weight
     merging (mergeProfile, unifyFoods)                  GitHub sync (gh*), shared index, feedback file
     text boxes, sound, touch, sheets, interference      dashboard (render), intake banner, sections
     week planner, groceries, plan into diary            select mode, drag to move, swipes
     weight screen, nutrition, calendar, targets hit     Add food, saved lists, spreading edits
     a food by hand (openQty), saved meals               barcodes, the Australian list, search
     settings screens                                    start-up, updates, wiring, live updates
   Data never changes shape: localStorage food_log_v1, repo files food/<profile>.json,
   food/_index.json, food/_feedback.json, food/_library.json (the shared foods, meals and plans)
   and food/_access.json (who owns each profile and who it's shared with).
   ===================================================================== */
/* ---------- storage ---------- */
const KEY='food_log_v1', APP_VERSION='2026.10.04.169';     // stamped by the build: date.build
let DB=null, STORE='local';
/* Debugging: run localStorage.setItem('food_log_debug','1') and reload. Failures that are
   otherwise handled quietly are then logged with their area: [STORE] [SYNC] [LIST] [SCAN] [OFFLINE]. */
const DEBUG=(()=>{ try{ return localStorage.getItem('food_log_debug')==='1'; }catch(e){ return false; } })();
function dbg(area,...a){ if(DEBUG) console.warn('['+area+']',...a); }
/* Activity log: food saves, what each sync changed in a saved food, the phone's clock against the

   Settings > Sync and backup > COPY LOG puts it on the clipboard to paste into a chat. */
const DIAGK='food_log_diag';
function diag(what,info){ try{ const a=JSON.parse(localStorage.getItem(DIAGK)||'[]'), d=new Date();
  a.push(d.toLocaleString('en-AU',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')+' '+what+(info===undefined?'':' '+(typeof info==='string'?info:JSON.stringify(info))));
  localStorage.setItem(DIAGK,JSON.stringify(a.slice(-400))); }catch(e){} }
const diagFood=f=>f?{id:f.id,n:f.n,b:f.b||'',sv:f.sv,k:f.k,p:f.p,c:f.c,f:f.f,bc:f.bc,e:f.e,u:f.u}:null;
addEventListener('error',ev=>diag('ERROR',(ev.message||'')+' @'+(ev.lineno||'')+':'+(ev.colno||'')+' '+String(ev.error&&ev.error.stack||'').slice(0,400)));
addEventListener('unhandledrejection',ev=>diag('ERROR (async)',String(ev.reason&&(ev.reason.stack||ev.reason.message)||ev.reason).slice(0,400)));
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const DEF_GOAL={k:2200,mode:'p',pp:30,cp:40,fp:30,pg:165,cg:220,fg:73};
const DEF_MEALS=[{id:'b',n:'Breakfast'},{id:'l',n:'Lunch'},{id:'d',n:'Dinner'},{id:'s',n:'Snacks'}];
/* Detail nutrients: key, label, short label, unit, Open Food Facts field, multiplier from OFF units. */
const XN=[['su','Sugars','Sugars','g','sugars',1],['fi','Fibre','Fibre','g','fiber',1],
  ['sf','Saturated fat','Sat. fat','g','saturated-fat',1],['tf','Trans fat','Trans fat','g','trans-fat',1],
  ['pf','Polyunsaturated fat','Poly fat','g','polyunsaturated-fat',1],['mf','Monounsaturated fat','Mono fat','g','monounsaturated-fat',1],
  ['na','Sodium','Sodium','mg','sodium',1000],['ch','Cholesterol','Cholesterol','mg','cholesterol',1000]];

function num(v,lo,hi){ const n=+v; return Number.isFinite(n)&&n>=lo&&n<=hi?n:null; }
const orD=(v,d)=>v===null?d:v;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r1=v=>Math.round((+v||0)*10)/10;
/* Nutrition is kept per serving to 3 decimals, and only shown to 1. Kept to 1, a small serving
   couldn't hold what's typed per 100 g: 7.5 g protein per 100 g is 1.05 g in a 14 g piece, which at
   one decimal became 1.1 g, and read back per 100 g as 7.9. */
const r3=v=>Math.round((+v||0)*1000)/1000;
const fmt=v=>Math.round(+v||0).toLocaleString('en-AU');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Profile and section names stay short and plain: profiles become file names and sections sit
   on small buttons. Food and meal names can be long and carry any punctuation. */
const cleanName=n=>String(n||'').replace(/[^\w .'-]/g,'').replace(/\s+/g,' ').trim().replace(/^_+/,'').slice(0,24);
const cleanLabel=n=>String(n||'').replace(/\s+/g,' ').trim().slice(0,80);

function blankProfile(){
  return {goal:Object.assign({},DEF_GOAL), meals:DEF_MEALS.map(m=>Object.assign({},m)),
          foods:[], combos:[], days:{}, hit:{}, del:{}, wt:{}, rh:{}, plan:blankPlan(), plans:[], gt:{}, gw:{p:[], t:0}, gl:{}, at:0, ge:0, me:0, pe:0, pid:''};   // gl: targets by the day they began
}
function cleanX(x){
  const o={};
  if(x && typeof x==='object') XN.forEach(([k])=>{ const v=num(x[k],0,100000); if(v) o[k]=r3(v); });
  return o;
}
/* Hand changes to a saved meal's meal times: section id -> 1 added, 0 taken off. */
function cleanSc(x){ const o={};
  if(x && typeof x==='object') Object.keys(x).slice(0,12).forEach(k=>{ if(x[k]===0 || x[k]===1) o[String(k).slice(0,24)]=x[k]; });
  return Object.keys(o).length?{sc:o}:{}; }
function cleanFood(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n); if(!n) return null;
  return {id:String(x.id||uid()).slice(0,24), n, sv:String(x.sv||'').trim().slice(0,40)||'1 serving',
    k:orD(num(x.k,0,9000),0), p:orD(num(x.p,0,900),0), c:orD(num(x.c,0,1500),0), f:orD(num(x.f,0,900),0),
    x:cleanX(x.x), bc:x.bc?String(x.bc).replace(/\D/g,'').slice(0,20):'',
    u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0), ...(x.o?{o:String(x.o).slice(0,160)}:{}),   // o: the list food it was edited from
    ...(x.b && String(x.b).trim()?{b:String(x.b).replace(/\s+/g,' ').trim().slice(0,40)}:{}),   // b: the brand, beside the serving
    ...(x.vf?{vf:orD(num(x.vf,0,1e13),0)}:{}),                                   // vf: when you last saved it yourself (verified)
    ...(Array.isArray(x.ob)&&x.ob.length?{ob:[...new Set(x.ob.map(b=>String(b).replace(/\D/g,'').slice(0,20)).filter(Boolean))].slice(0,20)}:{})};   // ob: barcodes it had before
}
/* Saved with just a name: nothing to count yet. Shown in red until it has some. */
const noNut=f=>!!f && !(f.k>0||f.p>0||f.c>0||f.f>0) && !Object.values(f.x||{}).some(v=>v>0);
const place=e=>e.o||e.t;                            // where an entry sits in its day
function cleanEntry(x){
  const f=cleanFood(x); if(!f) return null;
  return {id:f.id, fid:x.fid?String(x.fid).slice(0,24):'', n:f.n, ...(f.b?{b:f.b}:{}), sv:f.sv, k:f.k, p:f.p, c:f.c, f:f.f, x:f.x,
    q:orD(num(x.q,0.001,5000),1), w:['s','h','g'].includes(x.w)?x.w:'g', m:String(typeof x.m==='number'?'blds'[x.m]||'s':x.m||'s').slice(0,24),
    t:orD(num(x.t,0,1e13),0), e:orD(num(x.e,0,1e13),0),
    ...(x.g?{g:String(x.g).slice(0,24), gn:cleanLabel(x.gn)||'Combined'}:{}),   // logged as one combined item
    ...(num(x.o,1,1e13)?{o:num(x.o,1,1e13)}:{})};                               // its place in the day, once dragged
}
/* A saved meal: a name and the foods in it, each a full snapshot with its amount. */
/* mt: the saved meal's meal time, one section id. */
function cleanCombo(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n), items=(Array.isArray(x.items)?x.items:[]).map(cleanEntry).filter(Boolean).slice(0,30)
    .map(e=>({fid:e.fid, n:e.n, ...(e.b?{b:e.b}:{}), sv:e.sv, k:e.k, p:e.p, c:e.c, f:e.f, x:e.x, q:e.q, w:e.w}));
  if(!n || !items.length) return null;
  const rc=String(x.rc||'').replace(/\r/g,'').slice(0,6000);
  return {id:String(x.id||uid()).slice(0,24), n, items, u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0), ...(rc.trim()?{rc}:{}), ...(x.mt?{mt:String(x.mt).slice(0,24)}:{}), ...cleanSc(x.sc)};   // sc: meal times from before 107
}
function cleanGoal(g){
  g=g||{};
  const o={k:orD(num(g.k,500,10000),DEF_GOAL.k), mode:g.mode==='g'?'g':'p'};
  ['pp','cp','fp'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,100),DEF_GOAL[k]); });
  ['pg','cg','fg'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,1500),DEF_GOAL[k]); });
  if(o.pp+o.cp+o.fp>100) Object.assign(o,{pp:DEF_GOAL.pp,cp:DEF_GOAL.cp,fp:DEF_GOAL.fp});
  return o;
}
/* The week plan: a day of eating laid out like the dashboard, made up to 'portions' times (10 by
   default: 5 each), with its groceries' ticks. n and sid: the saved plan it was loaded as. */
const blankPlan=()=>({n:'', sid:'', portions:10, items:[]});
function cleanPlan(x,combos){
  x=x&&typeof x==='object'?x:{};
  const o=blankPlan();
  o.n=cleanLabel(x.n); o.sid=String(x.sid||'').slice(0,24); o.portions=orD(num(Math.round(x.portions),1,200),10);
  if(Array.isArray(x.items)) o.items=x.items.map(cleanEntry).filter(Boolean).slice(0,120);
  else if(Array.isArray(x.rows)){                       // the earlier planner: saved meals per section, each with portions
    const now=Date.now();
    x.rows.forEach((r,ri)=>{ const cb=(combos||[]).find(c=>c.id===r.c); if(!cb) return; const g=uid();
      cb.items.forEach((e,i)=>o.items.push(cleanEntry(Object.assign({},e,{id:uid()+ri+i, m:r.m, t:now+ri*50+i, e:now, g, gn:cb.n}))));
      o.portions=orD(num(Math.round(r.n),1,200),o.portions); });
    o.items=o.items.filter(Boolean);
  }
  return o;
}
/* A saved plan, kept to reuse: merged like saved meals, the later edit wins. */
function cleanSavedPlan(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n); if(!n) return null;
  return {id:String(x.id||uid()).slice(0,24), n, portions:orD(num(Math.round(x.portions),1,200),10),
    items:(Array.isArray(x.items)?x.items:[]).map(cleanEntry).filter(Boolean).slice(0,120), u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
const GL0='1970-01-01';                             // the first targets, for every day before any change
function cleanProfile(p){
  const o=blankProfile();
  if(!p || typeof p!=='object') return o;
  o.goal=cleanGoal(p.goal);
  /* The targets over time: {day they began: {g, e}}. Kept from before this record existed: one entry
     from the start of time with the targets as they are, so no day already logged changes. */
  if(p.gl && typeof p.gl==='object') Object.entries(p.gl).slice(-400).forEach(([d,v])=>{ if((DATE_RE.test(d)||d===GL0) && v && v.g) o.gl[d]={g:cleanGoal(v.g), e:orD(num(v.e,0,1e13),0)}; });
  if(!Object.keys(o.gl).length) o.gl[GL0]={g:Object.assign({},o.goal), e:0};   // e 0: any real record, from either phone, wins over it
  if(Array.isArray(p.meals)){
    const ms=p.meals.map(m=>({id:String(m&&m.id||'').slice(0,24), n:String(m&&m.n||'').trim().slice(0,24)}))
      .filter(m=>m.id&&m.n);
    if(ms.length) o.meals=ms.slice(0,6);
  }
  o.foods=(Array.isArray(p.foods)?p.foods:[]).map(cleanFood).filter(Boolean);
  o.combos=(Array.isArray(p.combos)?p.combos:[]).map(cleanCombo).filter(Boolean);
  o.plan=cleanPlan(p.plan,o.combos);
  Object.keys(p.days||{}).sort().forEach(d=>{
    if(!DATE_RE.test(d) || !Array.isArray(p.days[d])) return;
    const v=p.days[d].map(cleanEntry).filter(Boolean);
    if(v.length) o.days[d]=v;
  });
  Object.keys(p.hit||{}).sort().forEach(d=>{ const h=p.hit[d]; if(DATE_RE.test(d)&&h) o.hit[d]={k:!!h.k,p:!!h.p}; });
  Object.keys(p.wt||{}).sort().forEach(d=>{ const w=p.wt[d], v=w&&num(w.v,0,500), t=w&&num(w.e,1,1e13);
    if(DATE_RE.test(d) && v!==null && t) o.wt[d]={v:r1(v),e:t}; });                    // v 0: removed, kept so phones agree
  Object.keys(p.rh||{}).forEach(k=>{ const t=num(p.rh[k],1,1e13); if(k.length<=120 && t) o.rh[k]=t; });   // hidden from Recent, until logged again
  Object.keys(p.del||{}).sort().forEach(id=>{ const t=num(p.del[id],1,1e13); if(t) o.del[id]=t; });
  ['at','ge','me','pe'].forEach(k=>{ o[k]=orD(num(p[k],0,1e13),0); });
  o.plans=(Array.isArray(p.plans)?p.plans:[]).map(cleanSavedPlan).filter(Boolean).slice(0,60);
  /* Grocery ticks: item key -> [ticked 1 or 0, when]. Kept apart from the plan and merged item by
     item, so ticking on one phone never overwrites a plan being changed on another. */
  const old=Date.now()-120*864e5;
  Object.keys(p.gt||{}).forEach(k=>{ const v=p.gt[k], t=Array.isArray(v)&&num(v[1],1,1e13); if(k.length<=160 && t && t>old) o.gt[k]=[v[0]?1:0,t]; });
  /* Whose groceries combine with this profile's: their pids, and when that last changed. Kept apart
     from the plan (like the ticks) so linking two people never overwrites either one's plan. */
  const gw=p.gw && Array.isArray(p.gw.p)?p.gw:{p:(p.plan && Array.isArray(p.plan.with))?p.plan.with:[], t:1};   // earlier builds kept it in the plan
  o.gw={p:gw.p.map(s=>String(s||'').slice(0,24)).filter(Boolean).slice(0,6), t:orD(num(gw.t,0,1e13),0)};
  if(!p.gt && p.plan && p.plan.tick) Object.keys(p.plan.tick).forEach(k=>{ if(k.length<=160 && p.plan.tick[k]) o.gt[k]=[1,Date.now()]; });   // from the earlier planner
  o.pid=String(p.pid||'').slice(0,24);
  return o;
}
/* The last time planned food was put into the diary, kept on this phone so it can be undone:
   which profile, when, and the entries it added on each day. Up to 7 days. */
function cleanFill(f){
  if(!f || typeof f!=='object' || !(num(f.t,1,1e13)>Date.now()-7*864e5)) return null;
  const days={}; Object.keys(f.days||{}).forEach(d=>{ if(DATE_RE.test(d) && Array.isArray(f.days[d])) days[d]=f.days[d].map(String).slice(0,200); });
  return Object.keys(days).length?{who:String(f.who||''), t:f.t, days, ...(f.pc?{pc:1}:{})}:null;   // pc: its plan was cleared since
}
/* Feedback notes: text of any length, when added (t) and last changed (e). A deleted note is
   kept as a bare tombstone (d) for 120 days, so the other phone deletes it too. */
function cleanFb(a){
  const cut=Date.now()-120*864e5;
  return (Array.isArray(a)?a:[]).filter(x=>x && typeof x==='object' && (x.d?num(x.e,cut,1e13):typeof x.x==='string' && x.x.trim()))
    .map(x=>{ const t=num(x.t,0,1e13)||0, e=num(x.e,0,1e13)||t, id=String(x.id||uid()).slice(0,24);
      return x.d?{id,t,e,d:1}:{id,x:x.x,t,e}; });
}
function mergeFb(a,b){                                 // per note, the later change wins
  const m={}; cleanFb(b).concat(cleanFb(a)).forEach(x=>{ const o=m[x.id]; if(!o || x.e>=o.e) m[x.id]=x; });
  return Object.values(m).sort((x,y)=>x.t-y.t || (x.id<y.id?-1:1));
}
const fbLive=()=>DB.fb.filter(f=>!f.d);
function cleanDB(d){
  d=d&&typeof d==='object'?d:{};
  const obj=v=>v&&typeof v==='object'?v:{};
  const out={profiles:{}, cur:String(d.cur||''), gh:obj(d.gh), fold:obj(d.fold), sfx:d.sfx!==false, idx:cleanIdx(d.idx),
    theme:d.theme==='glass'?'dark':['crt','light','dark','auto'].includes(d.theme)?d.theme:'auto', fill:cleanFill(d.fill),   // the old Liquid Glass is Dark
    fb:cleanFb(d.fb),                                                    // feedback notes, any length
    dev:String(d.dev||'').replace(/[^\w]/g,'').slice(0,24)||uid(),      // this phone, made once: what owning a profile means
    acc:cleanAcc(d.acc), lib:cleanLib(d.lib)};                           // who owns and sees each profile; the shared library
  Object.keys(d.profiles||{}).forEach(n=>{ const nm=cleanName(n); if(nm) out.profiles[nm]=cleanProfile(d.profiles[n]); });
  if(!Object.keys(out.profiles).length) out.profiles.Me=blankProfile();
  Object.values(out.profiles).forEach(p=>{ if(!p.pid) p.pid=uid(); });     // a profile's identity, whatever it is called
  if(!out.profiles[out.cur]) out.cur=Object.keys(out.profiles)[0];
  return out;
}
/* The library: the shared foods, meals and plans, with their deletions, in their own file
   (food/_library.json), so they still reach every phone when profiles are hidden from each other.
   Kept profile-shaped, so it merges like a profile and unifyFoods keeps it the same as the rest. */
const cleanLib=x=>{ x=x&&typeof x==='object'?x:{}; return cleanProfile({foods:x.foods, combos:x.combos, plans:x.plans, del:x.del}); };
const libOut=l=>({foods:l.foods, combos:l.combos, plans:l.plans, del:l.del});       // what its file holds
const libHas=l=>!!(l.foods.length || l.combos.length || l.plans.length || Object.keys(l.del).length);
const allP=()=>Object.values(DB.profiles).concat(DB.lib?[DB.lib]:[]);           // every holder of the shared lists
/* Foods, meals and saved plans are one set for everyone: every profile holds the same arrays,
   so anything made or changed in one is the same in all (husband and wife prep together). The
   same thing twice (a food by name and serving, a meal or plan by name) becomes one, the latest
   edit, and whatever pointed at the other points at it. Each profile keeps its own diary, plan
   on screen, targets and sections. */
/* An edit's time: now, or just after the latest copy of the thing anywhere on this phone, whichever
   is later. A phone whose clock ran ahead leaves copies stamped in the future; without this an edit
   made here would lose to them at the next sync and quietly revert. */
const later=(...ts)=>Math.max(Date.now(),...ts.map(t=>(+t||0)+1));
const allE=(k,id)=>allP().flatMap(p=>(p[k]||[]).filter(x=>x.id===id).map(x=>x.e).concat(p.del[id]||0));
const SHARED=[['foods',f=>sameFood(f)],['combos',c=>c.n.trim().toLowerCase()],['plans',x=>x.n.trim().toLowerCase()]];
function unifyFoods(){
  const ps=allP(); if(!ps.length) return;
  const del={}; ps.forEach(p=>Object.keys(p.del).forEach(id=>{ del[id]=Math.max(del[id]||0,p.del[id]); }));
  const remap={}, byId={}, lists={};
  SHARED.forEach(([k,key])=>{
    const m={}; ps.forEach(p=>p[k].forEach(x=>{ const y=m[x.id]; if(!y || x.e>y.e || (x.e===y.e && x.u>y.u)) m[x.id]=x; }));
    Object.assign(byId,m);
    const keep={};
    Object.values(m).filter(x=>!(del[x.id]>=x.e)).sort((x,y)=>(y.e-x.e)||(y.u-x.u)||(x.id<y.id?-1:1))
      .forEach(x=>{ const kk=key(x); if(keep[kk]) remap[x.id]=keep[kk].id; else keep[kk]=x; });
    lists[k]=Object.values(keep).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  });
  ps.forEach(p=>{
    Object.keys(del).forEach(id=>{ if(byId[id] && !(p.del[id]>=del[id])) p.del[id]=del[id]; });   // deleted anywhere, deleted everywhere
    if(Object.keys(remap).length){
      Object.keys(remap).forEach(id=>{ p.del[id]=later(p.del[id],byId[id]&&byId[id].e); });
      const fix=e=>{ if(remap[e.fid]){ e.fid=remap[e.fid]; followFood(e,byId[e.fid]); if(e.e!==undefined) e.e=later(e.e); } };   // and takes its nutrition
      Object.values(p.days).forEach(es=>es.forEach(fix));
      p.plan.items.forEach(fix);
      if(remap[p.plan.sid]) p.plan.sid=remap[p.plan.sid];
    }
    SHARED.forEach(([k])=>{ p[k]=lists[k]; });
    if(Object.keys(remap).length){ p.combos.forEach(c=>c.items.forEach(e=>{ if(remap[e.fid]){ e.fid=remap[e.fid]; followFood(e,byId[e.fid]); } }));
      p.plans.forEach(x=>x.items.forEach(e=>{ if(remap[e.fid]){ e.fid=remap[e.fid]; followFood(e,byId[e.fid]); } })); }
  });
  /* A saved food's edit is the most correct version of it: every entry, planned food and meal
     ingredient linked to it carries its name, serving and nutrition (keeping its weight). So a
     food logged on the other phone from an older copy comes into line once the edit arrives. */
  const F={}; lists.foods.forEach(f=>{ F[f.id]=f; });
  const byName={}; lists.foods.forEach(f=>{ (byName[normS(fullName(f))]=byName[normS(fullName(f))]||[]).push(f); });

const sameVals=(e,f)=>e.n===f.n && (e.b||'')===(f.b||'') && e.sv===f.sv && e.k===f.k && e.p===f.p && e.c===f.c && e.f===f.f && JSON.stringify(e.x||{})===JSON.stringify(f.x||{});
function load(){

const P=()=>DB.profiles[DB.cur];

/* ---------- dates: local calendar days, never UTC ---------- */
function ymd(d){ d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today=()=>ymd();
function dObj(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function shift(s,n){ const t=dObj(s); t.setDate(t.getDate()+n); return ymd(t); }
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate=s=>{ const d=dObj(s); return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const shortDay=s=>{ const d=dObj(s); return (WD[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)).toUpperCase(); };

/* The day row's two lines for a day: its name, then the date and how long logging has run. */
function dayLabel(d){ const o=dObj(d); return [dayName(d), WD[o.getDay()].slice(0,3)+' '+o.getDate()+' '+MON[o.getMonth()].slice(0,3)]; }
let DAY=today(), FOLLOW=true;          // FOLLOW: roll over to the new day at midnight

/* ---------- targets: calories, plus macros as a share of them or in grams ---------- */
/* The targets a day had: the latest change on or before it. */
function goalOn(d,p){ p=p||P(); const gl=p.gl||{}, ks=Object.keys(gl).sort(); if(!ks.length) return p.goal;
  let k=ks[0]; ks.forEach(x=>{ if(x<=d) k=x; }); return gl[k].g; }
const dayGoal=()=>goalOn(PLAN?today():DAY);           // the day on screen (the planner looks ahead from today)
function targets(g){ g=g||P().goal;
  return g.mode==='g' ? {k:g.k, p:g.pg, c:g.cg, f:g.fg}
    : {k:g.k, p:Math.round(g.k*g.pp/400), c:Math.round(g.k*g.cp/400), f:Math.round(g.k*g.fp/900)}; }
function shares(g){ g=g||P().goal;
  if(g.mode!=='g') return {pp:g.pp, cp:g.cp, fp:g.fp};
  const s=v=>Math.round(v/g.k*100);

/* The calories' colour, the same on the card and the banner: green once on target, orange from

const kState=(v,g)=>v>=g+50?'over':v>=g?'hit':'';
function targetStatus(t,g){
  const ks=kState(t.k,g.k);                            // the same rule as the colours: from the target itself, up to 49 over
  return {kHit:ks==='hit', pHit:g.p>0 && t.p>=g.p, over:ks==='over'};

/* ---------- the numbers ---------- */
let PLAN=false;                                      // the dashboard is showing the week plan
const entries=d=>d?P().days[d]||[]:PLAN?P().plan.items:P().days[DAY]||[];
/* P, C, F and calories of a list of entries, each at its amount, times q servings. */
const macroSum=(es,q=1)=>es.reduce((a,e)=>{ a.k+=e.k*e.q*q; a.p+=e.p*e.q*q; a.c+=e.c*e.q*q; a.f+=e.f*e.q*q; return a; },{k:0,p:0,c:0,f:0});
const macroTxt=t=>'P'+Math.round(t.p)+' C'+Math.round(t.c)+' F'+Math.round(t.f);
function zero(){ const t={k:0,p:0,c:0,f:0}; XN.forEach(([k])=>t[k]=0); return t; }
function totals(d){
  const t=zero();
  entries(d).forEach(e=>{ t.k+=e.k*e.q; t.p+=e.p*e.q; t.c+=e.c*e.q; t.f+=e.f*e.q;
    XN.forEach(([k])=>{ if(e.x[k]) t[k]+=e.x[k]*e.q; }); });

}
/* Average over the logged days in the n days ending on d. */
function average(d,n){
  const t=zero(); let c=0;
  for(let i=0;i<n;i++){ const s=shift(d,-i); if(!entries(s).length) continue; c++;
    const x=totals(s); Object.keys(t).forEach(k=>t[k]+=x[k]); }

function onTarget(d){ const s=targetStatus(totals(d),targets(goalOn(d))); return s.kHit&&s.pHit; }
/* Consecutive days with anything logged, ending today. An unlogged today does not break

function logStreak(){

function streak(d){ let n=0; while(n<400 && onTarget(d)){ n++; d=shift(d,-1); } return n; }
/* ---------- weight: one reading a day ---------- */
const wOf=d=>{ const w=P().wt[d]; return w && w.v>0 ? w.v : null; };

/* The weight nearest a day: the latest on or before it, else the first after it. */
function wNear(d){
  const before=wLast(d); if(before) return wOf(before);
  const after=Object.keys(P().wt).sort().find(x=>x>d && wOf(x)); return after?wOf(after):null;
}
/* Serving units. A weight or volume typed anywhere in the serving counts first ("1 slice (38 g)");
   otherwise spoons and cups are Australian measures, in ml: 5, 20 and 250. */
const SVU=[['g','g'],['ml','ml'],['tsp','tsp',5],['tbsp','tbsp',20],['cup','cup',250,'cups'],['serving','serving',0,'servings'],
  ['slice','slice',0,'slices'],['piece','piece',0,'pieces'],['scoop','scoop',0,'scoops']];
const SVA={g:'g',gm:'g',gms:'g',gr:'g',gram:'g',grams:'g',gramme:'g',grammes:'g',ml:'ml',millilitre:'ml',millilitres:'ml',milliliter:'ml',milliliters:'ml',
  tsp:'tsp',tsps:'tsp',teaspoon:'tsp',teaspoons:'tsp',tbsp:'tbsp',tbsps:'tbsp',tbs:'tbsp',tbl:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',
  cup:'cup',cups:'cup',serve:'serving',serves:'serving',serving:'serving',servings:'serving',slice:'slice',slices:'slice',
  piece:'piece',pieces:'piece',pc:'piece',pcs:'piece',scoop:'scoop',scoops:'scoop'};
const FRAC={'\u00bd':.5,'\u00bc':.25,'\u00be':.75,'\u2153':1/3,'\u2154':2/3};
/* The serving as typed: its amount, its unit (one of SVU, or '' for anything else) and the rest. */
function parseSv(t){
  t=String(t||''); const m=t.match(/^\s*(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[\u00bd\u00bc\u00be\u2153\u2154])?\s*([A-Za-z]+)?(.*)$/);

  const u=m[2]&&SVA[m[2].toLowerCase()];
  if(u) return {a, v:v||(a?0:1), u, rest:m[3]};
  if(a && !m[2] && !m[3].trim()) return {a, v, u:'g', rest:''};    // a bare number is grams
  return {a, v, u:'', rest:(m[2]||'')+m[3]};

/* Amount, unit and the rest, written once: "1tsp" is "1 tsp", "2 cup" is "2 cups". */
function svCompose(p,u){
  if(!u) return ((p.a?p.a+' ':'')+p.rest).trim();
  const d=SVU.find(x=>x[0]===u), amt=p.a||'1', many=(p.v||1)>1;

  if(n>0) return {n,u:m[2].toLowerCase()};
  const p=parseSv(sv), d=p.u && SVU.find(x=>x[0]===p.u);

}
/* The amount as a total weight whenever the serving has one (1.5 x 75 g shows as 112.5 g);
   otherwise the servings. */
function qtyTxt(e){
  const g=gramsOf(e.sv);
  if(Math.abs(e.q-1)<1e-6) return e.sv;               // exactly one serving: the serving as written, e.g. 25 g (1 packet)
  return g ? r1(e.q*g.n)+' '+g.u : r1(e.q)+' \u00d7 '+e.sv;

/* ---------- merging ----------
   Object by object: the later edit wins, and anything deleted after its last edit
   stays deleted. Targets and sections each follow whichever copy changed them last. */
function mergeProfile(a,b){
  const o=blankProfile(), newer=a.at>=b.at?a:b, by=k=>a[k]!==b[k]?(a[k]>b[k]?a:b):newer;
  o.goal=Object.assign({},by('ge').goal);
  [b.gl||{},a.gl||{}].forEach(m=>Object.entries(m).forEach(([d,v])=>{ const y=o.gl[d]; if(!y || v.e>y.e) o.gl[d]={g:Object.assign({},v.g), e:v.e}; }));   // each day's targets: the later edit
  o.meals=by('me').meals.map(m=>Object.assign({},m));
  o.plan=cleanPlan(by('pe').plan);                    // the plan on screen follows whichever phone changed it last
  o.ge=Math.max(a.ge,b.ge); o.me=Math.max(a.me,b.me); o.pe=Math.max(a.pe,b.pe);
  o.gw=(b.gw.t>a.gw.t?b:a).gw;                          // who's combined: the later change
  Object.keys(Object.assign({},a.gt,b.gt)).forEach(k=>{ const x=a.gt[k], y=b.gt[k]; o.gt[k]=!x?y:!y?x:(y[1]>x[1]?y:x); });   // each tick: the later change
  o.pid=a.pid&&b.pid?(a.pid<b.pid?a.pid:b.pid):a.pid||b.pid;         // copies of one profile settle on one identity
  const cut=Date.now()-120*864e5;
  [a.del,b.del].forEach(d=>Object.keys(d).forEach(id=>{ if(d[id]>cut) o.del[id]=Math.max(o.del[id]||0,d[id]); }));
  const gone=x=>o.del[x.id]>=x.e;
  const pick=(m,x)=>{ const y=m[x.id]; if(!y || x.e>y.e || (x.e===y.e && x.u>y.u)) m[x.id]=x; };
  SHARED.forEach(([k])=>{ const m={}; b[k].concat(a[k]).forEach(x=>pick(m,x));      // foods, meals, saved plans
    o[k]=Object.values(m).filter(x=>!gone(x)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1)); });
  const days={};
  [a,b].forEach(p=>Object.keys(p.days).forEach(d=>{ days[d]=days[d]||{}; p.days[d].forEach(e=>pick(days[d],e)); }));   // a tie keeps this phone's
  Object.keys(days).forEach(d=>{
    const v=Object.values(days[d]).filter(e=>!gone(e)).sort((x,y)=>place(x)-place(y) || (x.id<y.id?-1:1));
    if(v.length) o.days[d]=v;
  });
  Object.keys(Object.assign({},a.hit,b.hit)).forEach(d=>{
    const x=a.hit[d]||{}, y=b.hit[d]||{}; o.hit[d]={k:!!(x.k||y.k), p:!!(x.p||y.p)};
  });
  Object.keys(Object.assign({},a.rh,b.rh)).forEach(k=>{ o.rh[k]=Math.max(a.rh[k]||0,b.rh[k]||0); });
  Object.keys(Object.assign({},a.wt,b.wt)).forEach(d=>{ const x=a.wt[d], y=b.wt[d]; o.wt[d]=!x?y:!y?x:y.e>x.e?y:x; });
  o.at=Math.max(a.at,b.at);
  return cleanProfile(o);
}

/* ---------- GitHub: one file per profile, food/<name>.json, in a private repo ----------
   The training log shares the repo and keeps its own training/ folder.
   A sync reads, merges and writes only if the result differs from what is there. */
const DIR='food';
function ghCfg(){ const g=DB.gh; return {tok:g.tok||'', repo:g.repo||'', branch:g.branch||'main', at:g.at||0, err:g.err||'', moved:g.moved||0,
  live:[0,5,15,30].includes(g.live)?g.live:5}; }
function ghSave(patch){ DB.gh=Object.assign(ghCfg(),patch); save(); }
function ghOn(){ const c=ghCfg(); return !!(c.tok && /^[\w.-]+\/[\w.-]+$/.test(c.repo)); }
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghReq(path,opt){
  opt=opt||{};
  return fetch('https://api.github.com'+path,Object.assign({},opt,{cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+ghCfg().tok, Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'},opt.headers)}));
}
const ghUrl=n=>'/repos/'+ghCfg().repo+'/contents/'+DIR+'/'+encodeURIComponent(n)+'.json';
/* Has this profile's file changed since we last looked? A conditional request: "unchanged"
   (304) is tiny and doesn't count against GitHub's hourly limit. Answers the file's new tag,
   '' when it can't tell, or null when it's unchanged or unreachable. */
const LIVE={etag:{}, t:0, busy:false};
async function ghPeek(name){
  try{
    const r=await ghReq(ghUrl(name)+'?ref='+encodeURIComponent(ghCfg().branch),{headers:LIVE.etag[name]?{'If-None-Match':LIVE.etag[name]}:{}});
    if(r.status===304 || !r.ok) return null;
    return r.headers.get('ETag')||'';
  }catch(e){ dbg('SYNC','peek',name,e); return null; }
}
async function ghGet(name){
  const q='?ref='+encodeURIComponent(ghCfg().branch);
  const r=await ghReq(ghUrl(name)+q);
  if(r.status===404) return {sha:'',prof:null};
  if(!r.ok) throw r.status;
  const j=await r.json();
  let txt=j.content?unb64(j.content):'';
  if(!txt){                                      // over 1 MB: fetch the raw file instead
    const r2=await ghReq(ghUrl(name)+q,{headers:{Accept:'application/vnd.github.raw'}});
    if(!r2.ok) throw r2.status;
    txt=await r2.text();
  }
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  return {sha:j.sha, prof:d&&d.profile?cleanProfile(d.profile):null};
}
const ghPut=(name,prof,sha)=>ghReq(ghUrl(name),{method:'PUT',body:JSON.stringify({
  message:'log: '+name+' '+today(), branch:ghCfg().branch, sha:sha||undefined,
  content:b64(JSON.stringify({v:1,name,profile:prof}))})});
let GHT=0, GHBUSY=false; const GHPEND=new Set();   // profiles waiting for the sync running now
const LIBN='_library';                               // the library's file name, synced like a profile
const LIBSEEN={j:''};                                // the library as its file last held it
const libKey=l=>JSON.stringify(libOut(l),(k,v)=>k==='u'?undefined:v);   // when each was last used needs no write of its own
const libDirty=()=>libKey(DB.lib)!==LIBSEEN.j;
/* What this phone keeps of a profile: everything, or without the weight when only the diary is shared. */
const viewOf=p=>lvlOf(p.pid)===1?Object.assign({},p,{wt:{}}):p;
function ghQueue(){ if(!ghOn()) return; clearTimeout(GHT); GHT=setTimeout(()=>{ GHT=0; ghSync(DB.cur); },1500); }
function ghFlush(){ if(GHT){ clearTimeout(GHT); GHT=0; ghSync(DB.cur); } }
const ghMsg=e=>e===401?'bad token':e===403?'token cannot write here':e===404?'repo not found':typeof e==='number'?'error '+e:'offline';
async function ghSync(name){
  if(!ghOn()) return 'off';
  if(!ghCfg().moved) return ghSyncAll();              // the move to food/ comes before anything is written
  if(GHBUSY){ GHPEND.add(name); return 'busy'; }
  GHBUSY=true;
  const lib=name===LIBN;
  try{
    for(let i=0;i<3;i++){
      const rem=await ghGet(name), local=lib?DB.lib:DB.profiles[name];
      if(!local || (!rem.prof && !(lib?libHas(local):local.at))){ if(lib) LIBSEEN.j=libKey(local); break; }   // never used: nothing worth uploading
      if(!lib && !lvlOf((rem.prof && rem.prof.pid) || local.pid)){ if(await ghHide(name,local,rem)) break; continue; }   // no longer shared with this phone
      const before=JSON.stringify(local);
      const was={}; local.foods.forEach(f=>{ was[f.id]=f; });
      const full=rem.prof?mergeProfile(local,rem.prof):cleanProfile(local);
      if(lib) DB.lib=full; else DB.profiles[name]=full;
      unifyFoods();                                          // the shared foods, before it's written back
      try{ const rf={}, key=f=>f?[f.n,f.sv,f.k,f.p,f.c,f.f,f.bc,JSON.stringify(f.x)].join('|'):''; (rem.prof?rem.prof.foods:[]).forEach(f=>{ rf[f.id]=f; });
        const now={}; full.foods.forEach(f=>{ now[f.id]=f; });
        Object.keys(Object.assign({},was,now)).forEach(id=>{ if(key(was[id])!==key(now[id])) diag('sync '+name+' changed a food',{before:diagFood(was[id]),after:diagFood(now[id]),repo:diagFood(rf[id]),del:full.del[id]||0}); });
      }catch(e){ diag('ERROR (sync log)',String(e)); }
      const out=lib?libOut(full):full, mj=JSON.stringify(out);   // what the file holds
      if(!lib) DB.profiles[name]=viewOf(full);               // what this phone keeps
      if(JSON.stringify(lib?DB.lib:DB.profiles[name])!==before){ save(); render(); }
      if(rem.prof && mj===JSON.stringify(lib?libOut(rem.prof):rem.prof)){ if(lib) LIBSEEN.j=libKey(full); break; }
      const r=await ghPut(name,out,rem.sha);
      if(r.status===409 || r.status===422) continue;         // moved under us: read again
      if(!r.ok) throw r.status;
      if(lib) LIBSEEN.j=libKey(full);
      break;
    }
    ghSave({at:Date.now(),err:''});
    return 'ok';
  }catch(e){ const m=ghMsg(e); dbg('SYNC',name,m,e); ghSave({err:m}); return m; }
  finally{ GHBUSY=false; refreshCog();
    if(!lib && DB.lib && libDirty()) GHPEND.add(LIBN);       // a shared food changed: the library too
    if(GHPEND.size){ const n=GHPEND.values().next().value; GHPEND.delete(n); n===DB.cur?ghQueue():ghSync(n); } }   // then the next one
}
/* A profile no longer shared with this phone: anything changed here first goes up to its file
   (if the file is still there), then this phone's copy goes. Answers false to read it again. */
async function ghHide(name,local,rem){
  if(local.at && rem.prof){
    const full=mergeProfile(local,rem.prof);
    if(JSON.stringify(full)!==JSON.stringify(rem.prof)){
      const r=await ghPut(name,full,rem.sha);
      if(r.status===409 || r.status===422) return false;
      if(!r.ok) throw r.status;
    }
  }
  dropLocal(name); return true;
}
function dropLocal(name){
  if(!DB.profiles[name]) return;
  const was=DB.cur===name, used=!!DB.profiles[name].at;
  delete DB.profiles[name];
  if(!Object.keys(DB.profiles).length) DB.profiles.Me=Object.assign(blankProfile(),{pid:uid()});
  if(was){ const own=new Set(mine());
    DB.cur=Object.keys(DB.profiles).sort((a,b)=>a.localeCompare(b)).find(n=>own.has(DB.profiles[n].pid)) || Object.keys(DB.profiles).sort((a,b)=>a.localeCompare(b))[0];
    if(typeof closeSheet==='function' && DB && $('main')){ dropSelect(); closeSheet(); } }
  if(DB.fill && DB.fill.who===name) DB.fill=null;
  save(); diag('profile not shared with this phone, copy removed',name);
  if($('main')){ render(); if(used) toast(name.toUpperCase()+' IS NO LONGER SHARED'); }
}
/* ---------- the shared index: profile renames and deletes, so every phone follows them ----------
   Each entry names the profile's identity, not just its name, so it never touches a
   different profile that shares the name. Entries older than 120 days are dropped. */
function cleanIdx(x){
  const o={gone:{},renamed:{}}, cut=Date.now()-120*864e5;
  x=x&&typeof x==='object'?x:{};
  Object.entries(x.gone||{}).forEach(([n,g])=>{ const t=g&&num(g.t,cut,1e13); if(cleanName(n) && t && g.pid) o.gone[n]={t,pid:String(g.pid)}; });
  Object.entries(x.renamed||{}).forEach(([n,r])=>{ const t=r&&num(r.t,cut,1e13), to=r&&cleanName(r.to);
    if(cleanName(n) && t && to && to!==n && r.pid) o.renamed[n]={to,t,pid:String(r.pid)}; });

}
function mergeIdx(a,b){
  const o=cleanIdx(a);
  Object.entries(b.gone).forEach(([n,g])=>{ if(!(o.gone[n] && o.gone[n].t>=g.t)) o.gone[n]=g; });
  Object.entries(b.renamed).forEach(([n,r])=>{ if(!(o.renamed[n] && o.renamed[n].t>=r.t)) o.renamed[n]=r; });
  return o;
}
function applyIdx(idx){
  Object.entries(idx.renamed).sort((x,y)=>x[1].t-y[1].t).forEach(([old,r])=>{
    const p=DB.profiles[old]; if(!p || p.pid!==r.pid) return;
    DB.profiles[r.to]=DB.profiles[r.to]?mergeProfile(DB.profiles[r.to],p):p;     // anything logged under the old name is kept
    delete DB.profiles[old];
    if(DB.cur===old) DB.cur=r.to;
  });
  Object.entries(idx.gone).forEach(([n,g])=>{ const p=DB.profiles[n]; if(p && p.pid===g.pid) delete DB.profiles[n]; });
  if(!Object.keys(DB.profiles).length) DB.profiles.Me=Object.assign(blankProfile(),{pid:uid()});
  if(!DB.profiles[DB.cur]) DB.cur=Object.keys(DB.profiles)[0];
}
const IDX='/contents/'+DIR+'/_index.json';
/* ---------- privacy: who owns each profile, and who it's shared with ----------
   food/_access.json, one entry per profile identity (pid): its name (n, changed nt), whether it was
   deleted (d), the phone that owns it (h: that phone's id, '' for none), what the owners of other
   profiles may see of it (s: pid -> 1 the diary, 2 the diary and the weight; null: never set up,
   so everyone sees it, as before), when ownership or sharing last changed (t), and the admin phone
   that released it (rb). adm: the admin phone (h), and the recovery passphrase as a PBKDF2 key (k)
   with its salt (s) and rounds (i), never the passphrase itself. A phone sees a profile it owns, one never set up,
   and one shared with a profile it owns. Hidden profiles are never fetched. */
const ACCF='/contents/'+DIR+'/_access.json';
function cleanS(x){ const o={}; if(x && typeof x==='object') Object.keys(x).sort().slice(0,60).forEach(k=>{ if(x[k]===1 || x[k]===2) o[String(k).slice(0,24)]=x[k]; }); return o; }
function cleanAcc(x){
  x=x&&typeof x==='object'?x:{};
  const o={who:{}, adm:null}, w=x.who&&typeof x.who==='object'?x.who:{}, id=v=>String(v||'').replace(/[^\w]/g,'').slice(0,24);
  Object.keys(w).filter(id).sort().slice(0,80).forEach(pid=>{ const e=w[pid]; if(!e || typeof e!=='object') return;
    o.who[id(pid)]={n:cleanName(e.n), nt:orD(num(e.nt,0,1e13),0), d:e.d?1:0, h:id(e.h), s:e.s && typeof e.s==='object'?cleanS(e.s):null,
      t:orD(num(e.t,0,1e13),0), rb:id(e.rb)}; });
  const hex=(v,n)=>{ v=String(v||''); return v.length===n && /^[0-9a-f]+$/.test(v)?v:''; };
  if(x.adm && id(x.adm.h)){ const k=hex(x.adm.k,64), sl=hex(x.adm.s,32);
    const ok=!!(k && sl); o.adm={h:id(x.adm.h), t:orD(num(x.adm.t,0,1e13),0), k:ok?k:'', s:ok?sl:'', i:ok?orD(num(x.adm.i,1000,1e7),PASSI):0}; }
  return o;
}
/* Each entry in two parts, each the later change: its name (and deletion), and its owner and sharing.
   Equal times settle the same way on every phone. */
function mergeAcc(a,b){
  a=cleanAcc(a); b=cleanAcc(b);
  const part=(x,ks)=>JSON.stringify(ks.map(k=>x[k])), late=(x,y,k,ks)=>(y[k]>x[k] || (y[k]===x[k] && part(y,ks)>part(x,ks)))?y:x;
  const o={who:{}, adm:null}, NM=['n','nt','d'], AC=['h','s','t','rb'];
  [...new Set([...Object.keys(a.who),...Object.keys(b.who)])].forEach(pid=>{ const x=a.who[pid], y=b.who[pid];
    if(!x || !y) return o.who[pid]=x||y;
    const nm=late(x,y,'nt',NM), ac=late(x,y,'t',AC);
    o.who[pid]={n:nm.n, nt:nm.nt, d:nm.d, h:ac.h, s:ac.s, t:ac.t, rb:ac.rb}; });
  o.adm=!a.adm?b.adm:!b.adm?a.adm:late(a.adm,b.adm,'t',['h','t','k','s','i']);
  return cleanAcc(o);
}
/* The recovery passphrase, stretched (PBKDF2, SHA-256) so the key in the repo is slow to guess. */
const PASSI=150000;
const hexOf=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const newSalt=()=>hexOf(crypto.getRandomValues(new Uint8Array(16)));
async function passKey(pass,salt,it){
  const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(pass).normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const sl=new Uint8Array(salt.match(/../g).map(h=>parseInt(h,16)));
  return hexOf(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:sl,iterations:it},raw,256));
}
const mine=()=>Object.keys(DB.acc.who).filter(pid=>{ const w=DB.acc.who[pid]; return !w.d && w.h===DB.dev; });   // the profiles this phone owns
/* What this phone may see of a profile: 2 all of it, 1 the diary but not the weight, 0 nothing.
   Without sync there's nothing to keep apart: everything here is this phone's. */
function lvlOf(pid){
  if(!ghOn()) return 2;
  const w=pid && DB.acc.who[pid];
  if(!w || !w.s || w.h===DB.dev) return 2;
  return mine().reduce((l,q)=>Math.max(l,w.s[q]||0),0);
}
const lvlP=n=>DB.profiles[n]?lvlOf(DB.profiles[n].pid):2;
const setUpElsewhere=pid=>{ const w=pid && DB.acc.who[pid]; return !!(w && w.s && w.h!==DB.dev && ghOn()); };   // set up, and not this phone's to change
/* The profile a file name belongs to, as the access record knows it. */
function rosterPid(n){ let best=null; Object.entries(DB.acc.who).forEach(([pid,w])=>{ if(!w.d && w.n===n && (!best || w.nt>best[1])) best=[pid,w.nt]; }); return best&&best[0]; }
/* Every profile in use on this phone has an entry, so the others can share with it. */
function rosterFix(){ let ch=false;
  Object.entries(DB.profiles).forEach(([n,p])=>{ if(p.pid && p.at && !DB.acc.who[p.pid]){ DB.acc.who[p.pid]={n, nt:1, d:0, h:'', s:null, t:0, rb:''}; ch=true; } });
  return ch; }
async function ghAccess(){
  const base='/repos/'+ghCfg().repo+ACCF;
  for(let i=0;i<3;i++){
    const r=await ghReq(base+'?ref='+encodeURIComponent(ghCfg().branch));
    if(!r.ok && r.status!==404) throw r.status;
    const j=r.ok?await r.json():{};
    let remote=cleanAcc(null); try{ if(j.content) remote=cleanAcc(JSON.parse(unb64(j.content))); }catch(e){}
    DB.acc=mergeAcc(DB.acc,remote); if(rosterFix()) DB.acc=cleanAcc(DB.acc);
    save();
    const mj=JSON.stringify(DB.acc);
    if(mj===JSON.stringify(remote)){ if(r.ok) LIVE.etag._access=r.headers.get('ETag')||''; return; }
    const w=await ghReq(base,{method:'PUT',body:JSON.stringify({message:'profile access',branch:ghCfg().branch,sha:j.sha||undefined,
      content:b64(mj)})});
    if(w.ok) return;
    if(w.status!==409 && w.status!==422) throw w.status;
  }
}
async function ghIndex(){
  const base='/repos/'+ghCfg().repo+IDX;
  for(let i=0;i<3;i++){
    const r=await ghReq(base+'?ref='+encodeURIComponent(ghCfg().branch));
    if(!r.ok && r.status!==404) throw r.status;
    const j=r.ok?await r.json():{};
    let remote=cleanIdx(null); try{ if(j.content) remote=cleanIdx(JSON.parse(unb64(j.content))); }catch(e){}
    const merged=mergeIdx(DB.idx,remote);
    applyIdx(merged);
    DB.idx=merged; save();
    if(JSON.stringify(merged)===JSON.stringify(remote)) return;
    const w=await ghReq(base,{method:'PUT',body:JSON.stringify({message:'profiles index',branch:ghCfg().branch,sha:j.sha||undefined,
      content:b64(JSON.stringify(merged))})});
    if(w.ok) return;
    if(w.status!==409 && w.status!==422) throw w.status;
  }
}
/* The diary used to live in data/. The first sync with this version copies whatever is
   still there into food/, once; data/ is left as it was, as a backup. A phone still on the
   old version keeps its changes locally and merges them into food/ once it updates. */
async function ghMove(){
  if(ghCfg().moved) return;
  const base='/repos/'+ghCfg().repo+'/contents/', ref='?ref='+encodeURIComponent(ghCfg().branch);
  const now=await ghReq(base+DIR+ref);
  if(now.ok && (await now.json()).some(f=>/\.json$/.test(f.name))) return ghSave({moved:1});    // already moved, by the other phone
  if(!now.ok && now.status!==404) throw now.status;
  const old=await ghReq(base+'data'+ref);
  if(old.status===404) return ghSave({moved:1});      // nothing to move: a new setup
  if(!old.ok) throw old.status;
  for(const f of await old.json()){
    if(!/\.json$/.test(f.name)) continue;
    const r=await ghReq(base+'data/'+encodeURIComponent(f.name)+ref); if(!r.ok) throw r.status;
    const j=await r.json();
    const w=await ghReq(base+DIR+'/'+encodeURIComponent(f.name),{method:'PUT',
      body:JSON.stringify({message:'Move '+f.name+' to '+DIR+'/',branch:ghCfg().branch,content:String(j.content||'').replace(/\s/g,'')})});
    if(!w.ok && w.status!==422) throw w.status;        // 422: it's already there
  }
  ghSave({moved:1});
}
/* Everything: follow renames and deletes, tidy away files they left behind, pick up
   profiles made on other phones, then sync each profile. */
let ALLBUSY=false;
async function ghSyncAll(){
  if(!ghOn() || ALLBUSY) return 'busy';
  ALLBUSY=true;
  try{
    try{ await ghMove(); await ghIndex(); await ghAccess(); }catch(e){ dbg('SYNC','move, index or access',e); return ghMsg(e); }
    await ghSync(LIBN);                                    // the shared foods first, so every profile written has them
    try{
      const r=await ghReq('/repos/'+ghCfg().repo+'/contents/'+DIR+'?ref='+encodeURIComponent(ghCfg().branch));
      const files=(r.ok?await r.json():[]).map(f=>f.name).filter(n=>/\.json$/.test(n) && n[0]!=='_').map(n=>decodeURIComponent(n.slice(0,-5)));
      for(const n of files){
        if(DB.profiles[n] || cleanName(n)!==n) continue;
        const was=DB.idx.gone[n]||DB.idx.renamed[n];
        if(!was){ const pid=rosterPid(n); if(pid && !lvlOf(pid)) continue;   // not shared with this phone: never fetched
          DB.profiles[n]=blankProfile(); unifyFoods(); continue; }
        const rem=await ghGet(n);                          // a different profile that reuses the name is kept
        if(rem.prof && rem.prof.pid!==was.pid) DB.profiles[n]=blankProfile(); else await ghDelete(n);
      }
      save();
    }catch(e){ dbg('SYNC','profile list',e); }
    let res='ok';
    for(const n of Object.keys(DB.profiles)){ const r=await ghSync(n); if(r!=='ok') res=r; }
    if(libDirty()){ const r=await ghSync(LIBN); if(r!=='ok') res=r; }   // what the profiles brought in
    await ghFeedback();
    return res;
  }finally{ ALLBUSY=false; }
}
/* Feedback notes live in their own file, food/_feedback.json, merged note by note. */
const FBF='/contents/'+DIR+'/_feedback.json';
let FBT=0, FBBUSY=false;
function fbQueue(){ if(!ghOn()) return; clearTimeout(FBT); FBT=setTimeout(()=>{ FBT=0; ghFeedback(); },1500); }
async function ghFeedback(){
  if(!ghOn() || !ghCfg().moved) return 'off';
  if(FBBUSY){ fbQueue(); return 'busy'; }
  FBBUSY=true;
  const base='/repos/'+ghCfg().repo+FBF;
  try{
    for(let i=0;i<3;i++){
      const r=await ghReq(base+'?ref='+encodeURIComponent(ghCfg().branch));
      if(!r.ok && r.status!==404) throw r.status;
      const j=r.ok?await r.json():{};
      let remote=[]; try{ if(j.content) remote=cleanFb(JSON.parse(unb64(j.content)).notes); }catch(e){}
      const merged=mergeFb(DB.fb,remote), mj=JSON.stringify(merged);
      if(mj!==JSON.stringify(DB.fb)){ DB.fb=merged; save(); if(FBPAINT) FBPAINT(); }
      if(mj===JSON.stringify(mergeFb(remote,[])) && r.ok) return 'ok';
      if(!merged.length && !r.ok) return 'ok';                // nothing written yet, nothing to write
      const w=await ghReq(base,{method:'PUT',body:JSON.stringify({message:'feedback '+today(),branch:ghCfg().branch,sha:j.sha||undefined,
        content:b64(JSON.stringify({v:1,notes:merged},null,1))})});
      if(w.ok) return 'ok';
      if(w.status!==409 && w.status!==422) throw w.status;
    }
    return 'ok';
  }catch(e){ dbg('SYNC','feedback',e); return ghMsg(e); }
  finally{ FBBUSY=false; }
}
async function ghDelete(name){
  try{ const rem=await ghGet(name); if(rem.sha) await ghReq(ghUrl(name),{method:'DELETE',
    body:JSON.stringify({message:'remove '+name, sha:rem.sha, branch:ghCfg().branch})}); }catch(e){ dbg('SYNC','delete',name,e); }
}
function ghWhen(){
  const c=ghCfg();
  if(!c.tok) return 'not connected';
  if(c.err) return c.err;
  if(!c.at) return 'connected';
  const m=Math.round((Date.now()-c.at)/60000);
  return m<1?'synced just now':m<60?'synced '+m+'m ago':m<2880?'synced '+Math.round(m/60)+'h ago':'synced '+Math.round(m/1440)+'d ago';
}

/* ---------- text and number boxes: a tap selects everything in them ----------
   Typing then replaces it. iOS moves the cursor again as the finger lifts, so it's selected
   once more then; where a selection isn't possible the cursor goes to the end instead. */
const selectable=el=>el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([readonly])');   // not text areas are edited, not retyped: holding the space bar to move the cursor must just work
function selectAll(el){
  try{ el.select(); }catch(e){}
  try{ if(el.type!=='number') el.setSelectionRange(0,el.value.length); }catch(e){}
  if(!el.value) return;
  try{ if(el.selectionStart===el.selectionEnd) el.setSelectionRange(el.value.length,el.value.length); }catch(e){}
}
document.addEventListener('focusin',e=>{ const el=e.target; if(!selectable(el)) return;
  el.dataset.fresh='1'; setTimeout(()=>{ if(document.activeElement===el) selectAll(el); },0); });
document.addEventListener('pointerup',e=>{ const el=e.target; if(!selectable(el) || el.dataset.fresh!=='1') return;
  delete el.dataset.fresh; setTimeout(()=>{ if(document.activeElement===el) selectAll(el); },0); });
document.addEventListener('focusout',e=>{ if(e.target.dataset) delete e.target.dataset.fresh; });

/* ---------- sound: synthesised, nothing to load ----------
   iOS only lets audio start inside a touch, so the first tap anywhere wakes it. */
['touchend','click'].forEach(t=>document.addEventListener(t,()=>{ if(DB && !soundOn()) return; const c=acx(); if(c && c.state==='suspended') c.resume(); },{once:true,passive:true}));   // audio only woken where sound plays (Terminal)
let AC=null, BUS=null, NOISE=null, SFXAT=0;
function acx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}
  try{ AC=new C(); }catch(e){ return null; }
  const inp=AC.createGain();
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.7;
  const dly=AC.createDelay(0.5); dly.delayTime.value=0.085;
  const fb=AC.createGain(); fb.gain.value=0.26;
  const wet=AC.createGain(); wet.gain.value=0.22;
  const out=AC.createGain(); out.gain.value=0.9;
  inp.connect(hp); hp.connect(lp); lp.connect(out);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
  out.connect(AC.destination);
  BUS=inp;
  return AC;
}
function hiss(dur,vol){
  const c=acx(); if(!c) return;
  if(!NOISE){
    NOISE=c.createBuffer(1,Math.floor(c.sampleRate*0.6),c.sampleRate);
    const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const t0=c.currentTime;
  const src=c.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.7;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(BUS);
  src.start(t0); src.stop(t0+dur+0.05);
}
function tone(freq,dur,vol,delay,o){
  const c=acx(); if(!c) return;
  o=o||{};
  const t0=c.currentTime+(delay||0), env=c.createGain();
  [0,5].forEach((d,i)=>{
    const osc=c.createOscillator();
    osc.type=o.type||(i?'triangle':'sine');
    osc.frequency.setValueAtTime(freq,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur*(o.bend||0.85));
    osc.detune.value=d;
    osc.connect(env); osc.start(t0); osc.stop(t0+dur+0.05);
  });
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.exponentialRampToValueAtTime(vol,t0+(o.attack||0.012));
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  if(o.shimmer){
    const lfo=c.createOscillator(), depth=c.createGain();
    lfo.frequency.value=o.shimmer; depth.gain.value=vol*0.22;
    lfo.connect(depth); depth.connect(env.gain); lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  env.connect(BUS);
}
function dyad(a,b,dur,vol,delay,o){ tone(a,dur,vol,delay,o); tone(b,dur,vol*0.8,delay,o); }
const HISS={tap:[0.07,0.012],open:[0.13,0.016],close:[0.15,0.013],confirm:[0.34,0.018],
  record:[0.4,0.02],start:[0.6,0.02],level:[0.6,0.022],done:[0.7,0.02],nope:[0.28,0.02]};
/* Sound plays in Terminal only; the other themes are silent. The Sound setting is kept for Terminal. */
const soundOn=()=>DB.theme==='crt' && DB.sfx!==false;
function sfx(name){
  if(!soundOn()) return;
  const c=acx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  SFXAT=Date.now();
  hiss(HISS[name][0],HISS[name][1]);
  switch(name){
    case 'tap':     tone(2100,0.06,0.05,0,{attack:0.006}); break;
    case 'open':    tone(1046,0.12,0.055,0,{to:1568,bend:0.6}); break;
    case 'close':   tone(1046,0.14,0.045,0,{to:660,bend:0.7}); break;
    case 'confirm': tone(1046,0.07,0.045,0); tone(1318,0.07,0.045,0.045);
                    tone(1568,0.09,0.05,0.09); tone(2093,0.22,0.05,0.135,{shimmer:10}); break;
    case 'record':  tone(1318,0.09,0.05,0); tone(1760,0.09,0.05,0.06);
                    dyad(2093,2637,0.3,0.042,0.12,{shimmer:7}); break;
    case 'start':   tone(392,0.34,0.05,0,{to:1046,bend:0.9,attack:0.03});
                    dyad(1046,1568,0.4,0.04,0.3,{shimmer:6,attack:0.05}); break;
    case 'level':   [1046,1318,1568,2093].forEach((f,i)=>tone(f,i===3?0.42:0.11,0.05,i*0.085,i===3?{shimmer:7}:{})); break;
    case 'done':    dyad(1046,1568,0.16,0.045,0); dyad(1318,1976,0.5,0.045,0.17,{shimmer:6,attack:0.04}); break;
    case 'nope':    tone(440,0.26,0.045,0,{to:196,bend:0.9,type:'triangle'}); break;
  }
}

/* ---------- touch: no pinch, no double-tap zoom, no page drag under a sheet ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false}));
document.addEventListener('touchstart',e=>{ if(e.touches.length>1 && e.cancelable) e.preventDefault(); },{passive:false});
/* A drag only scrolls something that has more to show: the page when it's longer than the
   screen (and no sheet is up), or a list or form inside a sheet that overflows. */
document.addEventListener('touchmove',e=>{
  if(e.touches.length<2) for(let n=e.target; n && n!==document.documentElement; n=n.parentElement){
    if(n===document.body){ if(!n.classList.contains('locked') && n.scrollHeight>n.clientHeight+1) return; break; }
    const oy=getComputedStyle(n).overflowY;
    if((oy==='auto'||oy==='scroll') && n.scrollHeight>n.clientHeight+1) return;
  }
  if(e.cancelable) e.preventDefault();
},{passive:false});
let LASTTAP=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-LASTTAP<320 && e.cancelable && !e.target.closest('input,textarea,.qrow,.pct,#kbtick')) e.preventDefault();   // the keyboard tick is never a double tap
  LASTTAP=now;
},{passive:false});

/* ---------- sheets ---------- */
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx=()=>!calm() && !document.documentElement.classList.contains('ios');   // static, glitch and warp
const RND=(a,b)=>a+Math.random()*(b-a);
function lock(on){
  document.documentElement.classList.toggle('locked',on);
  document.body.classList.toggle('locked',on);
}
/* Swipe the day: across the header or the intake and weight cards, left for the next day,
   right for the one before (the arrows stay too). Not in the planner, which has no days. */
function swipeDays(el,only){
  let x0=null, y0=0, at=0;
  el.addEventListener('pointerdown',e=>{ x0=null; if(e.pointerType==='mouse' && e.button) return; if(only && !e.target.closest(only)) return; x0=e.clientX; y0=e.clientY; });
  el.addEventListener('pointerup',e=>{ if(x0===null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null;
    if(PLAN || SEL || Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*2) return;
    const b=$(dx<0?'dNext':'dPrev'); if(b){ warp(b); b.click(); } at=Date.now(); });
  el.addEventListener('pointercancel',()=>{ x0=null; });
  el.addEventListener('click',e=>{ if(Date.now()-at<400){ e.stopPropagation(); e.preventDefault(); } },true);   // a swipe isn't a tap on what it crossed

/* Re-render with the named sections held at their old height while only they warp, then

function renderMorph(...mids){

/* An opened section is scrolled into view if it doesn't fit where it is; nothing moves if it does. */
function ensureSeen(el){ try{ el.scrollIntoView({block:'nearest',behavior:calm()?'auto':'smooth'}); }catch(e){ el.scrollIntoView(false); } }
/* A folding section (.msec: its heading .msh and body .msb) opens and closes by its height. */
function foldMsec(s,shut){
  const b=s.querySelector(':scope>.msb');
  if(!b || calm()){ s.classList.toggle('shut',shut); if(!shut && b) ensureSeen(s); return; }
  clearTimeout(b._ft);
  const from=b.classList.contains('folding')?b.getBoundingClientRect().height:shut?b.scrollHeight:0;
  b.classList.add('folding'); b.style.height=from+'px'; void b.offsetHeight;
  s.classList.toggle('shut',shut);
  b.style.height=(shut?0:b.scrollHeight)+'px';
  b._ft=setTimeout(()=>{ b.classList.remove('folding'); b.style.height=''; if(!shut) ensureSeen(s); },340);
}
/* A dashboard section folds by animating its contents between their height and none. */
function fold(card,shut){
  const body=card.querySelector('.mbody'), h=body.scrollHeight;
  if(calm() || !h){ card.classList.toggle('shut',shut); if(!shut) ensureSeen(card); return; }
  body.style.height=(shut?h:0)+'px';
  void body.offsetHeight;
  card.classList.toggle('shut',shut);
  body.style.height=(shut?0:h)+'px';
  const done=e=>{ if(e.propertyName!=='height') return; body.removeEventListener('transitionend',done); if(!shut){ body.style.height=''; ensureSeen(card); } };
  body.addEventListener('transitionend',done);
}

const FILLROW={was:null};
function fillMine(){ const f=DB.fill; return f && f.who===DB.cur?f:null; }
function fillRow(){
  const f=fillMine(), pl=P().plan, days=f?Object.keys(f.days):[];
