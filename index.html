  } else if(!SEL){
    if(f && f.days[DAY] && entries().some(e=>f.days[DAY].includes(e.id))) kind='undo', html='<span>SWIPE TO UNDO PLANNED DAY</span>';

  }

/* Press and hold a food: let go and it's selected; keep holding and move, and it lifts to be
   dragged, to another place in its section or into another one. Once held, the page stops

function bindLift(el,onHold,ids){
  let t=0, x0=0, y0=0, held=false, fired=0, lift=null;
  const end=()=>{ clearTimeout(t); held=false; el.classList.remove('held'); };
  el.addEventListener('pointerdown',e=>{ if(e.button) return; x0=e.clientX; y0=e.clientY; held=false; lift=null;
    t=setTimeout(()=>{ held=true; fired=Date.now(); el.classList.add('held'); try{ navigator.vibrate(30); }catch(x){} },450); });
  el.addEventListener('pointermove',e=>{
    if(!held){ if(Math.abs(e.clientX-x0)>8 || Math.abs(e.clientY-y0)>8) clearTimeout(t); return; }
    if(!lift && Math.abs(e.clientY-y0)>6){ lift=startLift(el,ids,e); try{ el.setPointerCapture(e.pointerId); }catch(x){} }
    if(lift) lift.move(e.clientY);

  el.addEventListener('pointerup',()=>{ const was=held, l=lift; end(); lift=null; if(l) l.drop(); else if(was) onHold(); });
  el.addEventListener('pointercancel',()=>{ end(); if(lift){ lift.cancel(); lift=null; } });
  el.addEventListener('click',e=>{ if(Date.now()-fired<600){ e.stopPropagation(); e.preventDefault(); } },true);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

  const pts2=vals.map((v,i)=>v?[x(i),y(v)]:null).filter(Boolean), si=pts.findIndex(p=>p.k===sel);

    [mx-pad,(mn+mx)/2,mn+pad].forEach(v=>{ s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
    const wide=Math.max(...pts.map(p=>String(p.lab).length))*5.6+6, every=Math.max(1,Math.ceil(n*wide/(W-L-R)));   // names that won't fit: every few shown, always the last
    const endLast=String(pts[n-1].lab).length>3, gap=every*(W-L-R)/(n-1);   // a long last name ends at its point, clear of the edge,
    const shown=i=>!((n-1-i)%every) && !(endLast && i===n-1-every && gap<wide*1.5);   // and the one before it gives it room
    pts.forEach((p,i)=>{ s+='<text data-k="'+p.k+'" class="'+(p.k===sel?'on':p.k===today()?'now':'')+(shown(i)?'':' thin')+'" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+(i===n-1 && endLast?'end':'middle')+'">'+p.lab+'</text>'; });
    s+='<line class="guide" x1="'+x(Math.max(0,si))+'" x2="'+x(Math.max(0,si))+'" y1="'+Tp+'" y2="'+(H-B)+'"'+(si<0?' visibility="hidden"':'')+'/>';

/* the tape: ticks every 0.1 kg (longer at each half and whole kg) moving under a fixed mark; value() is what's under it */
function weightTape(el,start){
  const cv=el.querySelector('canvas'), cx=cv.getContext('2d'), out=el.querySelector('#wVal'), PX=10, LO=200, HI=4000;
  let pos=Math.round(start*10), raf=0, dragging=false;
  const clamp=x=>Math.max(LO,Math.min(HI,x));
  const css=n=>getComputedStyle(el).getPropertyValue(n).trim();
  const draw=()=>{
    const dpr=window.devicePixelRatio||1, W=el.clientWidth, H=el.clientHeight; if(!W) return;
    if(cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
    const col=getComputedStyle(el).color, acc=css('--accent')||css('--bronze')||'#0a84ff';
    const k0=Math.floor(pos-W/2/PX)-1, k1=Math.ceil(pos+W/2/PX)+1;
    cx.lineCap='round';
    for(let k=k0;k<=k1;k++){
      if(k<LO || k>HI) continue;
      const x=W/2+(k-pos)*PX, dx=Math.abs(x-W/2), len=k%10===0?14:k%5===0?10:6;
      const a=Math.min(1,Math.max(0,(dx-26)/26))*Math.min(1,Math.max(0,(W/2-dx)/30));            // fades round the number and at the ends
      if(a<=0) continue;
      cx.globalAlpha=a*(k%10===0?1:.7); cx.strokeStyle=col; cx.lineWidth=k%10===0?1.6:1.2;
      cx.beginPath(); cx.moveTo(x,H-2); cx.lineTo(x,H-2-len); cx.stroke();
    }
    cx.globalAlpha=1; cx.strokeStyle=acc; cx.lineWidth=2.4; cx.beginPath(); cx.moveTo(W/2,H-1); cx.lineTo(W/2,H-17); cx.stroke();      // the mark
  };
  const show=()=>{ const t=Math.round(pos), s=(t/10).toFixed(1); if(out.textContent!==s){ out.textContent=s; el.setAttribute('aria-valuenow',s); el.setAttribute('aria-valuetext',s+' kilograms'); } };
  const set=(x,tick)=>{ const o=Math.round(pos); pos=clamp(x); show(); draw(); if(tick && Math.round(pos)!==o && Math.round(pos)%5===0) sfx('tap'); };
  let s0=null;
  el.addEventListener('pointerdown',ev=>{ cancelAnimationFrame(raf); dragging=true; WT.drag=true; try{ el.setPointerCapture(ev.pointerId); }catch(_){} s0={x:ev.clientX,p:pos,lx:ev.clientX,lt:ev.timeStamp,v:0}; });
  el.addEventListener('pointermove',ev=>{ if(!dragging) return; const dt=Math.max(1,ev.timeStamp-s0.lt); s0.v=.8*s0.v+.2*((ev.clientX-s0.lx)/dt); s0.lx=ev.clientX; s0.lt=ev.timeStamp; set(s0.p-(ev.clientX-s0.x)/PX,true); });
  const end=()=>{ if(!dragging) return; dragging=false; WT.drag=false;
    let v=-s0.v/PX*16;                                   // tenths per frame
    if(calm() || Math.abs(v)<.15){ set(Math.round(pos)); return; }
    const run=()=>{ v*=.94; set(pos+v,true); if(Math.abs(v)>.04 && pos>LO && pos<HI) raf=requestAnimationFrame(run); else set(Math.round(pos)); };
    raf=requestAnimationFrame(run); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',ev=>{ if(ev.key==='ArrowLeft'||ev.key==='ArrowDown'){ ev.preventDefault(); set(pos-1,true); } else if(ev.key==='ArrowRight'||ev.key==='ArrowUp'){ ev.preventDefault(); set(pos+1,true); } });
  const api={ value:()=>Math.round(pos)/10, step:d=>{ cancelAnimationFrame(raf); set(pos+d,true); }, set:v=>{ cancelAnimationFrame(raf); set(Math.round(v*10)); } };
  el._tape=api; show(); draw(); requestAnimationFrame(draw);
  if(window.ResizeObserver) new ResizeObserver(draw).observe(el);
  return api;
}

   only; with Reduce Motion it moves without sliding. */
function secCarousel(box,onPick){
  const ms=P().meals, T=box.querySelector('.sct'), items=[...T.children];
  let i=Math.max(0,ms.findIndex(m=>m.id===ADD.meal)), x=0, s=null, at=0;
  const W=()=>box.clientWidth, IW=()=>items[0].offsetWidth||1;

  const ease=()=>calm()?'':'.32s cubic-bezier(.2,.8,.2,1)';
  const paint=(pos,e)=>{
    T.style.transition=e?'transform '+e:'none'; T.style.transform='translateX('+pos+'px)';
    const c=((W()-IW())/2-pos)/IW();                                // which item is in the middle, fractionally
    items.forEach((el,k)=>{ const d=Math.min(1,Math.abs(k-c));
      el.style.transition=e?'transform '+e:'none'; el.style.transform='scale('+(1-.1*d).toFixed(3)+')';
      el.classList.toggle('on',k===Math.round(c)); el.setAttribute('aria-pressed',k===Math.round(c)?'true':'false'); });
    const m=Math.round(c); box.querySelector('.scar.l').classList.toggle('end',m<=0); box.querySelector('.scar.r').classList.toggle('end',m>=items.length-1);
  };

  box.to=id=>{ const k=ms.findIndex(m=>m.id===id); if(k>=0) go(k); };

    s={x0:e.clientX, y0:e.clientY, p0:x, on:false, v:0, lx:e.clientX, lt:e.timeStamp}; });

  });
}

  const linked=e=>!!e.fid && P().foods.some(x=>x.id===e.fid);
  /* its own: linked to it (or to a copy folded into it), or logged unlinked under its name with its serving or nutrition */
  const now=Date.now(), mine=e=>ids.has(e.fid) || (!linked(e) && names.has(normS(e.n)) && (svs.has(String(e.sv).trim().toLowerCase()) || near(per100(e)))), put=e=>followFood(e,f);

    p.combos.forEach(c=>{ let hit=false; c.items.forEach(e=>{ if(mine(e) && !same(e)){ put(e); hit=true; } }); if(hit){ c.e=later(c.e); m++; } });

    p.plans.forEach(x=>{ let hit=false; x.items.forEach(e=>{ if(mine(e) && !same(e)){ put(e); hit=true; } }); if(hit){ x.e=later(x.e); m++; } });

  };
  draw();

const SCAN={on:false, stream:null, raf:0, zx:null, host:null, cb:null, alt:''};   // alt: what to suggest when the camera can't
const sq=s=>SCAN.host && SCAN.host.querySelector(s);

let ZXP=null;
function loadZX(){
  return ZXP=ZXP||new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload=res; s.onerror=()=>{ ZXP=null; rej(); };

}
function scStat(t,err){ const el=sq('.stat'); if(!el) return; if(el.textContent===t){ el.classList.toggle('err',!!err); return; }
  swapText(el,()=>{ el.textContent=t; el.classList.toggle('err',!!err); }); }
function scPaint(on){
  if(!on && sq('.scanbox')) sq('.scanbox').classList.remove('live');
}
const CAM={video:{facingMode:{ideal:'environment'}},audio:false};
async function startScan(){
  if(!navigator.mediaDevices){ sfx('nope'); return scStat('NO CAMERA HERE \u2014 '+(SCAN.alt||'TRY SEARCH'),true); }
  sq('.scres').innerHTML='';
  let det=null;
  try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(e){}
  if(det){
    try{ SCAN.stream=await navigator.mediaDevices.getUserMedia(CAM); }
    catch(e){ sfx('nope'); return scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
    const v=sq('video'); v.srcObject=SCAN.stream; v.play().catch(()=>{});
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    const loop=async()=>{
      if(!SCAN.on) return;
      try{ const c=await det.detect(v); if(c.length) return gotCode(c[0].rawValue); }catch(e){}
      SCAN.raf=requestAnimationFrame(loop);
    };
    return loop();
  }
  scStat('LOADING SCANNER\u2026');
  try{ await loadZX(); }catch(e){ sfx('nope'); return scStat('SCANNER DID NOT LOAD \u2014 '+(SCAN.alt||'TRY SEARCH'),true); }
  if(!SCAN.host.isConnected) return;
  try{
    const Z=ZXing, hints=new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]]]);
    SCAN.zx=new Z.BrowserMultiFormatReader(hints,250);
    SCAN.on=true; scPaint(true); scStat('HOLD THE BARCODE IN THE FRAME');
    await SCAN.zx.decodeFromConstraints(CAM,sq('video'),r=>{ if(r && SCAN.on) gotCode(r.getText()); });
  }catch(e){ dbg('SCAN','camera',e); stopScan(); sfx('nope'); scStat('CAMERA BLOCKED \u2014 ALLOW IT IN SETTINGS',true); }
}
function stopScan(){
  SCAN.on=false;
  cancelAnimationFrame(SCAN.raf);
  if(SCAN.zx){ SCAN.zx.reset(); SCAN.zx=null; }
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
  const v=sq('video'); if(v){ v.pause(); v.srcObject=null; }
  scPaint(false);
}
function gotCode(code){
  if(!SCAN.on) return;
  stopScan();
  try{ navigator.vibrate(50); }catch(e){}
  SCAN.cb(code.replace(/\D/g,''));
}
function offMap(p){
  const n=p.nutriments||{};
  const val=k=>{ const v=n[k]; return v===undefined||v===null||v===''||!isFinite(+v)?null:+v; };
  const kcal=s=>{ const k=val('energy-kcal'+s); if(k!==null) return k;
    const kj=val('energy-kj'+s)!==null?val('energy-kj'+s):val('energy'+s);   // OFF "energy" is kJ
    return kj===null?null:kj/4.184; };
  let per='_serving', sv=String(p.serving_size||'').replace(/\s+/g,' ').trim().slice(0,40), k=kcal(per);
  const sg=gramsOf(sv);
  if(k===null && sg && kcal('_100g')!==null) k=kcal('_100g')*sg.n/100;          // serving worked out from per 100 g
  if(!sv || k===null){ per='_100g'; k=kcal(per); sv=p.nutrition_data_per==='100ml'?'100 ml':'100 g'; }
  const name=String(p.product_name||p.generic_name||'').replace(/\s+/g,' ').trim();
  if(k===null || !name) return null;
  const g=gramsOf(sv);
  const m=f=>{ let v=val(f+per); if(v===null && per==='_serving' && g && val(f+'_100g')!==null) v=val(f+'_100g')*g.n/100; return v>0?v:0; };
  const x={}; XN.forEach(([key,,,,off,mul])=>{ const v=m(off); if(v) x[key]=r3(v*mul); });
  const br=String(p.brands||'').split(',')[0].trim();
  const own=br && !name.toLowerCase().includes(br.toLowerCase());   // a brand the name doesn't carry: kept as the brand
  return {n:name.slice(0,80), ...(own?{b:br.slice(0,40)}:{}),
    sv, k:r3(k), p:r3(m('proteins')), c:r3(m('carbohydrates')), f:r3(m('fat')), x, bc:String(p.code||'').replace(/\D/g,'')};
}
const OFF_FIELDS='code,product_name,generic_name,brands,serving_size,nutrition_data_per,nutriments';
/* ---------- the Australian list, kept on the phone ----------
   au-foods.json sits beside the app, rebuilt monthly from Open Food Facts by a GitHub Action.
   Each phone downloads it once into IndexedDB (too big for localStorage), checks the tiny
   au-foods.v.json now and then for a newer month, and searches it instantly, offline too. */
const LOCAL={v:'', d:null, idx:null, cmp:null, voc:null, codes:null, busy:false};
let IDB=null;
function idb(){ return IDB=IDB||new Promise((ok,no)=>{ const r=indexedDB.open('food_diary',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{ const db=r.result; db.onclose=db.onversionchange=()=>{ try{ db.close(); }catch(e){} IDB=null; }; ok(db); };
  r.onerror=()=>{ IDB=null; no(r.error); }; }); }
async function idbDo(mode,fn,again){ const db=await idb(); let t;
  try{ t=db.transaction('kv',mode); }catch(e){ IDB=null; if(!again) return idbDo(mode,fn,true); throw e; }   // a closed connection: open it again, once
  return new Promise((ok,no)=>{ const q=fn(t.objectStore('kv')); t.oncomplete=()=>ok(q.result); t.onerror=()=>no(t.error); }); }
async function localLoad(){
  try{ const x=await idbDo('readonly',s=>s.get('au')); if(x && Array.isArray(x.d)){ LOCAL.v=x.v; LOCAL.d=x.d; LOCAL.idx=LOCAL.codes=LOCAL.voc=null; } }catch(e){ dbg('LIST','load',e); }
}
async function localRefresh(force){
  if(location.protocol==='file:' || LOCAL.busy || !navigator.onLine) return 'offline';
  LOCAL.busy=true;
  try{
    const r=await fetch('au-foods.v.json?'+Date.now(),{cache:'no-store'}); if(!r.ok) return 'missing';
    const v=await r.json(); if(!force && v.v===LOCAL.v) return 'current';
    const j=await (await fetch('au-foods.json?v='+encodeURIComponent(v.v))).json();
    if(!Array.isArray(j.d) || !j.d.length) return 'missing';
    await idbDo('readwrite',s=>s.put({v:j.v, d:j.d},'au'));
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    LOCAL.v=j.v; LOCAL.d=j.d; LOCAL.idx=LOCAL.codes=LOCAL.voc=null;
    return 'updated';
  }catch(e){ dbg('LIST','refresh',e); return 'failed'; }
  finally{ LOCAL.busy=false; }
}
/* One row of the list as a product, so it becomes a food exactly as an online result does.
   Rows keyed afcd-... are generic foods from the Australian Food Composition Database:
   no barcode, no brand, per 100 g. */
const isAfcd=r=>String(r[0]).startsWith('afcd-');
function localFood(r){
  const n={'energy-kcal_100g':r[4], proteins_100g:r[5], carbohydrates_100g:r[6], fat_100g:r[7]};
  XN.forEach(([,,,,off],i)=>{ if(r[8+i]) n[off+'_100g']=r[8+i]; });
  const f=offMap({code:isAfcd(r)?'':r[0], product_name:r[1], brands:r[2], serving_size:r[3], nutriments:n});
  if(f && isAfcd(r)) f.src='afcd';
  return f;
}
/* Every word typed has to appear in the brand or name; closer and shorter matches first. */
function localSearch(q){
  if(!LOCAL.d) return [];
  if(!LOCAL.idx){ LOCAL.idx=LOCAL.d.map(r=>normS((r[2]||'')+' '+r[1])); LOCAL.cmp=LOCAL.idx.map(s=>s.replace(/ /g,'')); LOCAL.voc=null; }
  const ws=wordsOf(q); if(!ws.length) return [];
  const hits=[], rank=(i,near)=>{ const s=LOCAL.idx[i], at=s.indexOf(ws[0]);    // generic foods ahead of brands for plain searches
    return (at<0?20:at)+s.length/40-(isAfcd(LOCAL.d[i])?1.5:0)+(near?100:0); };
  for(let i=0;i<LOCAL.idx.length;i++){ const s=LOCAL.idx[i], c=LOCAL.cmp[i];
    if(ws.every(w=>s.includes(w)||c.includes(w))) hits.push([rank(i,false),i]); }
  if(hits.length<8){                                  // few exact matches: look for close spellings too
    if(!LOCAL.voc){ LOCAL.voc=new Map(); LOCAL.idx.forEach((s,i)=>s.split(' ').forEach(t=>{ if(t.length>2){ let l=LOCAL.voc.get(t); if(!l) LOCAL.voc.set(t,l=[]); if(l[l.length-1]!==i) l.push(i); } })); }
    const sets=ws.map(w=>{ const rows=new Set();
      LOCAL.voc.forEach((l,t)=>{ if(t.includes(w) || nearWord(w,t)) l.forEach(i=>rows.add(i)); });
      return rows; });
    const have=new Set(hits.map(([,i])=>i));
    sets.sort((x,y)=>x.size-y.size)[0].forEach(i=>{ if(!have.has(i) && sets.every(s=>s.has(i))) hits.push([rank(i,true),i]); });
  }
  const seen=new Set(), out=[];                       // identical foods (same name, same nutrition) show once, the best match
  for(const [,i] of hits.sort((x,y)=>x[0]-y[0])){ const f=localFood(LOCAL.d[i]); if(!f) continue;
    const k=normS(f.n)+'|'+LOCAL.d[i].slice(4).join(); if(seen.has(k)) continue; seen.add(k); out.push(f); if(out.length>=40) break; }
  return out;
}
function localSummary(){
  if(!LOCAL.d) return 'not downloaded yet';
  const g=LOCAL.d.reduce((n,r)=>n+(isAfcd(r)?1:0),0);
  return fmt(LOCAL.d.length-g)+' products'+(g?' + '+fmt(g)+' generic':'')+' \u00b7 '+shortDay(LOCAL.v).slice(4);
}
function localCode(code){
  if(!LOCAL.d) return null;
  if(!LOCAL.codes){ LOCAL.codes=new Map(); LOCAL.d.forEach(r=>LOCAL.codes.set(r[0],r)); }
  const r=LOCAL.codes.get(code); return r?localFood(r):null;
}
/* A barcode's product from Open Food Facts, mapped to a food, or null if it isn't there. */
async function offLookup(code){
  const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields='+OFF_FIELDS);
  const j=r.ok?await r.json():null;
  return j && j.status===1?offMap(j.product):null;
}
async function lookupCode(code){
  const open=(f,o)=>{ stopScan(); popSheet(); openQty(f,o); };   // in place of the scanner, with nothing showing in between
  const saved=P().foods.find(f=>f.bc===code) || P().foods.find(f=>(f.ob||[]).includes(code)), here=!saved && (l=>l && (savedFor(l)||l))(localCode(code));
  if(saved||here){ sfx('confirm'); return open(saved||here,{}); }
  scStat('LOOKING UP '+code+'\u2026');
  try{
    const f=await offLookup(code);
    if(f){ sfx('confirm'); scStat(''); return open(savedFor(f)||f,{}); }
    sfx('nope'); scStat('NO MATCH FOR '+code,true);
  }catch(e){ dbg('SCAN','lookup',code,e); sfx('nope'); scStat('LOOKUP FAILED \u2014 CHECK THE CONNECTION',true); }
}

/* ---------- search: everything on the phone, as you type ----------
   Your own foods come first: everything logged in the last 30 days (including foods hidden
   from Recent), then your saved foods, then the Australian list, updated monthly. Every word
   typed must appear in the name. Nothing is searched online. */
const HISTORY_DAYS=30;
/* ---------- matching: forgiving of punctuation, spacing, accents and small spelling slips ----------
   Names and searches are both reduced to plain words: lower case, no accents, hyphens and
   apostrophes dropped (Weet-Bix is weetbix, Arnott's is arnotts), other punctuation a space.
   A word matches when it appears in the name, in the name with its spaces taken out (weetbix
   finds Weet Bix), or, failing that, a word of the name within 1 letter of it (2 for words of 8
   letters or more), counting two letters swapped as one slip, and allowing for a word still
   being typed. Exact matches always come before near ones. */
const normS=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ')
  .replace(/['\u2019.\-]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const wordsOf=q=>normS(q).split(' ').filter(Boolean);
function slips(a,b,k){                               // edits from a to b (swaps count once), or k+1 once past k
  if(Math.abs(a.length-b.length)>k) return k+1;
  let p2=null, p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const c=[i]; let low=i;
    for(let j=1;j<=b.length;j++){
      let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2 && i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) v=Math.min(v,p2[j-2]+1);
      c.push(v); if(v<low) low=v;
    }
    if(low>k) return k+1;
    p2=p; p=c;
  }
  return p[b.length];
}
function nearWord(w,t){
  if(w.length<5) return false;                         // 'milk' isn't 'mild'
  const k=w.length>=8?2:1;
  return slips(w,t,k)<=k || (t.length>w.length && slips(w,t.slice(0,w.length),k)<=k);   // or the start of a longer word
}
/* 2: every word found as typed; 1: some only within a slip; 0: not a match. */
function matchScore(text,ws){
  const s=normS(text), c=s.replace(/ /g,''); let near=false;
  for(const w of ws){
    if(s.includes(w) || c.includes(w)) continue;
    if(s.split(' ').some(t=>nearWord(w,t))){ near=true; continue; }
    return 0;
  }
  return near?1:2;
}
const fullName=f=>((f.b?f.b+' ':'')+(f.n||'')).trim();   // brand and name together: what a food is called in full
const sameFood=f=>(fullName(f)+'|'+f.sv).toLowerCase();
/* Per 100 g (or ml): what makes two foods identical whatever their servings. */
const per100=f=>{ const g=gramsOf(f.sv); return g && g.n>0?['k','p','c','f'].map(k=>(f[k]||0)*100/g.n):null; };
/* A list food that is one of yours: the same barcode, or the same name with the same nutrition
   (within label rounding). Yours shows; the list copy doesn't. */
/* The saved food a list food is: by its barcode (now or before), the list food it was saved from,
   or its name (ignoring case and punctuation). Yours is the one source: it's shown in its place. */
function savedFor(f){ if(!f) return null; const L=P().foods, n=normS(fullName(f)), k=sameFood(f);
  return (f.bc && L.find(x=>x.bc===f.bc || (x.ob||[]).includes(f.bc))) || L.find(x=>x.o===k) || L.find(x=>normS(fullName(x))===n) || null; }
const isVf=f=>!!(f && (f.vf || f.fid && (P().foods.find(x=>x.id===f.fid)||{}).vf));   // a food, or an entry of one, you've verified
function isMine(f,mine){
  if(f.bc && mine.some(x=>x.bc===f.bc)) return true;
  const a=per100(f); if(!a) return false;
  return mine.some(x=>{ if(normS(fullName(x))!==normS(fullName(f))) return false; const b=per100(x);
    return b && Math.abs(a[0]-b[0])<=2 && [1,2,3].every(i=>Math.abs(a[i]-b[i])<=0.3); });
}
function historyFoods(){                              // newest first, one per food
  const from=shift(today(),-HISTORY_DAYS), out=[];
  Object.keys(P().days).filter(d=>d>=from && d<=today()).forEach(d=>P().days[d].forEach(e=>out.push(e)));
  return foldLog(out);
}
/* Exact matches in their own order; close spellings after them, only when exact ones are few. */
const byMatch=(list,ws)=>{ const s=list.map(x=>[matchScore(fullName(x),ws),x]).filter(([m])=>m), ex=s.filter(([m])=>m===2);
  return ex.concat(ex.length<3?s.filter(([m])=>m===1):[]).map(([,x])=>x); };
/* Your own foods that match: history, then saved foods not already in it. */
function yourFoods(q){
  const ws=wordsOf(q), hist=byMatch(historyFoods(),ws), have=new Set(hist.map(sameFood));
  const saved=byMatch(P().foods.filter(f=>!have.has(sameFood(f))),ws);
  return {hist, saved};
}
function queueSearch(q){
  ADD.sq=q; q=q.trim();
  const s=$('osSt'); if(!s) return;
  if(q.length<2){ ADD.results=[]; s.textContent=''; return paintResults(); }
  const mine=yourFoods(q), have=new Set([...mine.hist,...mine.saved].map(sameFood).concat(P().foods.map(f=>f.o).filter(Boolean)));
  const shown=new Set([...mine.hist.map(e=>e.fid),...mine.saved.map(f=>f.id)].filter(Boolean)), seen=new Set();
  ADD.results=localSearch(q).map(f=>savedFor(f)||f)                  // a list food you've saved shows as yours
    .filter(f=>{ if(f.id){ if(shown.has(f.id) || seen.has(f.id)) return false; seen.add(f.id); return true; } return !have.has(sameFood(f)) && !isMine(f,P().foods); });
  const none=!mine.hist.length && !mine.saved.length && !ADD.results.length;
  s.textContent=!LOCAL.d?'AUSTRALIAN LIST NOT ON THIS PHONE YET \u2014 SETTINGS \u203a SYNC AND BACKUP'
    :none?'NO MATCHING FOODS \u2014 TRY FEWER WORDS, OR TAP + TO ADD IT':'';
  s.classList.toggle('err',none || !LOCAL.d);
  paintResults();
}
function paintResults(){
  const L=$('osList'), list=ADD.results.slice(0,40);
  L.innerHTML=(list.length?'<div class="lh">Results</div>':'')+list.map((f,i)=>foodRow(f,i)).join('');
  const pick=i=>{ const f=ADD.results[i]; return (f.bc && P().foods.find(x=>x.bc===f.bc))||f; };
  bindRows(L,i=>openQty(pick(i),{}),i=>{ const f=pick(i); quickAdd(f,1,'',P().foods.includes(f)?f.id:''); });
}
/* Nothing typed: Recent, the last 11 foods. Searching: every food of yours that matches,
   from the last 30 days first, then saved foods, each at the amount you last had it. */
function paintRecent(q){
  const s=q.trim(), L=$('rcList');
  const mine=s.length>=2?yourFoods(s):null, usual=!mine && !ADD.into && !ADD.group?usualFor(ADD.meal):[], uk=new Set(usual.map(mealKey));
  const list=mine?[...mine.hist,...mine.saved]:[...usual,...(ADD.group?recentFoods():recentMix()).filter(e=>!uk.has(mealKey(e)))];
  const lastRow=(e,i)=>e.meal?foodListRow(i,e.c.n,items(e.c.items.length),macroSum(e.c.items).k,true,'mn'):e.m===undefined?foodRow(e,i):noNut(e)?foodListRow(i,e.n,brandOf(e)+'NO NUTRITION INFO',0,true,'nonut'+(isVf(e)?' vf':''))   // as last logged: its amount and calories
    :foodListRow(i,e.n,brandOf(e)+esc(qtyTxt(e)),e.k*e.q,true,isVf(e)?'vf':'');
  const rows=list.map((e,i)=>lastRow(e,i)), mn=mealById(ADD.meal);
  L.innerHTML=list.length?(usual.length?'<div class="lh">Usual for '+esc(mn?mn.n:'now')+'</div>'+rows.slice(0,usual.length).join('')+'<div class="lh">Recent</div>'+rows.slice(usual.length).join('')
      :'<div class="lh">'+(mine?'Your foods':'Recent')+'</div>'+rows.join(''))
    :!s && !historyFoods().length?'<div class="stat">NOTHING LOGGED YET \u2014 SEARCH FOR A FOOD</div>':'';
  const logged=e=>!e.meal && e.m!==undefined;        // a diary entry, rather than a saved food or meal
  const food=e=>logged(e)?(P().foods.find(f=>f.id===e.fid)||{id:'', n:e.n, ...(e.b?{b:e.b}:{}), sv:e.sv, k:e.k, p:e.p, c:e.c, f:e.f, x:e.x, bc:''}):e;
  bindRows(L,i=>list[i].meal?openCombo(list[i].c):openQty(food(list[i]),logged(list[i])?{q:list[i].q, w:list[i].w}:{}),
    i=>{ const e=list[i]; if(e.meal) return quickMeal(e.c); const f=food(e); logged(e)?quickAdd(f,e.q,e.w,P().foods.includes(f)?f.id:''):quickAdd(f,1,'',f.id); },
    i=>{ const e=list[i];                           // swipe a logged food away (Recent or Your foods); saved foods are deleted in Settings
      if(e.meal){ P().rh['m:'+e.c.id]=Date.now(); touch(); toast('REMOVED FROM RECENT'); }
      else if(logged(e)){ P().rh[logKey(e)]=Date.now(); touch(); toast('REMOVED FROM '+(mine?'YOUR FOODS':'RECENT')); }
      else toast('DELETE SAVED FOODS IN SETTINGS \u203a SAVED FOODS & MEALS');
      paintRecent($('osQ').value); });
}

/* Privacy. A phone claims its owner's profile; from then on only that phone decides who sees it:
   OFF, the DIARY (food, targets and planner) or ALL of it (the weight too), for each other profile's
   phone. A profile nobody has set up is seen by everyone, as before. The admin phone can only reset
   an owner, for a lost or replaced phone: the sharing stays, and the admin can't claim it.
   Becoming admin sets a recovery passphrase. On a new phone it moves the admin there, with every
   profile the old admin phone owned. */
const LV=[['0','OFF'],['1','DIARY'],['2','ALL']];
const accLive=()=>{ const W=DB.acc.who; return Object.keys(W).filter(pid=>!W[pid].d && W[pid].n).sort((a,b)=>W[a].n.localeCompare(W[b].n) || (a<b?-1:1)); };
function privSum(){ if(!ghOn()) return 'needs sync'; const W=DB.acc.who, m=mine().filter(pid=>!W[pid].d).map(pid=>W[pid].n).sort();
  return m.length?'yours: '+m.join(' \u00b7 '):'no profile claimed'; }
let ACCT=0, PVX={};                                  // PVX: the passphrase boxes opened on the Privacy screen
function accPush(){ clearTimeout(ACCT); ACCT=setTimeout(async()=>{ ACCT=0; if(ALLBUSY) return accPush();
  await ghSyncAll(); render(); paintPrivacy(); },900); }
function openPrivacy(){
  sfx('open'); PVX={};
  setSheet(panel('Account','<div id="pvBody"></div>',true));
  bindPanel(openSettings);
  paintPrivacy();
  if(ghOn()){ const was=JSON.stringify(DB.acc); ghSyncAll().then(()=>{ render(); if(JSON.stringify(DB.acc)!==was) paintPrivacy(); }); }   // the latest owners and sharing
}

      (rest.length?rest.map(q=>'<label class="flab">'+esc(W[q].n)+(W[q].h?'':' \u00b7 not claimed')+'</label>'+picker('pv'+pid+'_'+q,LV,String(W[pid].s&&W[pid].s[q]||0))).join('')

      '<div class="pgnote">DIARY: food, targets and planner. ALL: the weight too. OFF: nothing, not even the name in their profiles. Their phone follows at its next sync.</div></div>'; });
  const pf=(id,lab,ac)=>'<label class="flab" for="'+id+'">'+lab+'</label><input class="fld" id="'+id+'" type="password" autocomplete="'+ac+
    '" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" maxlength="128">';
  const keep='<div class="pgnote">At least 8 characters. Keep it in your password manager: it moves the admin, and this phone\u2019s profiles, to a new phone.</div>';
  h+='<div class="card pgcard"><div class="pghead"><h4 class="pgh">Admin</h4></div>'+
    (!adm?'<div class="pgnote">No admin yet. The admin phone can reset a profile\u2019s owner if its phone is lost or replaced. It can\u2019t change who sees anything.</div>'+

            '<div class="pgnote">Reset a profile when its phone is lost or replaced. Its sharing stays as it is, and its new phone claims it here. This phone can\u2019t claim it.</div>':'')+
          (!adm.k || PVX.pass?pf('pvP1','New recovery passphrase','new-password')+pf('pvP2','Passphrase again','new-password')+keep+
              '<button class="btn" id="pvPass">[ SAVE PASSPHRASE ]</button>'

/* Becoming admin (make) or changing the passphrase: typed twice, at least 8 characters. */
async function savePass(make){
  if(PVBUSY) return;
  const p1=$('pvP1').value, p2=$('pvP2').value, a=DB.acc.adm;
  if(p1.length<8){ sfx('nope'); return toast('PASSPHRASE: AT LEAST 8 CHARACTERS'); }

  if(make?!!a:!(a && a.h===DB.dev)){ sfx('nope'); return paintPrivacy(); }

    if(make?!!DB.acc.adm:!(DB.acc.adm && DB.acc.adm.h===DB.dev)){ sfx('nope'); return paintPrivacy(); }   // changed meanwhile

/* On the admin's new phone: the passphrase moves the admin here, with every profile the old
   admin phone owned. Checked against the latest admin record. */
async function recoverAdmin(pass){
  if(PVBUSY) return;
  PVBUSY=true;
  try{
    try{ await ghAccess(); }catch(e){ sfx('nope'); return toast('CAN\u2019T REACH GITHUB'); }
    const a=DB.acc.adm;
    if(!a || !a.k || a.h===DB.dev){ sfx('nope'); return paintPrivacy(); }
    let k=''; try{ k=await passKey(pass,a.s,a.i); }catch(e){ dbg('PASS',e); }
    if(!k || k!==a.k){ sfx('nope'); return toast('WRONG PASSPHRASE'); }
    const old=a.h;
    Object.values(DB.acc.who).forEach(w=>{ if(!w.d && w.h===old){ w.h=DB.dev; w.rb=''; w.t=later(w.t); } });
    DB.acc.adm=Object.assign({},a,{h:DB.dev, t:later(a.t)});
    diag('admin recovered on this phone');

}

/* Hold a row, then drag it up or down; the others slide aside and the order is kept on release. */
function bindReorder(list,onDone){
  const rows=[...list.children];
  rows.forEach((row,from)=>{
    let t=0, y0=0, h=0, to=from, drag=false;
    row.addEventListener('pointerdown',e=>{
      if(e.target.closest('button')) return;
      y0=e.clientY; row.setPointerCapture(e.pointerId);
      t=setTimeout(()=>{ drag=true; h=row.offsetHeight; to=from;
        row.classList.add('lift'); list.classList.add('sorting'); try{ navigator.vibrate(30); }catch(x){} },400);
    });
    row.addEventListener('pointermove',e=>{
      if(!drag){ if(Math.abs(e.clientY-y0)>8) clearTimeout(t); return; }
      const dy=e.clientY-y0;
      to=Math.max(0,Math.min(rows.length-1,from+Math.round(dy/h)));
      row.style.transform='translateY('+dy+'px)';
      rows.forEach((r,j)=>{ if(r!==row) r.style.transform=(to>from && j>from && j<=to)?'translateY(-'+h+'px)':(to<from && j<from && j>=to)?'translateY('+h+'px)':''; });
    });
    const end=()=>{
      clearTimeout(t);
      if(!drag) return;
      drag=false;
      rows.forEach(r=>r.style.transform='');
      row.classList.remove('lift'); list.classList.remove('sorting');
      if(to!==from) onDone(from,to);
    };
    row.addEventListener('pointerup',end);
    row.addEventListener('pointercancel',end);
  });
}

  setSheet(panel('Sync and backup','<div class="card pgcard"><div class="pghead"><h4 class="pgh">GitHub</h4></div>'+

    (on?'<div class="pgrow"><span class="pk">Repo</span><span class="pv">'+esc(c.repo)+'</span></div>'+
        '<div class="pgrow"><label class="pk" for="syLive">Live updates</label><select class="fld sysel" id="syLive">'+
          [[5,'Every 5 seconds'],[15,'Every 15 seconds'],[30,'Every 30 seconds'],[0,'Off']].map(([v,l])=>'<option value="'+v+'"'+(c.live===v?' selected':'')+'>'+l+'</option>').join('')+
        '</select></div>'+

      :'<label class="flab" for="syRepo">Private data repo</label>'+
        '<input class="fld" id="syRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="owner/food-data" value="'+esc(c.repo)+'">'+
        '<label class="flab" for="syTok">Access token</label>'+
        '<div class="srch"><input class="fld" id="syTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_\u2026">'+
        '<button class="btn ghost" id="syPaste">[ PASTE ]</button></div>'+
        '<button class="btn" id="syGo">[ CONNECT ]</button>'+
        '<div class="pgnote">Fine-grained token for this repo only, Contents: read and write. Kept on this phone only.</div>')+
    '</div><div class="card pgcard"><div class="pghead"><h4 class="pgh">Backup file \u00b7 profiles on this phone</h4></div>'+
    '<div class="duo"><button class="btn" id="exGo">[ SAVE FILE ]</button><button class="btn ghost" id="imGo">[ LOAD FILE ]</button></div>'+
    '<div class="pgnote">Loading merges into what is here. Nothing is lost.</div></div>'+
    '<div class="card pgcard"><div class="pghead"><h4 class="pgh">Activity log</h4></div>'+
    '<div class="pgrow"><span class="pk">Kept on this phone</span><span class="pv" id="dgN">'+diagCount()+' lines</span></div>'+
    '<div class="duo"><button class="btn ghost" id="dgClr">[ CLEAR ]</button><button class="btn" id="dgCp">[ COPY LOG ]</button></div>'+
    '<div class="pgnote">Food saves, what each sync changed, the phone\u2019s clock and any errors. Copy it to send when something goes wrong.</div></div>'+
    '<div class="card pgcard"><div class="pghead"><h4 class="pgh">Australian food list</h4></div>'+
    '<div class="pgrow"><span class="pk">Status</span><span class="pv" id="auSt">'+esc(localSummary())+'</span></div>'+
    '<button class="btn ghost" id="auGo">[ CHECK FOR UPDATE ]</button>'+
    '<div class="pgnote">Open Food Facts and FSANZ AFCD, rebuilt on the 1st of each month.</div></div>',true));
  bindPanel(openSettings);
  $('auGo').onclick=async()=>{ const s=$('auSt'); s.textContent='Checking\u2026';
    const r=await localRefresh(true);
    toast({updated:'FOOD LIST UPDATED',current:'FOOD LIST IS UP TO DATE',offline:'NO CONNECTION',missing:'NO LIST PUBLISHED YET',failed:'UPDATE FAILED \u2014 TRY AGAIN'}[r]);
    if($('auSt')) { $('auSt').textContent=localSummary(); warp($('auSt')); } };
  $('exGo').onclick=exportFile;
  $('dgCp').onclick=async()=>{ const t='Food Diary '+APP_VERSION+' activity log\n'+diagText();
    try{ await navigator.clipboard.writeText(t); }catch(e){ const a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.cssText='position:fixed;opacity:0;top:0';
      document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(_){} a.remove(); }
    sfx('confirm'); toast('LOG COPIED \u00b7 '+diagCount()+' LINES'); };
  arm($('dgClr'),()=>{ try{ localStorage.removeItem(DIAGK); }catch(e){} $('dgN').textContent='0 lines'; toast('LOG CLEARED'); });
  $('imGo').onclick=()=>$('imFile').click();
  if(on){
    $('syNow').onclick=async()=>{ toast('SYNCING\u2026'); const r=await ghSyncAll();
      sfx(r==='ok'?'done':'nope'); toast(r==='ok'?'SYNCED':'SYNC: '+r.toUpperCase()); render(); openSync(); };
    arm($('syOff'),()=>{ ghSave({tok:'',err:'',at:0}); refreshCog(); toast('TOKEN FORGOTTEN'); openSync(); });
    $('syLive').onchange=e=>{ const v=+e.target.value; ghSave({live:v}); sfx('confirm');
      toast(v?'LIVE UPDATES EVERY '+v+' SECONDS':'LIVE UPDATES OFF'); liveTick(); };
  } else {
    $('syPaste').onclick=async()=>{ try{ $('syTok').value=(await navigator.clipboard.readText()).trim(); }catch(e){ toast('PASTE IT BY HAND'); } };
    $('syGo').onclick=ghConnect;

}
const diagText=()=>{ try{ return JSON.parse(localStorage.getItem(DIAGK)||'[]').join('\n'); }catch(e){ return ''; } };
const diagCount=()=>{ try{ return JSON.parse(localStorage.getItem(DIAGK)||'[]').length; }catch(e){ return 0; } };
async function ghConnect(){
  const repo=$('syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$|\/+$/g,'');
  const tok=$('syTok').value.trim();
  const fail=m=>{ ghSave({tok:'',err:''}); sfx('nope'); toast(m); };
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return fail('REPO SHOULD LOOK LIKE OWNER/NAME');
  if(!/^(gh[pousr]_|github_pat_)\w+/.test(tok)) return fail('NOT A GITHUB TOKEN');
  if(repo!==ghCfg().repo){ DB.acc=cleanAcc(null); LIBSEEN.j=''; }   // owners and sharing belong to a repo
  ghSave({tok,repo,err:'',at:0,moved:0});            // a newly connected repo gets the data/ -> food/ check again
  toast('CONNECTING\u2026');
  let info;
  try{ const r=await ghReq('/repos/'+repo); if(!r.ok) return fail(r.status===401?'TOKEN REJECTED':'REPO NOT FOUND OR NOT SHARED WITH TOKEN'); info=await r.json(); }
  catch(e){ return fail('NO CONNECTION'); }
  if(!info.private) return fail('THAT REPO IS PUBLIC \u2014 USE A PRIVATE ONE');
  if(info.permissions && !info.permissions.push) return fail('TOKEN CANNOT WRITE TO THAT REPO');
  ghSave({branch:info.default_branch||'main'});
  const r=await ghSyncAll();
  sfx(r==='ok'?'done':'nope'); toast(r==='ok'?'CONNECTED \u00b7 SYNCED':'SYNC: '+r.toUpperCase());
  render(); openSync();
}
function exportFile(){
  const txt=JSON.stringify({v:1,profiles:DB.profiles}), name='food-diary-'+today()+'.json';
  const file=new File([txt],name,{type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})) return navigator.share({files:[file],title:name}).catch(()=>{});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function importText(txt){
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  if(!d || !d.profiles){ sfx('nope'); return toast('NOT A FOOD DIARY BACKUP'); }
  let n=0, x=0;
  Object.keys(d.profiles).forEach(k=>{ const nm=cleanName(k); if(!nm) return;
    const p=cleanProfile(d.profiles[k]), q=DB.profiles[nm], pid=p.pid||(q&&q.pid)||rosterPid(nm);
    if(!lvlOf(pid) || (q && !lvlP(nm))){ x++; return; }          // not shared with this phone: left out
    n++; DB.profiles[nm]=viewOf(q?mergeProfile(q,p):p); });
  unifyFoods(); save(); render(); sfx(n?'done':'nope'); toast(x?x+' PROFILE'+(x===1?'':'S')+' NOT SHARED WITH YOU, LEFT OUT':'LOADED '+n+' PROFILE'+(n===1?'':'S'));
  if(ghOn()) ghSyncAll();
}

/* ---------- start-up ---------- */
function booted(){ const r=document.documentElement; r.classList.remove('booting','snap'); r.classList.add('booted'); }
/* The dashboard as it was when the app last went to the background: shown the moment the page
   opens (a small script straight after #main), until the app itself has drawn it a moment later.
   Only today's diary, for the same profile and version; anything else starts as before. */
const SNAPK='food_log_snap';
function snapSave(){ try{
  if(DAY!==today() || PLAN || SEL || !$('main').innerHTML){ localStorage.removeItem(SNAPK); return; }
  const g=id=>{ const x=$(id); return x?x.innerHTML:''; };
  localStorage.setItem(SNAPK,JSON.stringify({v:APP_VERSION, d:today(), cur:DB.cur, main:$('main').innerHTML, hdrT:g('hdrT'), hdrS:g('hdrS'), hdrK:g('hdrK'), bolt:$('bolt').outerHTML}));
}catch(e){ try{ localStorage.removeItem(SNAPK); }catch(_){} } }
/* Interference on the headline number now and then, while nothing covers it. */
function zapLoop(){
  setTimeout(()=>{
    const el=$('kc');
    if(el && fx() && !document.hidden && !document.querySelector('#sheetWrap .sheet')){
      el.classList.remove('zap'); void el.offsetWidth; el.classList.add('zap');
    }
    zapLoop();
  },RND(5000,14000));
}

/* ---------- updates ----------
   A home-screen copy can be served from cache. On open and on return it reads the live
   file; if that is a newer build it reloads onto it, but never mid-entry or mid-sync. */
const newer=(a,b)=>{ a=a.split('.').map(Number); b=b.split('.').map(Number);
  for(let i=0;i<4;i++) if((a[i]||0)!==(b[i]||0)) return (a[i]||0)>(b[i]||0); return false; };
async function checkUpdate(){
  if(location.protocol!=='https:' && location.hostname!=='localhost') return;
  try{
    const t0=Date.now(), r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}), t1=Date.now();
    const sd=Date.parse(r.headers.get('Date')||''); if(sd) diag('clock',{phoneAheadBySeconds:Math.round(((t0+t1)/2-sd)/1000)});   // server Date has 1-second steps
    const v=(await r.text()).match(/APP_VERSION='([\d.]+)'/);
    if(v && newer(v[1],APP_VERSION) && !GHT && !GHBUSY && !document.querySelector('#sheetWrap .sheet'))
      { seen(); location.replace(location.pathname+'?v='+v[1]); }          // an update is a resume too
  }catch(e){}
}

/* ---------- wiring and start-up ---------- */
$('cog').onclick=openSettings;
/* DIARY and PLANNER are the two tabs of the dashboard: each goes to its own, or back to the top of it. */
const toTop=()=>{ try{ document.body.scrollTo({top:0,behavior:calm()?'auto':'smooth'}); }catch(e){ document.body.scrollTop=0; } };
$('plan').onclick=()=>{ if(PLAN) return toTop(); togglePlan(); };
$('bnDiary').onclick=()=>{ if(!PLAN) return toTop(); togglePlan(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(DB.theme==='auto') applyTheme('auto'); });
$('dPrev').onclick=()=>slideDay(-1);
dayCarousel(document.querySelector('header')); swipeDays($('main'),'#dfix');   // the day row drags; the cards swipe (not the food rows: they swipe to delete)
$('dNext').onclick=()=>slideDay(1);
$('dCal').onclick=ev=>{ if(PLAN) return; if(ev.detail!==0 && !ev.target.closest('#hdrT,#hdrS')) return; openCalendar(); };   // 163: only on the words (a keyboard press still works)
/* LOG: straight into Add food for the section of the moment (the heading changes it). */
function sectionNow(){
  const ms=P().meals, d=new Date(), h=d.getHours()+d.getMinutes()/60, by=w=>ms.find(m=>m.n.toLowerCase().includes(w));
  return (by(h<10.5?'breakfast':h<14.5?'lunch':h<20.5?'dinner':'snack')||ms[0]).id;
}

$('selX').onclick=endSelect;
$('selMeal').onclick=saveMeal;

arm($('selDel'),deleteSel);
$('selGo').onclick=()=>PLAN?copyPlanTo():openCalendar(copyTo,'COPY '+items(SEL.size)+' TO\u2026',true);
/* The swap button: tap moves to the next profile, hold opens Profiles. */
$('who').onclick=()=>{
  const names=Object.keys(DB.profiles).sort((a,b)=>a.localeCompare(b));
  if(names.length<2) return openProfiles(false);
  switchProfile(names[(names.indexOf(DB.cur)+1)%names.length],true);
};
bindHold($('who'),()=>openProfiles(false));
$('imFile').onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(importText); e.target.value=''; };
document.addEventListener('click',e=>{
  if(e.target.closest('button,[role=button],.veil') && Date.now()-SFXAT>150) sfx('tap');
});
const seen=()=>{ try{ localStorage.setItem('food_log_seen',Date.now()); }catch(e){} };   // see 'resumed' in the page head
addEventListener('pagehide',seen);
/* Live updates: every few seconds while the app is on screen, check the profile being viewed
   and merge in anything the other phone added. It waits while a screen is open, in select mode
   or mid-drag, and foods that arrive get the "just added" glow. */
async function liveTick(){
  clearTimeout(LIVE.t);
  const s=ghCfg().live;
  if(!s) return;
  LIVE.t=setTimeout(liveTick,s*1000);
  if(document.hidden || !ghOn() || !navigator.onLine || LIVE.busy || GHBUSY) return;
  const top=topSheet(), open=document.querySelectorAll('#sheetWrap .sheet:not(.out)').length;
  if((open && !(open===1 && top._live)) || SEL || document.querySelector('.fiw.held,.fiw.lifting')) return;   // screens that can take changes say so (_live)
  const was=top && JSON.stringify(P());
  LIVE.busy=true;
  try{
    const acc=await ghPeek('_access');                              // who sees what may have changed
    if(acc!==null && !ALLBUSY){ const was=JSON.stringify(DB.acc); await ghAccess().catch(e=>dbg('SYNC','access',e)); if(acc) LIVE.etag._access=acc;
      if(JSON.stringify(DB.acc)!==was){ await ghSyncAll(); render(); } }   // it did: everything again
    for(const name of [DB.cur,...(PLAN?withNames():[]),LIBN]){      // planning combined: their plans count too; the library for foods from hidden profiles
      if(name!==LIBN && !DB.profiles[name]) continue;
      const tag=await ghPeek(name);
      if(tag===null) continue;
      const before=new Set(entries().map(e=>e.id));
      if(await ghSync(name)!=='ok') continue;
      if(tag) LIVE.etag[name]=tag;
      if(name===DB.cur){ const came=entries().filter(e=>!before.has(e.id)).map(e=>e.id); if(came.length) FRESH=new Set(came); }
      render();
    }
    if(top && top.isConnected && JSON.stringify(P())!==was) top._live();
  } finally { LIVE.busy=false; }
}
document.addEventListener('visibilitychange',()=>{
  if(!DB) return;                                   // not started yet
  if(document.hidden){ seen(); ghFlush(); stopScan(); clearTimeout(LIVE.t); snapSave();
    if(!document.getElementById('adBody')) LOCAL.idx=LOCAL.cmp=LOCAL.codes=LOCAL.voc=null;   // the search index is rebuilt when next needed: less for iOS to hold in the background
    return; }
  setTimeout(liveTick,1500);                        // back on screen: live checks resume
  if(FOLLOW && DAY!==today()){ DAY=today(); render(); }
  if(ghOn()) ghSyncAll().then(render);
  checkUpdate();
});
setInterval(()=>{ if(FOLLOW && DAY!==today() && !document.querySelector('#sheetWrap .sheet')){ DAY=today(); render(); } },60000);
/* Each start-up step is isolated, so one failing can't keep the app from showing. */
const boot=(name,fn)=>{ try{ fn(); }catch(e){ console.error('start-up: '+name,e); } };
/* Start-up. With the dashboard copy already on screen, it waits one frame so that copy is painted
   first; otherwise it runs straight away, as it always has. */
/* The amount box (a food's or a meal's): iPhone's number pad has no return key, so a tick sits just above
   the keyboard while the box is in use, and logs it, as LOG FOOD / LOG MEAL would (Return already does). */
const KBT=document.createElement('button'); KBT.id='kbtick'; KBT.type='button'; KBT.setAttribute('aria-label','Log it');
KBT.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
document.body.appendChild(KBT);
let KBIN=null, KBLAST=null, KBLT=0;          // the box in use; the last one, for a tap that lands just after it lets go
const kbLog=t=>{ const sh=t && t.closest('.sheet'); return sh && (sh.querySelector('#qGo')||sh.querySelector('#cGo')); };
const kbPlace=()=>{ const v=window.visualViewport, gap=v?Math.max(0,innerHeight-(v.offsetTop+v.height)):0; KBT.style.bottom='calc('+gap+'px + 10px'+(gap?'':' + env(safe-area-inset-bottom, 0px)')+')'; };
const kbGo=()=>{ const t=KBIN || (Date.now()-KBLT<800 ? KBLAST : null), sh=t && t.isConnected && t.closest('.sheet'); KBT.classList.remove('on'); KBIN=null; if(!sh || !kbLog(t)) return;
  t.blur(); const b=sh.querySelector('#qGo')||sh.querySelector('#cGo'); if(b) b.click(); };   // found again after the blur: the screen may redraw on it
document.addEventListener('focusin',ev=>{ const t=ev.target; if(t && t.matches && t.matches('input.qin') && !t.disabled && kbLog(t)){ KBIN=t; kbPlace(); KBT.classList.add('on'); } });
document.addEventListener('focusout',ev=>{ if(ev.target!==KBIN) return; KBLAST=KBIN; KBLT=Date.now(); setTimeout(()=>{ if(KBIN && document.activeElement!==KBIN){ KBT.classList.remove('on'); KBIN=null; } },250); });
if(window.visualViewport){ visualViewport.addEventListener('resize',kbPlace); visualViewport.addEventListener('scroll',kbPlace); }
KBT.addEventListener('pointerdown',ev=>ev.preventDefault());   // the box keeps its focus until the tap lands
KBT.onclick=kbGo;
function startApp(){
boot('diag',()=>diag('start',{v:APP_VERSION, standalone:!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches), offlineCopy:!!(navigator.serviceWorker&&navigator.serviceWorker.controller), profile:(()=>{ try{ return JSON.parse(localStorage.getItem(KEY)).cur; }catch(e){ return ''; } })()}));
boot('load',load);
boot('verified',()=>{                                 // once: foods saved in the activity log so far are verified
  if(localStorage.getItem('food_log_vfmig')) return; const ids=new Set();
  JSON.parse(localStorage.getItem(DIAGK)||'[]').forEach(l=>{ const m=l.match(/ food saved (\{.*\})$/); if(m){ try{ ids.add(JSON.parse(m[1]).saved.id); }catch(e){} } });
  let n=0; P().foods.forEach(f=>{ if(ids.has(f.id) && !f.vf){ f.vf=f.e||Date.now(); f.e=later(...allE('foods',f.id)); n++; } });
  if(n){ shareFood(); touch(); } diag('verified from the log',n); localStorage.setItem('food_log_vfmig','1'); });
boot('open sections',()=>{ DB.fold={}; });        // opening the app starts with every section open
boot('render',render);
boot('sheets',watchSheets);
boot('local list',()=>{ localLoad().then(()=>{
  setTimeout(()=>{ if(LOCAL.d && !LOCAL.idx) localSearch('warm'); },2500);   // ready the names in the background, so the first search is quick
  setTimeout(()=>localRefresh(),4000); }); });
boot('show',()=>{ const snap=document.documentElement.classList.contains('snap'); booted(); setTimeout(()=>{ const c=document.querySelector('.crton'); if(c) c.remove(); },1200);
  requestAnimationFrame(()=>setTimeout(()=>{ try{ const n=performance.getEntriesByType('navigation')[0]||{};
    diag('shown',{ms:Math.round(performance.now()), page:Math.round(n.responseEnd||0), parsed:Math.round(n.domInteractive||0), fromSnapshot:snap}); }catch(e){} },0)); });
addEventListener('pagehide',snapSave);
boot('interference',()=>{ zapLoop(); setTimeout(rollPass,RND(1500,9000)); drawStatic(); fuzzLoop(); });
boot('sync',()=>{ refreshCog(); if(ghOn()) ghSyncAll().then(()=>{ render(); refreshCog(); }); });
boot('update',checkUpdate);
boot('live',()=>setTimeout(liveTick,3000));
boot('offline',()=>{ if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost'))
  navigator.serviceWorker.register('sw.js').catch(e=>dbg('OFFLINE','no offline copy',e)); });   // sw.js sits beside this file
boot('storage',()=>{ if(STORE==='memory') toast('NOT SAVING \u2014 SAVE A BACKUP FILE'); });
}
if(document.documentElement.classList.contains('snap')) requestAnimationFrame(()=>setTimeout(startApp,0)); else startApp();
