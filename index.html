<script>
/* Theme before first paint: crt (terminal), light, dark, or auto (follows the phone). */
function applyTheme(t){
  const r=document.documentElement, v=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;
  r.dataset.theme=v; r.classList.toggle('ios',v!=='crt');
  document.querySelector('meta[name=theme-color]').content={crt:'#020a05',light:'#f2f2f7',dark:'#000000'}[v];
  document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content=v==='light'?'default':'black-translucent';
}
try{ applyTheme(JSON.parse(localStorage.getItem('food_log_v1')).theme||'crt'); }catch(e){ applyTheme('crt'); }
/* iOS shuts a background app down after a few minutes and reloads it on return. Coming back
   within the hour is a resume: straight to the dashboard, no power-on from black. */
try{ if(Date.now()-(+localStorage.getItem('food_log_seen')||0)<36e5) document.documentElement.classList.add('resumed'); }catch(e){}
document.documentElement.classList.add('booting');
/* The home-screen app sizes its viewport short of the glass; 100vh is the whole screen there. */
if(navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
</script>

<script>
/* ---------- storage ---------- */
const KEY='food_log_v1', APP_VERSION='2026.09.26.29';     // stamped by the build: date.build
let DB=null, STORE='local';
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const DEF_GOAL={k:2200,mode:'p',pp:30,cp:40,fp:30,pg:165,cg:220,fg:73};
const DEF_MEALS=[{id:'b',n:'Breakfast'},{id:'l',n:'Lunch'},{id:'d',n:'Dinner'},{id:'s',n:'Snacks'}];
/* Detail nutrients: key, label, short label, unit, Open Food Facts field, multiplier from OFF units. */
const XN=[['su','Sugars','Sugars','g','sugars',1],['fi','Fibre','Fibre','g','fiber',1],
  ['sf','Saturated fat','Sat. fat','g','saturated-fat',1],['tf','Trans fat','Trans fat','g','trans-fat',1],
  ['pf','Polyunsaturated fat','Poly fat','g','polyunsaturated-fat',1],['mf','Monounsaturated fat','Mono fat','g','monounsaturated-fat',1],
  ['na','Sodium','Sodium','mg','sodium',1000],['ch','Cholesterol','Cholesterol','mg','cholesterol',1000]];

function num(v,lo,hi){ const n=+v; return Number.isFinite(n)&&n>=lo&&n<=hi?n:null; }
const orD=(v,d)=>v===null?d:v;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r1=v=>Math.round((+v||0)*10)/10;
const fmt=v=>Math.round(+v||0).toLocaleString('en-AU');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Profile and section names stay short and plain: profiles become file names and sections sit
   on small buttons. Food and meal names can be long and carry any punctuation. */
const cleanName=n=>String(n||'').replace(/[^\w .'-]/g,'').replace(/\s+/g,' ').trim().replace(/^_+/,'').slice(0,24);
const cleanLabel=n=>String(n||'').replace(/\s+/g,' ').trim().slice(0,80);

function blankProfile(){
  return {goal:Object.assign({},DEF_GOAL), meals:DEF_MEALS.map(m=>Object.assign({},m)),
          foods:[], combos:[], days:{}, hit:{}, del:{}, wt:{}, rh:{}, plan:blankPlan(), plans:[], at:0, ge:0, me:0, pe:0, pid:''};
}
function cleanX(x){
  const o={};
  if(x && typeof x==='object') XN.forEach(([k])=>{ const v=num(x[k],0,100000); if(v) o[k]=r1(v); });
  return o;
}
function cleanFood(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n); if(!n) return null;
  return {id:String(x.id||uid()).slice(0,24), n, sv:String(x.sv||'').trim().slice(0,40)||'1 serving',
    k:orD(num(x.k,0,9000),0), p:orD(num(x.p,0,900),0), c:orD(num(x.c,0,1500),0), f:orD(num(x.f,0,900),0),
    x:cleanX(x.x), bc:x.bc?String(x.bc).replace(/\D/g,'').slice(0,20):'',
    u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
const place=e=>e.o||e.t;                            // where an entry sits in its day
function cleanEntry(x){
  const f=cleanFood(x); if(!f) return null;
  return {id:f.id, fid:x.fid?String(x.fid).slice(0,24):'', n:f.n, sv:f.sv, k:f.k, p:f.p, c:f.c, f:f.f, x:f.x,
    q:orD(num(x.q,0.001,5000),1), w:['s','h','g'].includes(x.w)?x.w:'g', m:String(typeof x.m==='number'?'blds'[x.m]||'s':x.m||'s').slice(0,24),
    t:orD(num(x.t,0,1e13),0), e:orD(num(x.e,0,1e13),0),
    ...(x.g?{g:String(x.g).slice(0,24), gn:cleanLabel(x.gn)||'Combined'}:{}),   // logged as one combined item
    ...(num(x.o,1,1e13)?{o:num(x.o,1,1e13)}:{})};                               // its place in the day, once dragged
}
/* A saved meal: a name and the foods in it, each a full snapshot with its amount. */
function cleanCombo(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n), items=(Array.isArray(x.items)?x.items:[]).map(cleanEntry).filter(Boolean).slice(0,30)
    .map(e=>({fid:e.fid, n:e.n, sv:e.sv, k:e.k, p:e.p, c:e.c, f:e.f, x:e.x, q:e.q, w:e.w}));
  if(!n || !items.length) return null;
  const rc=String(x.rc||'').replace(/\r/g,'').slice(0,6000);
  return {id:String(x.id||uid()).slice(0,24), n, items, u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0), ...(rc.trim()?{rc}:{})};
}
function cleanGoal(g){
  g=g||{};
  const o={k:orD(num(g.k,500,10000),DEF_GOAL.k), mode:g.mode==='g'?'g':'p'};
  ['pp','cp','fp'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,100),DEF_GOAL[k]); });
  ['pg','cg','fg'].forEach(k=>{ o[k]=orD(num(Math.round(g[k]),0,1500),DEF_GOAL[k]); });
  if(o.pp+o.cp+o.fp>100) Object.assign(o,{pp:DEF_GOAL.pp,cp:DEF_GOAL.cp,fp:DEF_GOAL.fp});
  return o;
}
/* The week plan: a day of eating laid out like the dashboard, made up to 'portions' times (10 by
   default: 5 each), with its groceries' ticks. n and sid: the saved plan it was loaded as. */
const blankPlan=()=>({n:'', sid:'', portions:10, items:[], tick:{}});
function cleanPlan(x,combos){
  x=x&&typeof x==='object'?x:{};
  const o=blankPlan();
  o.n=cleanLabel(x.n); o.sid=String(x.sid||'').slice(0,24); o.portions=orD(num(Math.round(x.portions),1,200),10);
  if(Array.isArray(x.items)) o.items=x.items.map(cleanEntry).filter(Boolean).slice(0,120);
  else if(Array.isArray(x.rows)){                       // the earlier planner: saved meals per section, each with portions
    const now=Date.now();
    x.rows.forEach((r,ri)=>{ const cb=(combos||[]).find(c=>c.id===r.c); if(!cb) return; const g=uid();
      cb.items.forEach((e,i)=>o.items.push(cleanEntry(Object.assign({},e,{id:uid()+ri+i, m:r.m, t:now+ri*50+i, e:now, g, gn:cb.n}))));
      o.portions=orD(num(Math.round(r.n),1,200),o.portions); });
    o.items=o.items.filter(Boolean);
  }
  Object.keys(x.tick||{}).forEach(k=>{ if(k.length<=160 && x.tick[k]) o.tick[k]=1; });
  return o;
}
/* A saved plan, kept to reuse: merged like saved meals, the later edit wins. */
function cleanSavedPlan(x){
  if(!x || typeof x!=='object') return null;
  const n=cleanLabel(x.n); if(!n) return null;
  return {id:String(x.id||uid()).slice(0,24), n, portions:orD(num(Math.round(x.portions),1,200),10),
    items:(Array.isArray(x.items)?x.items:[]).map(cleanEntry).filter(Boolean).slice(0,120), u:orD(num(x.u,0,1e13),0), e:orD(num(x.e,0,1e13),0)};
}
function cleanProfile(p){
  const o=blankProfile();
  if(!p || typeof p!=='object') return o;
  o.goal=cleanGoal(p.goal);
  if(Array.isArray(p.meals)){
    const ms=p.meals.map(m=>({id:String(m&&m.id||'').slice(0,24), n:String(m&&m.n||'').trim().slice(0,24)}))
      .filter(m=>m.id&&m.n);
    if(ms.length) o.meals=ms.slice(0,6);
  }
  o.foods=(Array.isArray(p.foods)?p.foods:[]).map(cleanFood).filter(Boolean);
  o.combos=(Array.isArray(p.combos)?p.combos:[]).map(cleanCombo).filter(Boolean);
  o.plan=cleanPlan(p.plan,o.combos);
  Object.keys(p.days||{}).sort().forEach(d=>{
    if(!DATE_RE.test(d) || !Array.isArray(p.days[d])) return;
    const v=p.days[d].map(cleanEntry).filter(Boolean);
    if(v.length) o.days[d]=v;
  });
  Object.keys(p.hit||{}).sort().forEach(d=>{ const h=p.hit[d]; if(DATE_RE.test(d)&&h) o.hit[d]={k:!!h.k,p:!!h.p}; });
  Object.keys(p.wt||{}).sort().forEach(d=>{ const w=p.wt[d], v=w&&num(w.v,0,500), t=w&&num(w.e,1,1e13);
    if(DATE_RE.test(d) && v!==null && t) o.wt[d]={v:r1(v),e:t}; });                    // v 0: removed, kept so phones agree
  Object.keys(p.rh||{}).forEach(k=>{ const t=num(p.rh[k],1,1e13); if(k.length<=120 && t) o.rh[k]=t; });   // hidden from Recent, until logged again
  Object.keys(p.del||{}).sort().forEach(id=>{ const t=num(p.del[id],1,1e13); if(t) o.del[id]=t; });
  ['at','ge','me','pe'].forEach(k=>{ o[k]=orD(num(p[k],0,1e13),0); });
  o.plans=(Array.isArray(p.plans)?p.plans:[]).map(cleanSavedPlan).filter(Boolean).slice(0,60);
  o.pid=String(p.pid||'').slice(0,24);
  return o;
}
function cleanDB(d){
  d=d&&typeof d==='object'?d:{};
  const obj=v=>v&&typeof v==='object'?v:{};
  const out={profiles:{}, cur:String(d.cur||''), gh:obj(d.gh), fold:obj(d.fold), sfx:d.sfx!==false, idx:cleanIdx(d.idx),
    theme:['crt','light','dark','auto'].includes(d.theme)?d.theme:'crt'};
  Object.keys(d.profiles||{}).forEach(n=>{ const nm=cleanName(n); if(nm) out.profiles[nm]=cleanProfile(d.profiles[n]); });
  if(!Object.keys(out.profiles).length) out.profiles.Me=blankProfile();
  Object.values(out.profiles).forEach(p=>{ if(!p.pid) p.pid=uid(); });     // a profile's identity, whatever it is called
  if(!out.profiles[out.cur]) out.cur=Object.keys(out.profiles)[0];
  return out;
}
function load(){
  let s=null, d=null;
  try{ s=localStorage.getItem(KEY); }catch(e){ STORE='memory'; }
  try{ d=JSON.parse(s); }catch(e){}
  DB=cleanDB(d);
}
function save(){
  if(STORE!=='local') return;
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('SAVE FAILED \u2014 SAVE A BACKUP FILE NOW'); }
}
const P=()=>DB.profiles[DB.cur];
function touch(){ P().at=Date.now(); if(PLAN) P().pe=P().at; save(); ghQueue(); }

/* ---------- dates: local calendar days, never UTC ---------- */
function ymd(d){ d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today=()=>ymd();
function dObj(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function shift(s,n){ const t=dObj(s); t.setDate(t.getDate()+n); return ymd(t); }
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate=s=>{ const d=dObj(s); return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; };
const shortDay=s=>{ const d=dObj(s); return (WD[d.getDay()].slice(0,3)+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)).toUpperCase(); };
function dayName(s){ const t=today(); return s===t?'Today':s===shift(t,-1)?'Yesterday':s===shift(t,1)?'Tomorrow':WD[dObj(s).getDay()]; }
let DAY=today(), FOLLOW=true;          // FOLLOW: roll over to the new day at midnight

/* ---------- targets: calories, plus macros as a share of them or in grams ---------- */
function targets(g){ g=g||P().goal;
  return g.mode==='g' ? {k:g.k, p:g.pg, c:g.cg, f:g.fg}
    : {k:g.k, p:Math.round(g.k*g.pp/400), c:Math.round(g.k*g.cp/400), f:Math.round(g.k*g.fp/900)}; }
function shares(g){ g=g||P().goal;
  if(g.mode!=='g') return {pp:g.pp, cp:g.cp, fp:g.fp};
  const s=v=>Math.round(v/g.k*100);
  return {pp:s(g.pg*4), cp:s(g.cg*4), fp:s(g.fg*9)}; }
const KBAND=0.05;                      // calories count as on target within 5% either side
function status(t,g){
  return {kHit:t.k>=g.k*(1-KBAND) && t.k<=g.k*(1+KBAND), pHit:g.p>0 && t.p>=g.p, over:t.k>g.k*(1+KBAND)};
}

/* ---------- the numbers ---------- */
let PLAN=false;                                      // the dashboard is showing the week plan
const entries=d=>d?P().days[d]||[]:PLAN?P().plan.items:P().days[DAY]||[];
function zero(){ const t={k:0,p:0,c:0,f:0}; XN.forEach(([k])=>t[k]=0); return t; }
function totals(d){
  const t=zero();
  entries(d).forEach(e=>{ t.k+=e.k*e.q; t.p+=e.p*e.q; t.c+=e.c*e.q; t.f+=e.f*e.q;
    XN.forEach(([k])=>{ if(e.x[k]) t[k]+=e.x[k]*e.q; }); });
  return t;
}
/* Average over the logged days in the n days ending on d. */
function average(d,n){
  const t=zero(); let c=0;
  for(let i=0;i<n;i++){ const s=shift(d,-i); if(!entries(s).length) continue; c++;
    const x=totals(s); Object.keys(t).forEach(k=>t[k]+=x[k]); }
  if(c) Object.keys(t).forEach(k=>t[k]/=c);
  return {t,c};
}
function onTarget(d){ const s=status(totals(d),targets()); return s.kHit&&s.pHit; }
/* Consecutive days with anything logged, ending today. An unlogged today does not break
   the run until the day is over, so the count carries from yesterday. */
function logStreak(){
  let d=today(), n=0;
  if(!entries(d).length) d=shift(d,-1);
  while(n<3650 && entries(d).length){ n++; d=shift(d,-1); }
  return n;
}
function streak(d){ let n=0; while(n<400 && onTarget(d)){ n++; d=shift(d,-1); } return n; }
function sinceStart(){
  const k=Object.keys(P().days).sort(); if(!k.length) return 'DAY 1';
  const days=Math.round((dObj(today())-dObj(k[0]))/864e5)+1;
  return days<7?'DAY '+days:'WEEK '+(Math.floor((days-1)/7)+1)+' \u00b7 DAY '+days;
}
/* ---------- weight: one reading a day ---------- */
const wOf=d=>{ const w=P().wt[d]; return w && w.v>0 ? w.v : null; };
function wAvg(end,n){ let s=0,c=0; for(let i=0;i<n;i++){ const v=wOf(shift(end,-i)); if(v){ s+=v; c++; } } return c?{a:s/c,c}:null; }
function wLast(d){ for(let i=0;i<120;i++){ const x=shift(d,-i); if(wOf(x)) return x; } return ''; }
/* The weight nearest a day: the latest on or before it, else the first after it. */
function wNear(d){
  const before=wLast(d); if(before) return wOf(before);
  const after=Object.keys(P().wt).sort().find(x=>x>d && wOf(x)); return after?wOf(after):null;
}
/* "100 g", "250 ml", "1 bar (45 g)": a weight in the serving means log by weight. */
function gramsOf(sv){
  const m=String(sv).match(/(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i);
  const n=m?parseFloat(m[1].replace(',','.')):0;
  return n>0?{n,u:m[2].toLowerCase()}:null;
}
/* The amount as a total weight whenever the serving has one (1.5 x 75 g shows as 112.5 g);
   otherwise the servings. */
function qtyTxt(e){
  const g=gramsOf(e.sv);
  return g ? r1(e.q*g.n)+' '+g.u : (e.q===1?'':r1(e.q)+' \u00d7 ')+e.sv;
}

/* ---------- merging ----------
   Object by object: the later edit wins, and anything deleted after its last edit
   stays deleted. Targets and sections each follow whichever copy changed them last. */
function mergeProfile(a,b){
  const o=blankProfile(), newer=a.at>=b.at?a:b, by=k=>a[k]!==b[k]?(a[k]>b[k]?a:b):newer;
  o.goal=Object.assign({},by('ge').goal);
  o.meals=by('me').meals.map(m=>Object.assign({},m));
  o.plan=cleanPlan(by('pe').plan);                    // the plan on screen follows whichever phone changed it last
  o.ge=Math.max(a.ge,b.ge); o.me=Math.max(a.me,b.me); o.pe=Math.max(a.pe,b.pe);
  o.pid=a.pid&&b.pid?(a.pid<b.pid?a.pid:b.pid):a.pid||b.pid;         // copies of one profile settle on one identity
  const cut=Date.now()-120*864e5;
  [a.del,b.del].forEach(d=>Object.keys(d).forEach(id=>{ if(d[id]>cut) o.del[id]=Math.max(o.del[id]||0,d[id]); }));
  const gone=x=>o.del[x.id]>=x.e;
  const pick=(m,x)=>{ const y=m[x.id]; if(!y || x.e>y.e || (x.e===y.e && x.u>y.u)) m[x.id]=x; };
  const fm={}; b.foods.concat(a.foods).forEach(f=>pick(fm,f));
  o.foods=Object.values(fm).filter(f=>!gone(f)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  const cm={}; b.combos.concat(a.combos).forEach(x=>pick(cm,x));
  o.combos=Object.values(cm).filter(x=>!gone(x)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  const sp={}; b.plans.concat(a.plans).forEach(x=>pick(sp,x));
  o.plans=Object.values(sp).filter(x=>!gone(x)).sort((x,y)=>y.u-x.u || (x.id<y.id?-1:1));
  const days={};
  [b,a].forEach(p=>Object.keys(p.days).forEach(d=>{ days[d]=days[d]||{}; p.days[d].forEach(e=>pick(days[d],e)); }));
  Object.keys(days).forEach(d=>{
    const v=Object.values(days[d]).filter(e=>!gone(e)).sort((x,y)=>place(x)-place(y) || (x.id<y.id?-1:1));
    if(v.length) o.days[d]=v;
  });
  Object.keys(Object.assign({},a.hit,b.hit)).forEach(d=>{
    const x=a.hit[d]||{}, y=b.hit[d]||{}; o.hit[d]={k:!!(x.k||y.k), p:!!(x.p||y.p)};
  });
  Object.keys(Object.assign({},a.rh,b.rh)).forEach(k=>{ o.rh[k]=Math.max(a.rh[k]||0,b.rh[k]||0); });
  Object.keys(Object.assign({},a.wt,b.wt)).forEach(d=>{ const x=a.wt[d], y=b.wt[d]; o.wt[d]=!x?y:!y?x:y.e>x.e?y:x; });
  o.at=Math.max(a.at,b.at);
  return cleanProfile(o);
}

/* ---------- GitHub: one file per profile, food/<name>.json, in a private repo ----------
   The training log shares the repo and keeps its own training/ folder.
   A sync reads, merges and writes only if the result differs from what is there. */
const DIR='food';
function ghCfg(){ const g=DB.gh; return {tok:g.tok||'', repo:g.repo||'', branch:g.branch||'main', at:g.at||0, err:g.err||'', moved:g.moved||0,
  live:[0,5,15,30].includes(g.live)?g.live:5}; }
function ghSave(patch){ DB.gh=Object.assign(ghCfg(),patch); save(); }
function ghOn(){ const c=ghCfg(); return !!(c.tok && /^[\w.-]+\/[\w.-]+$/.test(c.repo)); }
const b64=t=>btoa(unescape(encodeURIComponent(t)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghReq(path,opt){
  opt=opt||{};
  return fetch('https://api.github.com'+path,Object.assign({},opt,{cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+ghCfg().tok, Accept:'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28'},opt.headers)}));
}
const ghUrl=n=>'/repos/'+ghCfg().repo+'/contents/'+DIR+'/'+encodeURIComponent(n)+'.json';
/* Has this profile's file changed since we last looked? A conditional request: "unchanged"
   (304) is tiny and doesn't count against GitHub's hourly limit. Answers the file's new tag,
   '' when it can't tell, or null when it's unchanged or unreachable. */
const LIVE={etag:{}, t:0, busy:false};
async function ghPeek(name){
  try{
    const r=await ghReq(ghUrl(name)+'?ref='+encodeURIComponent(ghCfg().branch),{headers:LIVE.etag[name]?{'If-None-Match':LIVE.etag[name]}:{}});
    if(r.status===304 || !r.ok) return null;
    return r.headers.get('ETag')||'';
  }catch(e){ return null; }
}
async function ghGet(name){
  const q='?ref='+encodeURIComponent(ghCfg().branch);
  const r=await ghReq(ghUrl(name)+q);
  if(r.status===404) return {sha:'',prof:null};
  if(!r.ok) throw r.status;
  const j=await r.json();
  let txt=j.content?unb64(j.content):'';
  if(!txt){                                      // over 1 MB: fetch the raw file instead
    const r2=await ghReq(ghUrl(name)+q,{headers:{Accept:'application/vnd.github.raw'}});
    if(!r2.ok) throw r2.status;
    txt=await r2.text();
  }
  let d=null; try{ d=JSON.parse(txt); }catch(e){}
  return {sha:j.sha, prof:d&&d.profile?cleanProfile(d.profile):null};
}
const ghPut=(name,prof,sha)=>ghReq(ghUrl(name),{method:'PUT',body:JSON.stringify({
  message:'log: '+name+' '+today(), branch:ghCfg().branch, sha:sha||undefined,
  content:b64(JSON.stringify({v:1,name,profile:prof}))})});
let GHT=0, GHBUSY=false, GHAGAIN=false;
function ghQueue(){ if(!ghOn()) return; clearTimeout(GHT); GHT=setTimeout(()=>{ GHT=0; ghSync(DB.cur); },1500); }
function ghFlush(){ if(GHT){ clearTimeout(GHT); GHT=0; ghSync(DB.cur); } }
const ghMsg=e=>e===401?'bad token':e===403?'token cannot write here':e===404?'repo not found':typeof e==='number'?'error '+e:'offline';
async function ghSync(name){
  if(!ghOn()) return 'off';
  if(!ghCfg().moved) return ghSyncAll();              // the move to food/ comes before anything is written
  if(GHBUSY){ GHAGAIN=true; return 'busy'; }
  GHBUSY=true;
  try{
    for(let i=0;i<3;i++){
      const rem=await ghGet(name), local=DB.profiles[name];
      if(!local || (!rem.prof && !local.at)) break;        // never used: nothing worth uploading
      const merged=rem.prof?mergeProfile(local,rem.prof):cleanProfile(local), mj=JSON.stringify(merged);
      if(mj!==JSON.stringify(local)){ DB.profiles[name]=merged; save(); if(name===DB.cur) render(); }
      if(rem.prof && mj===JSON.stringify(rem.prof)) break;
      const r=await ghPut(name,merged,rem.sha);
      if(r.status===409 || r.status===422) continue;         // moved under us: read again
      if(!r.ok) throw r.status;
      break;
    }
    ghSave({at:Date.now(),err:''});
    return 'ok';
  }catch(e){ const m=ghMsg(e); ghSave({err:m}); return m; }
  finally{ GHBUSY=false; refreshCog(); if(GHAGAIN){ GHAGAIN=false; ghQueue(); } }
}
/* Pull in profiles created on other phones, then sync every profile. */
/* ---------- the shared index: profile renames and deletes, so every phone follows them ----------
   Each entry names the profile's identity, not just its name, so it never touches a
   different profile that shares the name. Entries older than 120 days are dropped. */
function cleanIdx(x){
  const o={gone:{},renamed:{}}, cut=Date.now()-120*864e5;
  x=x&&typeof x==='object'?x:{};
  Object.entries(x.gone||{}).forEach(([n,g])=>{ const t=g&&num(g.t,cut,1e13); if(cleanName(n) && t && g.pid) o.gone[n]={t,pid:String(g.pid)}; });
  Object.entries(x.renamed||{}).forEach(([n,r])=>{ const t=r&&num(r.t,cut,1e13), to=r&&cleanName(r.to);
    if(cleanName(n) && t && to && to!==n && r.pid) o.renamed[n]={to,t,pid:String(r.pid)}; });
  return o;
}
function mergeIdx(a,b){
  const o=cleanIdx(a);
  Object.entries(b.gone).forEach(([n,g])=>{ if(!(o.gone[n] && o.gone[n].t>=g.t)) o.gone[n]=g; });
  Object.entries(b.renamed).forEach(([n,r])=>{ if(!(o.renamed[n] && o.renamed[n].t>=r.t)) o.renamed[n]=r; });
  return o;
}
function applyIdx(idx){
  Object.entries(idx.renamed).sort((x,y)=>x[1].t-y[1].t).forEach(([old,r])=>{
    const p=DB.profiles[old]; if(!p || p.pid!==r.pid) return;
    DB.profiles[r.to]=DB.profiles[r.to]?mergeProfile(DB.profiles[r.to],p):p;     // anything logged under the old name is kept
    delete DB.profiles[old];
    if(DB.cur===old) DB.cur=r.to;
  });
  Object.entries(idx.gone).forEach(([n,g])=>{ const p=DB.profiles[n]; if(p && p.pid===g.pid) delete DB.profiles[n]; });
  if(!Object.keys(DB.profiles).length) DB.profiles.Me=Object.assign(blankProfile(),{pid:uid()});
  if(!DB.profiles[DB.cur]) DB.cur=Object.keys(DB.profiles)[0];
}
const IDX='/contents/'+DIR+'/_index.json';
async function ghIndex(){
  const base='/repos/'+ghCfg().repo+IDX;
  for(let i=0;i<3;i++){
    const r=await ghReq(base+'?ref='+encodeURIComponent(ghCfg().branch));
    if(!r.ok && r.status!==404) throw r.status;
    const j=r.ok?await r.json():{};
    let remote=cleanIdx(null); try{ if(j.content) remote=cleanIdx(JSON.parse(unb64(j.content))); }catch(e){}
    const merged=mergeIdx(DB.idx,remote);
    applyIdx(merged);
    DB.idx=merged; save();
    if(JSON.stringify(merged)===JSON.stringify(remote)) return;
    const w=await ghReq(base,{method:'PUT',body:JSON.stringify({message:'profiles index',branch:ghCfg().branch,sha:j.sha||undefined,
      content:b64(JSON.stringify(merged))})});
    if(w.ok) return;
    if(w.status!==409 && w.status!==422) throw w.status;
  }
}
/* The diary used to live in data/. The first sync with this version copies whatever is
   still there into food/, once; data/ is left as it was, as a backup. A phone still on the
   old version keeps its changes locally and merges them into food/ once it updates. */
async function ghMove(){
  if(ghCfg().moved) return;
  const base='/repos/'+ghCfg().repo+'/contents/', ref='?ref='+encodeURIComponent(ghCfg().branch);
  const now=await ghReq(base+DIR+ref);
  if(now.ok && (await now.json()).some(f=>/\.json$/.test(f.name))) return ghSave({moved:1});    // already moved, by the other phone
  if(!now.ok && now.status!==404) throw now.status;
  const old=await ghReq(base+'data'+ref);
  if(old.status===404) return ghSave({moved:1});      // nothing to move: a new setup
  if(!old.ok) throw old.status;
  for(const f of await old.json()){
    if(!/\.json$/.test(f.name)) continue;
    const r=await ghReq(base+'data/'+encodeURIComponent(f.name)+ref); if(!r.ok) throw r.status;
    const j=await r.json();
    const w=await ghReq(base+DIR+'/'+encodeURIComponent(f.name),{method:'PUT',
      body:JSON.stringify({message:'Move '+f.name+' to '+DIR+'/',branch:ghCfg().branch,content:String(j.content||'').replace(/\s/g,'')})});
    if(!w.ok && w.status!==422) throw w.status;        // 422: it's already there
  }
  ghSave({moved:1});
}
/* Everything: follow renames and deletes, tidy away files they left behind, pick up
   profiles made on other phones, then sync each profile. */
let ALLBUSY=false;
async function ghSyncAll(){
  if(!ghOn() || ALLBUSY) return 'busy';
  ALLBUSY=true;
  try{
    try{ await ghMove(); await ghIndex(); }catch(e){ return ghMsg(e); }
    try{
      const r=await ghReq('/repos/'+ghCfg().repo+'/contents/'+DIR+'?ref='+encodeURIComponent(ghCfg().branch));
      const files=(r.ok?await r.json():[]).map(f=>f.name).filter(n=>/\.json$/.test(n) && n[0]!=='_').map(n=>decodeURIComponent(n.slice(0,-5)));
      for(const n of files){
        if(DB.profiles[n] || cleanName(n)!==n) continue;
        const was=DB.idx.gone[n]||DB.idx.renamed[n];
        if(!was){ DB.profiles[n]=blankProfile(); continue; }
        const rem=await ghGet(n);                          // a different profile that reuses the name is kept
        if(rem.prof && rem.prof.pid!==was.pid) DB.profiles[n]=blankProfile(); else await ghDelete(n);
      }
      save();
    }catch(e){}
    let res='ok';
    for(const n of Object.keys(DB.profiles)){ const r=await ghSync(n); if(r!=='ok') res=r; }
    return res;
  }finally{ ALLBUSY=false; }
}
async function ghDelete(name){
  try{ const rem=await ghGet(name); if(rem.sha) await ghReq(ghUrl(name),{method:'DELETE',
    body:JSON.stringify({message:'remove '+name, sha:rem.sha, branch:ghCfg().branch})}); }catch(e){}
}
function ghWhen(){
  const c=ghCfg();
  if(!c.tok) return 'not connected';
  if(c.err) return c.err;
  if(!c.at) return 'connected';
  const m=Math.round((Date.now()-c.at)/60000);
  return m<1?'synced just now':m<60?'synced '+m+'m ago':m<2880?'synced '+Math.round(m/60)+'h ago':'synced '+Math.round(m/1440)+'d ago';
}

/* ---------- text and number boxes: a tap selects everything in them ----------
   Typing then replaces it. iOS moves the cursor again as the finger lifts, so it's selected
   once more then; where a selection isn't possible the cursor goes to the end instead. */
const selectable=el=>el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([readonly]),textarea');
function selectAll(el){
  try{ el.select(); }catch(e){}
  try{ if(el.type!=='number') el.setSelectionRange(0,el.value.length); }catch(e){}
  if(!el.value) return;
  try{ if(el.selectionStart===el.selectionEnd) el.setSelectionRange(el.value.length,el.value.length); }catch(e){}
}
document.addEventListener('focusin',e=>{ const el=e.target; if(!selectable(el)) return;
  el.dataset.fresh='1'; setTimeout(()=>{ if(document.activeElement===el) selectAll(el); },0); });
document.addEventListener('pointerup',e=>{ const el=e.target; if(!selectable(el) || el.dataset.fresh!=='1') return;
  delete el.dataset.fresh; setTimeout(()=>{ if(document.activeElement===el) selectAll(el); },0); });
document.addEventListener('focusout',e=>{ if(e.target.dataset) delete e.target.dataset.fresh; });

/* ---------- sound: synthesised, nothing to load ----------
   iOS only lets audio start inside a touch, so the first tap anywhere wakes it. */
['touchend','click'].forEach(t=>document.addEventListener(t,()=>{ const c=acx(); if(c && c.state==='suspended') c.resume(); },{once:true,passive:true}));
let AC=null, BUS=null, NOISE=null, SFXAT=0;
function acx(){
  if(AC) return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C) return null;
  try{ if(navigator.audioSession) navigator.audioSession.type='ambient'; }catch(e){}
  try{ AC=new C(); }catch(e){ return null; }
  const inp=AC.createGain();
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=180;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6200; lp.Q.value=0.7;
  const dly=AC.createDelay(0.5); dly.delayTime.value=0.085;
  const fb=AC.createGain(); fb.gain.value=0.26;
  const wet=AC.createGain(); wet.gain.value=0.22;
  const out=AC.createGain(); out.gain.value=0.9;
  inp.connect(hp); hp.connect(lp); lp.connect(out);
  lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(out);
  out.connect(AC.destination);
  BUS=inp;
  return AC;
}
function hiss(dur,vol){
  const c=acx(); if(!c) return;
  if(!NOISE){
    NOISE=c.createBuffer(1,Math.floor(c.sampleRate*0.6),c.sampleRate);
    const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  const t0=c.currentTime;
  const src=c.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=0.7;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(BUS);
  src.start(t0); src.stop(t0+dur+0.05);
}
function tone(freq,dur,vol,delay,o){
  const c=acx(); if(!c) return;
  o=o||{};
  const t0=c.currentTime+(delay||0), env=c.createGain();
  [0,5].forEach((d,i)=>{
    const osc=c.createOscillator();
    osc.type=o.type||(i?'triangle':'sine');
    osc.frequency.setValueAtTime(freq,t0);
    if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t0+dur*(o.bend||0.85));
    osc.detune.value=d;
    osc.connect(env); osc.start(t0); osc.stop(t0+dur+0.05);
  });
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.exponentialRampToValueAtTime(vol,t0+(o.attack||0.012));
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  if(o.shimmer){
    const lfo=c.createOscillator(), depth=c.createGain();
    lfo.frequency.value=o.shimmer; depth.gain.value=vol*0.22;
    lfo.connect(depth); depth.connect(env.gain); lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  env.connect(BUS);
}
function dyad(a,b,dur,vol,delay,o){ tone(a,dur,vol,delay,o); tone(b,dur,vol*0.8,delay,o); }
const HISS={tap:[0.07,0.012],open:[0.13,0.016],close:[0.15,0.013],confirm:[0.34,0.018],
  record:[0.4,0.02],start:[0.6,0.02],level:[0.6,0.022],done:[0.7,0.02],nope:[0.28,0.02]};
function sfx(name){
  if(DB.sfx===false) return;
  const c=acx(); if(!c) return;
  if(c.state==='suspended') c.resume();
  SFXAT=Date.now();
  hiss(HISS[name][0],HISS[name][1]);
  switch(name){
    case 'tap':     tone(2100,0.06,0.05,0,{attack:0.006}); break;
    case 'open':    tone(1046,0.12,0.055,0,{to:1568,bend:0.6}); break;
    case 'close':   tone(1046,0.14,0.045,0,{to:660,bend:0.7}); break;
    case 'confirm': tone(1046,0.07,0.045,0); tone(1318,0.07,0.045,0.045);
                    tone(1568,0.09,0.05,0.09); tone(2093,0.22,0.05,0.135,{shimmer:10}); break;
    case 'record':  tone(1318,0.09,0.05,0); tone(1760,0.09,0.05,0.06);
                    dyad(2093,2637,0.3,0.042,0.12,{shimmer:7}); break;
    case 'start':   tone(392,0.34,0.05,0,{to:1046,bend:0.9,attack:0.03});
                    dyad(1046,1568,0.4,0.04,0.3,{shimmer:6,attack:0.05}); break;
    case 'level':   [1046,1318,1568,2093].forEach((f,i)=>tone(f,i===3?0.42:0.11,0.05,i*0.085,i===3?{shimmer:7}:{})); break;
    case 'done':    dyad(1046,1568,0.16,0.045,0); dyad(1318,1976,0.5,0.045,0.17,{shimmer:6,attack:0.04}); break;
    case 'nope':    tone(440,0.26,0.045,0,{to:196,bend:0.9,type:'triangle'}); break;
  }
}

/* ---------- touch: no pinch, no double-tap zoom, no page drag under a sheet ---------- */
['gesturestart','gesturechange','gestureend'].forEach(t=>
  document.addEventListener(t,e=>{ if(e.cancelable) e.preventDefault(); },{passive:false}));
document.addEventListener('touchstart',e=>{ if(e.touches.length>1 && e.cancelable) e.preventDefault(); },{passive:false});
/* A drag only scrolls something that has more to show: the page when it's longer than the
   screen (and no sheet is up), or a list or form inside a sheet that overflows. */
document.addEventListener('touchmove',e=>{
  if(e.touches.length<2) for(let n=e.target; n && n!==document.documentElement; n=n.parentElement){
    if(n===document.body){ if(!n.classList.contains('locked') && n.scrollHeight>n.clientHeight+1) return; break; }
    const oy=getComputedStyle(n).overflowY;
    if((oy==='auto'||oy==='scroll') && n.scrollHeight>n.clientHeight+1) return;
  }
  if(e.cancelable) e.preventDefault();
},{passive:false});
let LASTTAP=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-LASTTAP<320 && e.cancelable && !e.target.closest('input,textarea,.qrow,.pct')) e.preventDefault();
  LASTTAP=now;
},{passive:false});

/* ---------- sheets ---------- */
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const fx=()=>!calm() && !document.documentElement.classList.contains('ios');   // static, glitch and warp
const RND=(a,b)=>a+Math.random()*(b-a);
function lock(on){
  document.documentElement.classList.toggle('locked',on);
  document.body.classList.toggle('locked',on);
}
function watchSheets(){
  const wrap=document.getElementById('sheetWrap');
  new MutationObserver(()=>lock(!!wrap.querySelector('.sheet:not(.out)'))).observe(wrap,{childList:true});
}
let HITIV=0, HITEND=0;
/* Two copies of the warp on one timeline: full strength for panels, a quarter for buttons. */
const WARPS=[['uiwarp',1],['uiwarpS',0.25]];
function panelHitStop(){
  clearInterval(HITIV); clearTimeout(HITEND);
  WARPS.forEach(([id])=>{ const d=document.getElementById(id+'Disp'); if(d) d.setAttribute('scale',0); });
  document.querySelectorAll('.uistatic').forEach(x=>x.remove());
  document.querySelectorAll('.hit').forEach(x=>{ x.classList.remove('hit'); x.style.removeProperty('--gdur');
    const t=getComputedStyle(x).transform;                  // a one-frame layer so iOS repaints, no stale tiles
    x.style.transform=(t==='none'?'':t+' ')+'translateZ(0)'; requestAnimationFrame(()=>x.style.removeProperty('transform')); });
}
/* Contents torn through the displacement filter for a moment. A second warp joins one
   already running instead of cutting it short; wash adds the screen's static with it. */
function warpEls(els,wash){
  els=els.filter(Boolean);
  if(!els.length || !fx() || document.hidden) return;
  clearInterval(HITIV); clearTimeout(HITEND);
  const dur=Math.round(RND(190,260));
  els.forEach(el=>{ el.style.setProperty('--gdur',dur+'ms'); el.classList.add('hit'); });
  if(wash && !document.querySelector('.uistatic')){
    const st=document.createElement('div');
    st.className='uistatic'; st.style.setProperty('--gdur',dur+'ms');
    document.body.appendChild(st);
  }
  const F=[[62,'0.006 0.20'],[16,'0.002 0.07'],[48,'0.008 0.26'],[9,'0.001 0.04'],
           [38,'0.005 0.17'],[6,'0.002 0.09'],[24,'0.007 0.22'],[3,'0.001 0.05'],
           [14,'0.004 0.13'],[0,'0.002 0.09']];
  let i=0;
  const step=()=>{ const f=F[i++]; if(!f) return; const seed=Math.floor(RND(1,90));
    WARPS.forEach(([id,k])=>{ document.getElementById(id+'Disp').setAttribute('scale',f[0]*k);
      const n=document.getElementById(id+'Noise'); n.setAttribute('baseFrequency',f[1]); n.setAttribute('seed',seed); }); };
  step();
  HITIV=setInterval(step,Math.max(16,Math.round(dur/F.length)));
  HITEND=setTimeout(panelHitStop,dur+30);
}
function panelHit(...els){ warpEls(els,true); }
/* Just these elements, with no static wash over the rest of the screen. */
function warp(...els){ warpEls(els,false); }
function topSheet(){
  const l=document.querySelectorAll('#sheetWrap .sheet:not(.out)');
  return l.length?l[l.length-1]:null;
}
/* Replace by default. Stacking keeps the panel beneath on screen. Full panel to full
   panel is one screen changing: the backdrop stays and only the contents glitch. */
function setSheet(html,stack){
  const wrap=document.getElementById('sheetWrap');
  const had=!!wrap.querySelector('.veil:not(.out)');
  const tmp=document.createElement('div'); tmp.innerHTML=html;
  const nv=tmp.querySelector('.veil'), ns=tmp.querySelector('.sheet');
  if(stack && had){
    const depth=wrap.querySelectorAll('.sheet').length, below=topSheet();
    const box=document.createElement('div'); box.className='layer';
    nv.style.zIndex=65+depth*10; nv.classList.add('noanim','vstack'); nv.removeAttribute('id');
    ns.style.zIndex=70+depth*10;
    box.append(nv,ns);
    const same=below && ns.classList.contains('full') && below.classList.contains('full');
    if(same) ns.classList.add('cut');
    wrap.appendChild(box);
    if(same) panelHit(ns);
    lock(true);
    return;
  }
  const old=had && ns.classList.contains('full')?[...wrap.querySelectorAll('.sheet.full:not(.out)')].pop():null;
  if(old){
    old.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
    wrap.querySelectorAll('.layer').forEach(x=>x.remove());
    wrap.querySelectorAll('.veil').forEach(v=>v.classList.add('noanim','panel'));
    old.remove();
    ns.classList.add('cut');
    wrap.appendChild(ns);
    panelHit(ns);
    lock(true);
    return;
  }
  wrap.innerHTML='';
  wrap.append(nv,ns);
  lock(true);
  if(ns.classList.contains('full')) nv.classList.add('panel');
  if(had){ nv.classList.add('noanim'); ns.classList.add('swapin'); }
}
/* Close the top layer only, back to what it was opened from. */
function popSheet(){
  const wrap=document.getElementById('sheetWrap');
  const layers=wrap.querySelectorAll('.layer');
  if(!layers.length) return closeSheet();
  const box=layers[layers.length-1], sh=box.querySelector('.sheet');
  if(SCAN.host && box.contains(SCAN.host)) stopScan();
  const under=[...wrap.querySelectorAll('.sheet')].filter(x=>x!==sh).pop();
  sfx('close');
  if(sh.classList.contains('full') && under && under.classList.contains('full')){ box.remove(); panelHit(under); return; }
  sh.classList.remove('cut'); sh.classList.add('out');
  box.querySelector('.veil').classList.add('out');
  setTimeout(()=>box.remove(),380);
}
/* Close everything. Only what is on screen now is cleared when the fade ends, so a
   sheet opened meanwhile (the celebration) is left standing. */
function closeSheet(){
  stopScan();
  const wrap=document.getElementById('sheetWrap');
  panelHitStop();
  lock(false);
  if(!wrap.querySelector('.sheet')) return;
  sfx('close');
  if(FRESH.size) setTimeout(render,120);                        // foods logged while a list was open glow now

/* ---------- interference ----------
   A thin line of static rolls down the glass at uneven intervals and buzzes once per
   crossing. The canvas behind it is redrawn only while it is on screen. */
let BUZZING=false;
function buzz(el){
  if(BUZZING) return;
  BUZZING=true;
  const set=(sk,tx,go,ln,bf,bc,bb,op)=>{
    el.style.setProperty('--sk',sk); el.style.setProperty('--tx',tx); el.style.setProperty('--go',go);
    el.style.setProperty('--ln',ln); el.style.setProperty('--bf',bf); el.style.setProperty('--bc',bc);
    el.style.setProperty('--bb',bb); el.style.opacity=op;
  };
  let n=0; const shots=Math.round(RND(3,7));
  (function again(){
    set(RND(-3.4,3.4).toFixed(2)+'deg',Math.round(RND(-18,18))+'px',RND(.42,.66).toFixed(3),'1',
        RND(1.8,3).toFixed(2)+'px','1.2','1.1',RND(0.85,1.15).toFixed(2));
    if(++n<shots) return setTimeout(again,RND(28,70));
    setTimeout(()=>{ set('0deg','0px','.1','.5','.55px','1.05','1.02',RND(0.4,0.62).toFixed(2)); BUZZING=false; },RND(40,90));
  })();
}
function rollPass(){
  const el=document.querySelector('.roll');
  if(!fx()) return setTimeout(rollPass,3000);
  if(document.hidden) return setTimeout(rollPass,600);
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
  const h=Math.round(RND(14,34));
  el.style.height=h+'px';
  el.style.opacity=RND(0.4,0.62).toFixed(2);
  const from=-h-10, to=vh+10, dur=Math.round((to-from)/((vh+40)/6.8)*1000);
  const a=el.animate([{transform:'translate3d(0,'+from+'px,0)'},{transform:'translate3d(0,'+to+'px,0)'}],
                     {duration:dur,easing:'linear'});
  const bz=setTimeout(()=>buzz(el),dur*RND(0.15,0.8));
  a.onfinish=()=>{ clearTimeout(bz); el.style.opacity=0; setTimeout(rollPass,RND(6000,38000)); };
}
let NCTX=null, NIMG=null, NLAST=0;
function drawStatic(){
  const el=document.querySelector('.roll'), cv=document.getElementById('rollCv');
  if(!fx()) return setTimeout(drawStatic,1000);
  requestAnimationFrame(drawStatic);
  const now=Date.now();
  if(now-NLAST<42 || document.hidden || +el.style.opacity===0) return;
  NLAST=now;
  if(!NCTX){ NCTX=cv.getContext('2d'); NIMG=NCTX.createImageData(cv.width,cv.height); }
  const d=NIMG.data, w=cv.width, h=cv.height, hot=BUZZING;
  for(let y=0;y<h;y++){
    const base=RND(hot?40:20,hot?150:95), tear=Math.random()<(hot?0.22:0.07);
    const at=tear?Math.floor(RND(0,w)):-1, len=tear?Math.floor(RND(6,w*0.6)):0, bright=Math.random()<0.6;
    for(let x=0;x<w;x++){
      let v=base+RND(-55,55);
      if(tear && x>=at && x<at+len) v=bright?v+RND(60,130):v*0.25;
      v=Math.max(0,Math.min(255,v));
      const i=(y*w+x)*4;
      d[i]=v; d[i+1]=Math.min(255,v*1.03); d[i+2]=v*0.94; d[i+3]=255;
    }
  }
  NCTX.putImageData(NIMG,0,0);
}

/* Re-render with the named sections held at their old height while only they warp, then
   glide them to the new height; the sections below follow in step. */
function renderMorph(...mids){
  const card=id=>$('main').querySelector('.meal[data-m="'+id+'"]');
  const before=mids.map(id=>{ const c=card(id); return c?c.offsetHeight:0; });
  render();

  cards.forEach((c,i)=>{
    const h0=before[i], h1=c.offsetHeight;
    if(calm() || !h0 || h0===h1) return;

/* Holding still on el for half a second runs fn; the tap that ends the hold is swallowed. */
function bindHold(el,fn){
  let t=0, x0=0, y0=0, fired=0;
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY;
    t=setTimeout(()=>{ fired=Date.now(); try{ navigator.vibrate(30); }catch(x){} fn(); },500); });
  el.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-x0)>8 || Math.abs(e.clientY-y0)>8) clearTimeout(t); });
  ['pointerup','pointercancel'].forEach(k=>el.addEventListener(k,()=>clearTimeout(t)));
  el.addEventListener('click',e=>{ if(Date.now()-fired<600){ e.stopPropagation(); e.preventDefault(); } },true);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}

/* A sideways drag on el (dir 1 right, -1 left). Released past frac of its width, fn runs.
   The pointer is only captured once the drag is clearly sideways, so taps and vertical
   scrolling pass through untouched, and the tap that ends a drag is swallowed. */
/* The banner's height, for scrolling things into view below it and for the drag's top edge. */
function bannerH(){ const h=document.querySelector('header'); return h?h.getBoundingClientRect().bottom:0; }
function noteBanner(){ document.documentElement.style.setProperty('--hdrh',Math.round(bannerH())+'px'); }

/* Press and hold a food: let go and it's selected; keep holding and move, and it lifts to be
   dragged, to another place in its section or into another one. Once held, the page stops
   scrolling under the finger; a quick swipe still scrolls, and the side swipes still work. */
function bindLift(el,onHold,ids){
  let t=0, x0=0, y0=0, held=false, fired=0, lift=null;
  const end=()=>{ clearTimeout(t); held=false; el.classList.remove('held'); };
  el.addEventListener('pointerdown',e=>{ if(e.button) return; x0=e.clientX; y0=e.clientY; held=false; lift=null;
    t=setTimeout(()=>{ held=true; fired=Date.now(); el.classList.add('held'); try{ navigator.vibrate(30); }catch(x){} },450); });
  el.addEventListener('pointermove',e=>{
    if(!held){ if(Math.abs(e.clientX-x0)>8 || Math.abs(e.clientY-y0)>8) clearTimeout(t); return; }
    if(!lift && Math.abs(e.clientY-y0)>6){ lift=startLift(el,ids,e); try{ el.setPointerCapture(e.pointerId); }catch(x){} }
    if(lift) lift.move(e.clientY);
  });
  el.addEventListener('touchmove',e=>{ if(held) e.preventDefault(); },{passive:false});   // held: the finger moves the food, not the page
  el.addEventListener('pointerup',()=>{ const was=held, l=lift; end(); lift=null; if(l) l.drop(); else if(was) onHold(); });
  el.addEventListener('pointercancel',()=>{ end(); if(lift){ lift.cancel(); lift=null; } });
  el.addEventListener('click',e=>{ if(Date.now()-fired<600){ e.stopPropagation(); e.preventDefault(); } },true);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
/* The lifted food: a copy follows the finger, a line shows where it will land, and the page
   scrolls when the finger nears the top or bottom. */
function startLift(el,ids,e){
  const r=el.getBoundingClientRect(), dy=e.clientY-r.top, ghost=el.cloneNode(true), line=document.createElement('div');
  ghost.className='fiw lifted'; ghost.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px';
  line.className='dropline'; document.body.append(ghost,line);
  el.classList.add('lifting'); sfx('tap');
  let at=null, y=e.clientY, raf=0;
  const target=()=>{
    const meals=[...document.querySelectorAll('#main .meal')];
    const m=meals.find(s=>{ const b=s.getBoundingClientRect(); return y>=b.top && y<=b.bottom; })
      || meals.reduce((best,s)=>{ const b=s.getBoundingClientRect(), d=Math.min(Math.abs(y-b.top),Math.abs(y-b.bottom)); return !best||d<best.d?{s,d}:best; },null).s;
    const rows=[...m.querySelectorAll('.fiw')].filter(w=>w!==el), before=rows.find(w=>{ const b=w.getBoundingClientRect(); return y<b.top+b.height/2; });
    const box=(before||rows[rows.length-1]||m.querySelector('.mhl')||m).getBoundingClientRect();
    line.style.cssText='left:'+(box.left)+'px;width:'+box.width+'px;top:'+((before?box.top:box.bottom)+(before?-3:3))+'px';
    return {meal:m.dataset.m, before:before?before.dataset.ids.split(',')[0]:null};
  };
  const tick=()=>{                                   // scroll near the edges, then keep the line up to date
    const edge=70, top=bannerH(), sc=document.body, v=innerHeight;      // near the banner's edge, not the screen's
    if(y<top+edge) sc.scrollTop-=Math.ceil((top+edge-y)/6); else if(y>v-edge) sc.scrollTop+=Math.ceil((y-(v-edge))/6);
    at=target(); raf=requestAnimationFrame(tick);
  };
  const stop=()=>{ cancelAnimationFrame(raf); ghost.remove(); line.remove(); el.classList.remove('lifting'); };
  tick();
  return {
    move(ny){ y=ny; ghost.style.top=(ny-dy)+'px'; },
    drop(){ stop(); if(at) moveEntries(ids,at.meal,at.before); },
    cancel(){ stop(); }
  };
}
/* Put the foods ids before the food 'before' (or at the end) of section meal, and number the
   day so the new order syncs; moved and renumbered foods count as changed. */
function moveEntries(ids,meal,before){
  const day=entries(), was=new Set(day.filter(e=>ids.includes(e.id)).map(mealOf));
  const moving=day.filter(e=>ids.includes(e.id)), rest=day.filter(e=>!ids.includes(e.id));
  let at=before?rest.findIndex(e=>e.id===before):-1;
  if(at<0){ at=rest.length; rest.forEach((e,i)=>{ if(mealOf(e)===meal) at=i+1; }); }
  const order=[...rest.slice(0,at),...moving,...rest.slice(at)];
  if(order.every((e,i)=>e===day[i]) && moving.every(e=>mealOf(e)===meal)) return;   // dropped where it was
  const base=Math.min(...day.map(place)), now=Date.now();
  moving.forEach(e=>{ e.m=meal; });
  order.forEach((e,i)=>{ if(e.o!==base+i || moving.includes(e)){ e.o=base+i; e.e=now; } });
  setDay(order);
  touch(); sfx('confirm');
  renderMorph(...new Set([...was,meal]));
  toast(was.size===1 && was.has(meal)?'MOVED':'MOVED TO '+(P().meals.find(m=>m.id===meal)||{n:''}).n.toUpperCase());
}
function bindSwipe(el,dir,frac,fn){
  let x0=null, y0=0, on=false, go=false, moved=0;
  const reset=()=>{ x0=null; on=false; el.classList.remove('drag','ready'); el.style.setProperty('--dx','0px'); };
  el.addEventListener('pointerdown',e=>{ x0=e.clientX; y0=e.clientY; go=false; });
  el.addEventListener('pointermove',e=>{
    if(x0===null) return;
    const dx=Math.max(0,(e.clientX-x0)*dir), dy=Math.abs(e.clientY-y0);
    if(el.classList.contains('held')) return reset();
    if(!on){
      if(dy>12 && dy>dx) return reset();
      if(dx<10) return;
      on=true; el.setPointerCapture(e.pointerId); el.classList.add('drag');
    }
    el.style.setProperty('--dx',dx+'px');
    go=dx>el.offsetWidth*frac;
    el.classList.toggle('ready',go);
  });
  el.addEventListener('pointerup',()=>{ const run=on&&go; if(on) moved=Date.now(); reset(); if(run) fn(); });
  el.addEventListener('pointercancel',reset);
  el.addEventListener('click',e=>{ if(Date.now()-moved<400){ e.stopPropagation(); e.preventDefault(); } },true);
}
/* Tune an overlay control in or out with the panels' scan-in; one already on stays put. */
function tune(el,on){
  clearTimeout(el.tt);
  if(on){
    if(!el.hidden && !el.classList.contains('out')) return;
    el.hidden=false; el.classList.remove('out','in'); void el.offsetWidth; el.classList.add('in');
  } else if(!el.hidden){
    el.classList.replace('in','out');
    el.tt=setTimeout(()=>{ el.hidden=true; el.classList.remove('out'); },340);
  }
}

/* A month's average from the days logged in it. */
function mAvg(ym){ let s=0,c=0; Object.keys(P().wt).forEach(d=>{ if(d.slice(0,7)===ym && wOf(d)){ s+=wOf(d); c++; } }); return c?{a:s/c,c}:null; }
const ymShift=(ym,n)=>{ const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const months=end=>[...Array(6)].map((_,i)=>{ const k=ymShift(end,i-5), m=mAvg(k); return {k, lab:MON[+k.slice(5,7)-1].slice(0,3).toUpperCase(), v:m?r1(m.a):null}; });
function weightCard(){
  const t=today(), d=wLast(t), avg=wAvg(t,14);
  return '<div class="card wcard" id="wcard" role="button" tabindex="0"><h3>Weight<span class="chev">\u203a</span></h3>'+
    '<div class="wline"><div><span class="wv">'+(d?wOf(d).toFixed(1)+'<i> KG</i>':'\u2014')+'</span>'+
      '<span class="ws">'+(!d?'TAP TO LOG':d===t?'TODAY':d===shift(t,-1)?'YESTERDAY':shortDay(d))+'</span></div>'+
    plot(fortnight(t),'',150,40,true)+
    '<div class="wa"><span>14-DAY AVG</span><b>'+(avg?avg.a.toFixed(1)+' KG':'\u2014')+'</b><span>'+signed(wChange(t))+'</span></div></div></div>';
}
/* A line through the points that have a value, the average dashed across, and (full size)
   a scale, labels and a guide that marks the selected point. */
const PL={L:34,R:14,T:12,B:22};
function plot(pts,sel,W,H,mini){
  const vals=pts.map(p=>p.v), have=vals.filter(Boolean), n=pts.length;
  if(mini && have.length<2) return '<svg class="wg mini" viewBox="0 0 '+W+' '+H+'"></svg>';
  const lo=have.length?Math.min(...have):70, hi=have.length?Math.max(...have):80, pad=Math.max(0.4,(hi-lo)*0.25), mn=lo-pad, mx=hi+pad;
  const L=mini?3:PL.L, R=mini?3:PL.R, Tp=mini?4:PL.T, B=mini?4:PL.B;
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>Tp+(mx-v)*(H-Tp-B)/(mx-mn), avg=have.length?have.reduce((s,v)=>s+v,0)/have.length:null;
  const pts2=vals.map((v,i)=>v?[x(i),y(v)]:null).filter(Boolean), si=pts.findIndex(p=>p.k===sel);
  let s='<svg class="wg'+(mini?' mini':'')+'" viewBox="0 0 '+W+' '+H+'"'+(mini?' preserveAspectRatio="none"':'')+'>';
  if(!mini){
    [mx-pad,(mn+mx)/2,mn+pad].forEach(v=>{ s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
    pts.forEach((p,i)=>{ s+='<text data-k="'+p.k+'" class="'+(p.k===sel?'on':p.k===today()?'now':'')+'" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+p.lab+'</text>'; });
    s+='<line class="guide" x1="'+x(Math.max(0,si))+'" x2="'+x(Math.max(0,si))+'" y1="'+Tp+'" y2="'+(H-B)+'"'+(si<0?' visibility="hidden"':'')+'/>';
  }
  if(avg!==null && have.length>1) s+='<line class="avg" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(avg)+'" y2="'+y(avg)+'"/>'+
    (mini?'':'<text class="avgt" x="'+(L+4)+'" y="'+(y(avg)-5)+'" text-anchor="start">AVG '+avg.toFixed(1)+'</text>');   // left end: the newest point sits right
  if(pts2.length>1) s+='<polyline class="ln" points="'+pts2.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')+'"/>';
  vals.forEach((v,i)=>{ if(v) s+='<circle data-k="'+pts[i].k+'" class="'+(pts[i].k===sel?'dot on':'dot')+'" cx="'+x(i)+'" cy="'+y(v)+'" r="'+(mini?2:pts[i].k===sel?5.5:3.5)+'"/>'; });
  return s+'</svg>';
}
/* Move the selection on a drawn graph without redrawing it, so a finger can keep sliding. */
function markPlot(svg,k){
  const lab=svg.querySelector('text[data-k="'+k+'"]'), g=svg.querySelector('.guide');
  svg.querySelectorAll('text[data-k]').forEach(t=>t.classList.toggle('on',t===lab));
  svg.querySelectorAll('.dot').forEach(c=>{ const on=c.dataset.k===k; c.classList.toggle('on',on); c.setAttribute('r',on?5.5:3.5); });
  if(lab){ g.setAttribute('x1',lab.getAttribute('x')); g.setAttribute('x2',lab.getAttribute('x')); g.removeAttribute('visibility'); }
}
const WT={mode:'d', end:'', sel:'', mend:'', msel:'', drag:false};
function openWeight(){
  sfx('open');
  const t=today();
  WT.mode='d'; WT.sel=WT.end=t; WT.mend=WT.msel=t.slice(0,7);      // always opens on today
  setSheet(panel('Weight',picker('wMode',[['d','14 DAYS'],['m','MONTHS']],'d')+'<div id="wtBody"></div>'));
  bindPanel();
  onPick('wMode',v=>{ WT.mode=v; drawWeight(); warp($('wtBody')); });
  drawWeight();
}
/* Everything for the current range; selecting a point later only touches the graph marks,
   the stats and the controls below it. */
function drawWeight(){
  const m=WT.mode==='m', t=today(), pts=m?months(WT.mend):fortnight(WT.end), last=m?WT.mend>=t.slice(0,7):WT.end>=t;
  const first=pts[0].k, lastK=pts[pts.length-1].k, name=k=>m?MON[+k.slice(5,7)-1].slice(0,3).toUpperCase()+' '+k.slice(2,4):shortDay(k);
  $('wtBody').innerHTML='<div class="wnav"><button class="harr" id="wPrev" aria-label="Earlier">\u2039</button>'+
      '<span>'+name(first)+' \u2013 '+name(lastK)+'</span><button class="harr" id="wNext" aria-label="Later"'+(last?' disabled':'')+'>\u203a</button></div>'+
    '<div class="wstats" id="wtStats"></div><div class="wgbox" id="wtGraph">'+plot(pts,m?WT.msel:WT.sel,346,190,false)+'</div><div id="wtCtl"></div>';
  const page=n=>{
    if(m){ WT.mend=n>0?(ymShift(WT.mend,6)>t.slice(0,7)?t.slice(0,7):ymShift(WT.mend,6)):ymShift(WT.mend,-6); WT.msel=WT.mend; }
    else { WT.end=n>0?(shift(WT.end,14)>t?t:shift(WT.end,14)):shift(WT.end,-14); WT.sel=WT.end; }
    drawWeight(); warp($('wtBody'));
  };
  $('wPrev').onclick=()=>page(-1); $('wNext').onclick=()=>page(1);
  const box=$('wtGraph'), svg=box.querySelector('svg');
  const pick=ev=>{ const r=svg.getBoundingClientRect(), n=pts.length;
    const i=Math.max(0,Math.min(n-1,Math.round(((ev.clientX-r.left)*346/r.width-PL.L)/((346-PL.L-PL.R)/(n-1))))), k=pts[i].k;
    if(m ? k===WT.msel : (k===WT.sel || k>t)) return;
    m?WT.msel=k:WT.sel=k; markPlot(svg,k); paintW(); };
  box.onpointerdown=ev=>{ WT.drag=true; box.setPointerCapture(ev.pointerId); pick(ev); };
  box.onpointermove=ev=>{ if(WT.drag) pick(ev); };
  box.onpointerup=box.onpointercancel=()=>{ WT.drag=false; };
  paintW();
}
function paintW(){
  const stat=(l,v)=>'<div><span>'+l+'</span><b>'+v+'</b></div>';
  if(WT.mode==='m'){
    const a=mAvg(WT.msel), b=mAvg(ymShift(WT.msel,-1)), days=new Date(+WT.msel.slice(0,4),+WT.msel.slice(5,7),0).getDate();
    $('wtStats').innerHTML=stat('MONTH AVG',a?a.a.toFixed(1)+' KG':'\u2014')+stat('VS MONTH BEFORE',signed(a&&b?a.a-b.a:null))+stat('LOGGED',(a?a.c:0)+' / '+days);
    $('wtCtl').innerHTML='<div class="wsel">'+MON[+WT.msel.slice(5,7)-1].toUpperCase()+' '+WT.msel.slice(0,4)+'</div>'+
      '<div class="pgnote">Each point is that month\u2019s average from the days logged. Log or edit a day under 14 DAYS.</div>';
    return;
  }
  const end=WT.end, sel=WT.sel, avg=wAvg(end,14), v=wOf(sel), start=v||wNear(sel);   // a starting weight to nudge
  $('wtStats').innerHTML=stat('14-DAY AVG',avg?avg.a.toFixed(1)+' KG':'\u2014')+stat('VS PREVIOUS 14',signed(wChange(end)))+stat('LOGGED',(avg?avg.c:0)+' / 14');
  $('wtCtl').innerHTML='<div class="wsel">'+longDate(sel).toUpperCase()+(v?'':' \u00b7 NOT LOGGED')+'</div>'+
    '<div class="qrow"><button id="wDn" aria-label="Less">\u2212</button>'+
      '<input class="bignum" id="wV" type="number" enterkeyhint="done" step="0.1" placeholder="kg" value="'+(start?start.toFixed(1):'')+'">'+
      '<button id="wUp" aria-label="More">+</button></div><div class="qunit">KG</div>'+
    '<div id="wBtns" class="'+(v?'duo':'wone')+'"><button class="btn" id="wGo">'+(v?'[ UPDATE ]':'[ SAVE ]')+'</button>'+
      (v?'<button class="btn ghost" id="wDel">[ REMOVE ]</button>':'')+'</div>';
  const V=$('wV'), step=d=>{ const n=r1((+V.value||start||0)+d*0.1); if(n>0) V.value=n.toFixed(1); };
  $('wDn').onclick=()=>step(-1); $('wUp').onclick=()=>step(1);
  V.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('wGo').click(); } };   // the keyboard's Done saves
  const set=val=>{ const had=!!v; P().wt[sel]={v:val,e:Date.now()}; touch(); render(); drawWeight();
    if(had!==!!val) warp($('wBtns')); };                    // SAVE <-> UPDATE / REMOVE: only the buttons warp
  $('wGo').onclick=()=>{ const n=num(V.value,20,400); if(n===null){ sfx('nope'); return toast('ENTER A WEIGHT IN KG'); }
    V.blur(); set(r1(n)); sfx('confirm'); toast('WEIGHT SAVED \u00b7 '+n.toFixed(1)+' KG'); };
  if(v) arm($('wDel'),()=>{ set(0); toast('WEIGHT REMOVED'); });
}

function paintBreakdown(){
  const T=targets();

    const a=average(DAY,+BD); t=a.t; has=a.c>0;

  }
  const head='<div class="stat">'+esc(note.toUpperCase())+'</div>';
  if(!has){ $('bdBody').innerHTML=head+(BD==='1'?'<div class="stat">NOTHING LOGGED</div>':''); return; }
  const X=Object.fromEntries(XN.map(x=>[x[0],x]));
  const row=(l,v,u,goal,sub)=>{ const s=u==='g'?r1(v):Math.round(v);
    return s>0?'<div'+(sub?' class="sub"':'')+'><span>'+l+'</span><b>'+(u==='g'?s:fmt(s))+(goal?' / '+fmt(goal):'')+' '+u+'</b></div>':''; };

}

/* ---------- targets reached: each once a day; both together takes the screen ---------- */
function checkHits(){
  if(PLAN) return false;                               // a plan never counts towards streaks or targets
  const d=DAY, s=status(totals(d),targets()), h=P().hit[d]||{k:false,p:false};
  const newK=s.kHit&&!h.k, newP=s.pHit&&!h.p;
  if(!newK && !newP) return false;
  P().hit[d]={k:h.k||s.kHit, p:h.p||s.pHit};
  if(s.kHit && s.pHit){ setTimeout(()=>celebrate(d),460); return true; }
  sfx('record');
  try{ navigator.vibrate([40,40,80]); }catch(e){}
  toast(newP?'PROTEIN TARGET SECURED':'CALORIES ON TARGET');
  return true;
}
function celebrate(d){
  fuzz(); sfx('level'); setTimeout(()=>sfx('done'),560);
  try{ navigator.vibrate([60,40,60,40,180]); }catch(e){}
  const t=totals(d), T=targets(), n=streak(d);
  const row=(l,v,g,u,ok)=>'<div><span>'+l+'</span><b class="'+(ok?'ok':'')+'">'+v+' / '+g+' '+u+'</b></div>';
  setSheet('<div class="veil" id="veil"></div><div class="sheet fit full win">'+
    '<h3>Target acquired<button class="shx" id="ceX" aria-label="Close">\u00d7</button></h3>'+
    '<div class="grade"><div class="gletter">\u2713</div><div><div class="wtitle">'+dayName(d)+' \u00b7 clear</div>'+
      '<div class="gtxt">Calories landed on target and protein is secured.</div></div></div>'+
    '<div class="card"><div class="xled">'+row('Calories',fmt(t.k),fmt(T.k),'kcal',true)+row('Protein',Math.round(t.p),T.p,'g',true)+
      row('Carbs',Math.round(t.c),T.c,'g')+row('Fat',Math.round(t.f),T.f,'g')+'</div></div>'+
    '<div class="streak">'+(n>1?'<b>'+n+' days</b> on target in a row':'First day on target in this run')+'</div>'+
    '<button class="btn" id="ceOk">[ ACKNOWLEDGED ]</button></div>');
  $('veil').onclick=$('ceX').onclick=$('ceOk').onclick=closeSheet;
}

const ADD={meal:'', tab:'', q:'', sq:'', results:[], group:null};
/* Add food: SEARCH and SAVED share one search bar that stays where it is. On SAVED the barcode
   button folds away and + makes a meal instead of a food. into: a meal being built, in which
   case what's chosen goes into that meal, not the diary. */
function openAdd(meal,group,into,tab){
  ADD.meal=meal; ADD.group=group||null; ADD.into=into||null;
  ADD.tab=tab||'search';
  ADD.q=ADD.sq=''; ADD.results=[];
  sfx('open');
  const title='Add to '+(into?(into.n||'meal'):ADD.group?ADD.group.gn:(P().meals.find(m=>m.id===ADD.meal)||{n:'food'}).n)+(PLAN && !into?' \u00b7 Plan':'');
  setSheet(panel(esc(title),
    picker('adTabs',[['search','SEARCH'],['saved','SAVED']],ADD.tab)+
    '<div class="srch bar" id="adBar"><input class="fld" id="osQ" type="search" enterkeyhint="search" placeholder="Search foods" autocomplete="off">'+
      '<button class="btn plus" id="nfAdd" aria-label="New food">+</button><button class="btn plus scanb" id="adScan" aria-label="Scan a barcode">'+BARCODE+'</button></div>'+
    '<div id="adBody"></div>',!!into),!!into);

    : openQty({id:'', n:Q.value.trim(), sv:'', k:0, p:0, c:0, f:0, x:{}, bc:''},{create:true});

/* Wire a list: open on tap, + to add, and optionally swipe to delete. */
function bindRows(L,open,add,del){
  L.querySelectorAll('.lw').forEach(w=>{
    const i=+w.dataset.i, row=w.querySelector('.ri'), plus=w.querySelector('.qadd');
    row.onclick=ev=>{ if(!ev.target.closest('.qadd')) open(i,w); };
    if(plus) plus.onclick=ev=>{ ev.stopPropagation(); add(i); warp(row); };
    if(del) bindSwipe(w,-1,0.5,()=>{
      w.style.setProperty('--dx',w.offsetWidth+'px'); w.style.height=w.offsetHeight+'px'; void w.offsetHeight;
      w.classList.add('gone'); sfx('close'); setTimeout(()=>del(i),300);
    });
  });
}
/* A saved food's new name, carried everywhere it's shown: every diary entry of it, on any day
   (so Recent and search history follow), and every saved meal it's in. Entries logged before
   the food was saved, with its old name and serving, are linked to it too. Amounts and
   nutrition stay as they were logged. */
/* A saved food changed (its name, serving or nutrition): every diary entry of it on any day,
   and the same food inside saved meals, becomes the same, and syncs. Entries logged straight
   from a search, never linked, are recognised by the name and serving they had. An entry keeps
   its weight when the serving size changes. Answers how many were brought up to date. */
/* One entry or ingredient takes food f's values, keeping its weight if the serving size changed. */
function followFood(e,f){
  const og=gramsOf(e.sv), ng=gramsOf(f.sv);
  if(og && ng && og.u===ng.u && og.n!==ng.n) e.q=Math.round(e.q*og.n/ng.n*1000)/1000;
  Object.assign(e,{fid:f.id, n:f.n, sv:f.sv, k:f.k, p:f.p, c:f.c, f:f.f, x:Object.assign({},f.x)});
}
function spreadFood(f,oldN,oldSv){
  const now=Date.now(), mine=e=>e.fid===f.id || (!e.fid && e.n===oldN && e.sv===oldSv), put=e=>followFood(e,f);
  const same=e=>e.n===f.n && e.sv===f.sv && e.k===f.k && e.p===f.p && e.c===f.c && e.f===f.f && e.fid===f.id && JSON.stringify(e.x)===JSON.stringify(f.x);
  let n=0;
  Object.values(P().days).forEach(es=>es.forEach(e=>{ if(mine(e) && !same(e)){ put(e); e.e=now; n++; } }));
  P().combos.forEach(c=>{ let hit=false; c.items.forEach(e=>{ if(mine(e) && !same(e)){ put(e); hit=true; } }); if(hit) c.e=now; });
  P().plan.items.forEach(e=>{ if(mine(e) && !same(e)){ put(e); e.e=now; P().pe=now; } });
  P().plans.forEach(x=>{ let hit=false; x.items.forEach(e=>{ if(mine(e) && !same(e)){ put(e); hit=true; } }); if(hit) x.e=now; });
  return n;
}

function intoMeal(es){

function quickAdd(f,q,w,fid){
  const now=Date.now(), g=gramsOf(f.sv), en={id:uid(), fid:fid||'', n:f.n, sv:f.sv, k:f.k, p:f.p, c:f.c, f:f.f, x:Object.assign({},f.x),
    q:q||1, w:w||(g?'g':'s'), m:ADD.meal, t:now, e:now, ...(ADD.group||{})};

function quickMeal(c){
  if(ADD.into) return intoMeal(c.items);
  const now=Date.now(), grp=ADD.group||{g:uid(), gn:c.n};
  const es=c.items.map((e,i)=>Object.assign({},e,{id:uid()+i, x:Object.assign({},e.x), m:ADD.meal, t:now+i, e:now+i, o:0, g:grp.g, gn:grp.gn}));
  dayPush(...es); c.u=c.e=now;

/* Foods most recently logged, newest first, drawn from the log itself: anything added and
   then removed was never really eaten, so it never appears here. */
const recentKey=e=>e.fid||e.n+'|'+e.sv;
function recentFoods(){
  const seen=new Set(), out=[], rh=P().rh;
  Object.keys(P().days).filter(d=>d<=today()).forEach(d=>P().days[d].forEach(e=>out.push(e)));
  return out.sort((x,y)=>y.t-x.t).filter(e=>{ const k=recentKey(e); if(seen.has(k)) return false; seen.add(k); return !(rh[k]>=e.t); }).slice(0,11);
}
/* Saved meals and foods as one list. Tap opens one; hold opens its editor in place: rename,
   share with another profile, or delete with a second tap. */
function savedList(L,q,onFood,onMeal,ed,plus){
  const s=q.trim().toLowerCase(), has=x=>!s || x.n.toLowerCase().includes(s), az=(x,y)=>x.n.localeCompare(y.n);
  const meals=P().combos.filter(has).sort(az), foods=P().foods.filter(has).sort(az);
  const rows=meals.map(o=>({t:'meal',o})).concat(foods.map(o=>({t:'food',o})));
  const tot=o=>o.items.reduce((a,e)=>{ a.k+=e.k*e.q; a.p+=e.p*e.q; a.c+=e.c*e.q; a.f+=e.f*e.q; return a; },{k:0,p:0,c:0,f:0});
  const others=Object.keys(DB.profiles).filter(n=>n!==DB.cur);
  const row=(r,i)=>{
    const o=r.o, m=r.t==='meal', t=m?tot(o):o;
    if(o.id===ed) return '<div class="ri edit"><input class="fld" id="svE" maxlength="80" autocomplete="off" value="'+esc(o.n)+'">'+
      '<button class="rx" id="svX" aria-label="Close">\u00d7</button></div>'+
      '<div class="trio">'+(others.length?'<button class="btn ghost" id="svShare">[ SHARE ]</button>':'<span></span>')+
      '<button class="btn ghost" id="svDel">[ DELETE ]</button><button class="btn" id="svOk">[ ACCEPT ]</button></div>';
    return listRow(i,o.n,(m?o.items.length+' ITEM'+(o.items.length===1?'':'S'):esc(o.sv))+' \u00b7 P'+Math.round(t.p)+' C'+Math.round(t.c)+' F'+Math.round(t.f),t.k,plus);
  };
  const head=(label,n)=>n && rows.length>n?'<div class="lh">'+label+'</div>':'';
  L.innerHTML=rows.length?head('MEALS',meals.length)+rows.slice(0,meals.length).map(row).join('')+
      head('FOODS',foods.length)+rows.slice(meals.length).map((r,i)=>row(r,i+meals.length)).join('')
    :'<div class="stat">'+(P().foods.length||P().combos.length?'NOTHING MATCHES':'NOTHING SAVED YET')+'</div>';
  const again=id=>savedList(L,q,onFood,onMeal,id,plus);
  bindRows(L,i=>rows[i].t==='meal'?onMeal(rows[i].o):onFood(rows[i].o),
    i=>rows[i].t==='meal'?quickMeal(rows[i].o):quickAdd(rows[i].o,1,'',rows[i].o.id),
    i=>{ dropSaved(rows[i].t,rows[i].o.id); toast(rows[i].t==='meal'?'MEAL DELETED':'FOOD DELETED'); again(); });
  L.querySelectorAll('.lw').forEach(w=>bindHold(w,()=>again(rows[w.dataset.i].o.id)));
  if(!ed) return;
  const r=rows.find(x=>x.o.id===ed), I=$('svE'); if(!r) return again();
  setTimeout(()=>{ I.focus(); I.select(); },150);
  $('svX').onclick=()=>again();
  const ok=()=>{ const n=cleanLabel(I.value); if(!n){ sfx('nope'); return toast('ENTER A NAME'); }
    if(n!==r.o.n){ const was=r.o.n; r.o.n=n; r.o.e=Date.now(); if(r.t!=='meal') spreadFood(r.o,was,r.o.sv); touch(); render(); }
    sfx('confirm'); again(); };
  $('svOk').onclick=ok;
  I.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); ok(); } };
  if($('svShare')) $('svShare').onclick=()=>shareSheet(r,()=>again());
  arm($('svDel'),()=>{ dropSaved(r.t,r.o.id); toast(r.t==='meal'?'MEAL DELETED':'FOOD DELETED'); again(); });
}
/* Copy a saved food or meal into another profile's list. */
function shareSheet(r,after){
  const others=Object.keys(DB.profiles).filter(n=>n!==DB.cur).sort((a,b)=>a.localeCompare(b));
  setSheet('<div class="veil"></div><div class="sheet"><h3 class="qh">Share '+esc(r.o.n)+

    others.map((n,i)=>'<div class="ri shr" data-i="'+i+'"><span class="rm"><span class="rn">'+esc(n)+'</span></span><button class="btn shbtn">[ SHARE ]</button></div>').join('')+
    '</div></div>',true);
  lastVeil().onclick=popSheet; $('shBack').onclick=popSheet;
  topSheet().querySelectorAll('.ri[data-i]').forEach(el=>el.querySelector('.shbtn').onclick=()=>{
    const who=others[el.dataset.i], p=DB.profiles[who], now=Date.now(), copy=Object.assign(JSON.parse(JSON.stringify(r.o)),{id:uid(),u:now,e:now});
    (r.t==='meal'?p.combos:r.t==='plan'?p.plans:p.foods).unshift(copy);
    p.at=now; save(); if(ghOn()) ghSync(who);

}
function upsertFood(f){
  const L=P().foods, now=Date.now();
  let x=(f.bc && L.find(y=>y.bc===f.bc)) || L.find(y=>y.n.toLowerCase()===f.n.toLowerCase() && y.sv.toLowerCase()===f.sv.toLowerCase());
  if(x){ x.u=x.e=now; if(f.bc && !x.bc) x.bc=f.bc; return x; }
  x=cleanFood(Object.assign({},f,{id:uid(),u:now,e:now}));
  L.unshift(x);
  return x;
}
function dropSaved(kind,id){
  const k=kind==='meal'?'combos':'foods';
  P()[k]=P()[k].filter(x=>x.id!==id); P().del[id]=Date.now(); touch();
}

/* ---------- how much: by weight when the serving has one, otherwise servings ---------- */
/* Full screen, so the log button is always in view. Grams or servings when the
   serving has a weight; servings only when it does not. */
/* Tapping a food opens its label: choose the section and the amount (servings, 100 g or
   grams when the serving has a weight), and the panel shows that amount beside per 100 g.
   EDIT NUTRITION corrects the food and redraws in place. */
/* Tapping a food opens its label. The buttons sit at the top; below them the section and the
   amount (servings, 100 g or grams when the serving has a weight), then the label: that
   amount beside per 100 g. EDIT keeps the label as it is and makes its values editable,
   per serving or per 100 g, whichever the pack shows. Only foods edited here are saved. */
/* Tapping a food opens its label. Buttons at the top; then the section and the amount; then
   the label: that amount beside per 100 g. Choices the food doesn't support are greyed out.
   EDIT keeps everything where it is: the name, serving and per 100 g values become fields,
   and the serving and the amount are worked out from per 100 g. Only foods edited are saved. */
function openQty(food,o){
  const e=o.entry, stack=!!topSheet();
  setSheet('<div class="veil"></div><div class="sheet fit full qty"></div>',stack);
  const box=topSheet(), back=stack?popSheet:closeSheet;
  let saved=P().foods.find(x=>x.id===(e?e.fid:food.id)), g=gramsOf(food.sv), edit=!!o.create, h={}, bc=null;   // bc: a barcode scanned while editing, kept on SAVE
  lastVeil().onclick=()=>{ if(!edit) back(); };                 // while editing only CANCEL leaves
  /* A new food shows a worked example in every box, greyed, until it's typed over. */
  const EX={n:'e.g. Chicken breast', sv:'e.g. 1 breast (150 g)', k:'165', kj:'690', p:'31', f:'3.6', sf:'1', tf:'0', pf:'0.8',
    mf:'1.2', c:'0', su:'0', fi:'0', na:'74', ch:'85'};
  const hint=k=>o.create?EX[k]:'\u2014';
  const units=()=>{ const s=g && g.n===100;                     // a serving of exactly 100 g is no serving of its own
    return [['s','SERVINGS',s],['h','100 '+(g?g.u:'g').toUpperCase(),!g],['g',g&&g.u==='ml'?'ML':'GRAMS',!g]]; };
  const st={q:e?e.q:(o.q||1), m:e?mealOf(e):ADD.meal, w:e?e.w:(o.w||'g')};
  const fix=()=>{ if(!g) st.w='s'; else if(st.w==='s' && g.n===100) st.w='g'; };
  const cell=(v,u)=>v>0?(u==='g'?r1(v):fmt(v))+' '+u:'\u2014';
  const rows=NP.flatMap(r=>r[0]==='k'?[r,['kj','\u2013 kilojoules','kJ',1]]:[r]);
  const val=(src,k)=>k==='kj'?(src.k||0)*4.184:(src[k]||0);
  const draw=()=>{
    g=gramsOf(food.sv); fix();
    const hasBc=!!(bc||food.bc);
    const btns=edit?'<div class="trio"><button class="btn ghost" id="qCancel">[ CANCEL ]</button><button class="btn ghost" id="qBc">'+(hasBc?'[ BARCODE \u2713 ]':'[ SCAN BARCODE ]')+'</button><button class="btn" id="qSave">[ SAVE ]</button></div>'
      :e?'<div class="trio"><button class="btn" id="qGo">[ UPDATE ]</button><button class="btn ghost" id="qEdit">[ EDIT ]</button><button class="btn ghost" id="qDel">[ REMOVE ]</button></div>'
      :'<div class="duo"><button class="btn" id="qGo">[ LOG IT ]</button><button class="btn ghost" id="qEdit">[ EDIT NUTRITION ]</button></div>';
    box.innerHTML='<h3 class="qt">'+(edit?'<input class="qname" id="qN" maxlength="80" autocomplete="off" placeholder="'+(o.create?EX.n:'Name')+'" value="'+esc(food.n)+'">':'<span>'+esc(food.n)+'</span>')+
        '<button class="shx'+(stack?' back':'')+'"'+(edit?' style="visibility:hidden"':'')+' aria-label="'+(stack?'Back':'Close')+'">'+(stack?'\u00d7':'\u00d7')+'</button></h3>'+
      '<div class="qper">SERVING \u00b7 '+(edit?'<input class="qsvi" id="qS" maxlength="40" autocomplete="off" placeholder="'+(o.create?EX.sv:'e.g. 40 g or 2 slices (76 g)')+'" value="'+esc(food.sv)+'">'
        :esc(food.sv))+'</div>'+
      '<div class="qact">'+btns+'</div>'+
      '<div class="qctl'+(edit?' off':'')+'">'+
        '<div class="qamt"><input class="fld qin" id="qV" type="number" inputmode="decimal" step="any">'+picker('qUnit',units(),st.w)+'</div></div>'+
      '<div class="qlh">Nutritional information</div><div class="qlab" id="qX"></div>';
    box.querySelector('.shx').onclick=back;
    const V=$('qV'), per={s:1, h:g?g.n/100:1, g:g?g.n:1};          // amount typed = servings x per[unit]
    V.value=r1(st.q*per[st.w]);
    onPick('qUnit',v=>{ st.w=v; if(v!=='g') st.q=1/per[v];             // 1 serving, or 1 x 100 g; type 0.5 for 50 g
      V.value=r1(st.q*per[st.w]); update(); });
    V.oninput=()=>{ st.q=Math.max(0,+V.value||0)/per[st.w]; update(); };
    /* The label: the amount beside per 100 g (per serving when the food has no weight). In
       editing, the per 100 g cells are fields; typing only refreshes what's worked out from them. */
    const now=()=>{
      const sv=edit?$('qS').value:food.sv, w=gramsOf(/^\d+(\.\d+)?$/.test(sv.trim())?sv+' g':sv), grams=g?st.q*g.n:0;
      const q=edit?(grams && w?grams/w.n:1):st.q;
      const src=edit?(w?Object.fromEntries(Object.entries(h).map(([k,x])=>[k,x*w.n/100])):{}):Object.assign({},food.x,{k:food.k,p:food.p,c:food.c,f:food.f});
      return {w, q, src, amt:w?r1(q*w.n)+' '+w.u:(q===1?'1 serving':r1(q)+' servings')};
    };
    const update=()=>{ const c=now();
      $('qAh').textContent=c.amt.toUpperCase(); $('qBh').textContent=c.w||edit?'PER 100 '+(c.w?c.w.u:'g').toUpperCase():'PER SERVING';
      rows.forEach(([k,,u])=>{ $('qX').querySelector('[data-a="'+k+'"]').textContent=cell(val(c.src,k)*c.q,u); });
    };
    const paint=()=>{ const c=now(), ref=c.w?100/c.w.n:1;
      $('qX').innerHTML='<div class="lrow lhead"><span></span><b id="qAh"></b><b id="qBh"></b></div>'+

          (edit?'<input class="lin" type="number" inputmode="decimal" step="any" data-k="'+k+'" placeholder="'+hint(k)+'" value="'+(val(h,k)>0?r1(val(h,k)):'')+'">'
            :cell(val(c.src,k)*ref,u))+'</b></div>').join('');
      update();

        const n=Math.max(0,+f.value||0);

        else { h[f.dataset.k]=n; if(f.dataset.k==='k'){ const kj=$('qX').querySelector('.lin[data-k="kj"]'); kj.value=n?r1(n*4.184):''; } }
        update(); });

    if(edit){
      $('qS').oninput=update;

      $('qCancel').onclick=()=>{ if(o.create) return back(); bc=null; edit=false; draw(); warp(box); };
      $('qBc').onclick=()=>{ keep(); scanBarcode(code=>{            // attach a barcode, so a later scan finds this food
        const attach=moved=>{ bc=code; sfx('confirm'); draw(); warp($('qBc'));
          toast(moved?'BARCODE WILL MOVE HERE FROM '+moved.n.toUpperCase()+' \u00b7 SAVE TO KEEP IT':'BARCODE '+code+' \u00b7 SAVE TO KEEP IT'); };

      }); };
      $('qSave').onclick=()=>{
        const n=$('qN').value.trim().replace(/\s+/g,' ');
        let sv=$('qS').value.trim(); if(/^\d+(\.\d+)?$/.test(sv)) sv+=' g';
        const w=gramsOf(sv);

        if(!w){ sfx('nope'); return toast('ADD THE SERVING WEIGHT, E.G. 40 G'); }
        if(!(h.k>0)){ sfx('nope'); return toast('ENTER THE ENERGY PER 100 G'); }
        const s=x=>r1((x||0)*w.n/100), vals={n, sv, k:s(h.k), p:s(h.p), c:s(h.c), f:s(h.f), x:{}};
        XN.forEach(([k])=>{ if(h[k]>0) vals.x[k]=s(h[k]); });
        const grams=g?st.q*g.n:0, now=Date.now();              // the same weight is kept if the serving changes
        vals.bc=bc||food.bc||'';
        const oldN=saved?saved.n:food.n, oldSv=saved?saved.sv:food.sv;   // what it was called before this edit
        saved=saved||upsertFood(Object.assign({},vals));
        Object.assign(saved,vals,{e:now});
        if(e && !e.fid) e.fid=saved.id;                           // the entry open here is this food from now on
        const spread=spreadFood(saved,oldN,oldSv);                 // every entry and meal item of it follows
        if(o.item) followFood(e,saved);                            // and the ingredient open here
        if(vals.bc) P().foods.forEach(f=>{ if(f!==saved && f.bc===vals.bc){ f.bc=''; f.e=now; } });   // one food per barcode (confirmed on scanning)

      if(ADD.into && !e){ intoMeal([Object.assign({},food,{fid:saved?saved.id:'', q:st.q, w:st.w})]); return up(); }
      const now=Date.now(), was=e?mealOf(e):st.m;
      if(saved){ saved.u=saved.e=now; }
      if(e) Object.assign(e,{q:st.q, w:st.w, m:st.m, e:now});
      else {
        const en={id:uid(), fid:saved?saved.id:'', n:food.n, sv:food.sv, k:food.k, p:food.p, c:food.c, f:food.f, x:Object.assign({},food.x), q:st.q, w:st.w, m:st.m, t:now, e:now,
          ...(ADD.group && !o.entry?ADD.group:{})};
        dayPush(en);

      }
      const hit=checkHits();
      touch();

/* ---------- barcodes: the browser's detector where there is one, ZXing on iPhone ---------- */
const SCAN={on:false, stream:null, raf:0, zx:null, host:null, cb:null, alt:''};   // alt: what to suggest when the camera can't
const sq=s=>SCAN.host && SCAN.host.querySelector(s);
/* The camera view, drawn into host; every barcode read goes to cb. One camera at a time. */
function scanView(host,cb,alt){

    '<div class="sidle">[ CAMERA OFF ]</div></div><div class="stat"></div><div class="scres"></div>'+
    '<button class="btn scgo">[ START CAMERA ]</button><div class="src">DATA: OPEN FOOD FACTS</div>';
  SCAN.host=host; SCAN.cb=cb;
